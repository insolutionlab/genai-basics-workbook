/div><aside class=\"read\"><div class=\"rt\">검증을 도구에 맡기는 방법<\/div><p>같은 도구에게 자기 답변을 검토하게 하는 것도 하나의 방법입니다. 위 답변에서 사실 확인이 필요한 항목과 근거가 불확실한 항목을 구분해 표시해 달라고 요청하면, 스스로 취약한 지점을 드러내는 경우가 많습니다. 다만 그 결과 역시 최종 확인은 사람의 몫입니다.<\/p><\/aside>", "source": "", "bridge": "", "fields": [{"k": "f017", "cap": "답변에 숫자가 포함되어 있습니까 · 확인"}, {"k": "f018", "cap": "답변에 숫자가 포함되어 있습니까 · 메모"}, {"k": "f019", "cap": "출처나 근거가 함께 제시되었습니까 · 확인"}, {"k": "f020", "cap": "출처나 근거가 함께 제시되었습니까 · 메모"}, {"k": "f021", "cap": "법령·규정·제도가 언급되었습니까 · 확인"}, {"k": "f022", "cap": "법령·규정·제도가 언급되었습니까 · 메모"}, {"k": "f023", "cap": "내가 검증할 수 있는 내용입니까 · 확인"}, {"k": "f024", "cap": "내가 검증할 수 있는 내용입니까 · 메모"}, {"k": "f025", "cap": "그대로 보고에 쓸 수 있는 수준입니까 · 확인"}, {"k": "f026", "cap": "그대로 보고에 쓸 수 있는 수준입니까 · 메모"}, {"k": "f027", "cap": "1. 입력한 질문을 그대로 옮겨 기재합니다"}, {"k": "f028", "cap": "2. 답변에서 검증이 필요하다고 판단한 부분과 그 이유를 기재합니다"}, {"k": "f029", "cap": "3. 실제로 확인해 본 결과는 어떠했습니까"}], "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 318\" role=\"img\" aria-label=\"AI 답변이 숫자, 출처나 근거, 법령·규정·제도, 내가 검증할 수 있는 내용, 그대로 보고에 쓸 수 있는지의 다섯 단을 차례로 지나 보고에 쓸 수 있는 수준으로 좁혀지는 깔때기입니다\"><defs><marker id=\"u16-a\" viewBox=\"0 0 10 10\" refX=\"7\" refY=\"5\" markerWidth=\"9\" markerHeight=\"9\" markerUnits=\"userSpaceOnUse\" orient=\"auto\"><path d=\"M0 0L10 5L0 10Z\" class=\"f-dim\"/><\/marker><\/defs><rect x=\"150\" y=\"13\" width=\"100\" height=\"32\" rx=\"10\" class=\"f-white s-dim\" stroke-width=\"2\"/><text x=\"200\" y=\"33.9\" class=\"t-label\" text-anchor=\"middle\">AI 답변<\/text><line x1=\"200\" y1=\"47\" x2=\"200\" y2=\"58.3\" class=\"ln s-dim\" marker-end=\"url(#u16-a)\"/><polygon points=\"14,64 386,64 368.6,96 31.4,96\" class=\"f-pt\"/><text x=\"200\" y=\"84.9\" class=\"t-label\" text-anchor=\"middle\">답변에 숫자가 포함<\/text><polygon points=\"34.7,102 365.3,102 348,134 52,134\" class=\"f-pt\"/><text x=\"200\" y=\"122.9\" class=\"t-label\" text-anchor=\"middle\">출처나 근거가 함께 제시<\/text><polygon points=\"55.3,140 344.7,140 327.3,172 72.7,172\" class=\"f-pt\"/><text x=\"200\" y=\"160.9\" class=\"t-label\" text-anchor=\"middle\">법령·규정·제도가 언급<\/text><polygon points=\"76,178 324,178 306.7,210 93.3,210\" class=\"f-pt\"/><text x=\"200\" y=\"198.9\" class=\"t-label\" text-anchor=\"middle\">내가 검증할 수 있는 내용<\/text><polygon points=\"96.6,216 303.4,216 286,248 114,248\" class=\"f-pt\"/><text x=\"200\" y=\"236.9\" class=\"t-label\" text-anchor=\"middle\">그대로 보고에<\/text><line x1=\"200\" y1=\"250\" x2=\"200\" y2=\"268.3\" class=\"ln s-dim\" marker-end=\"url(#u16-a)\"/><rect x=\"116\" y=\"274\" width=\"168\" height=\"32\" rx=\"10\" class=\"f-part\"/><text x=\"200\" y=\"294.9\" class=\"t-label t-on\" text-anchor=\"middle\">보고에 쓸 수 있는 수준<\/text><\/svg>", "figcap": "받은 답변을 <b>점검 항목<\/b>으로 점검해 보십시오 · 그대로 보고에 쓸 수 있는 수준입니까"}, {"no": 14, "part": 2, "key": "WHY", "practice": false, "title": "다섯 개의 도구, 다섯 개의 쓰임", "plain": "다섯 개의 도구, 다섯 개의 쓰임", "html": "<p class=\"lead\">망치 하나로 집을 짓지는 않습니다.<\/p><p>생성형 AI 도구는 이름은 비슷해 보여도 잘하는 일이 다릅니다. 하나의 도구로 조사와 작성과 분석을 모두 해결하려 할 때 결과가 가장 나빠집니다. 일의 성격에 따라 도구를 바꾸는 것이 숙련의 첫 단계입니다.<\/p><div class=\"tw\"><table class=\"grid stack\"><thead><tr><th>도구<\/th><th>주된 쓰임<\/th><th>특징<\/th><\/tr><\/thead><tbody><tr><td class=\"lab\" data-label=\"도구\">챗GPT ChatGPT<\/td><td data-label=\"주된 쓰임\">범용 초안<\/td><td data-label=\"특징\">가장 넓은 활용 범위와 확장 기능을 갖추고 있습니다<\/td><\/tr><tr><td class=\"lab\" data-label=\"도구\">클로드 Claude<\/td><td data-label=\"주된 쓰임\">장문 문서<\/td><td data-label=\"특징\">긴 문서를 한 번에 읽고 논리 구조와 문체를 정리합니다<\/td><\/tr><tr><td class=\"lab\" data-label=\"도구\">제미나이 Gemini<\/td><td data-label=\"주된 쓰임\">구글 생태계<\/td><td data-label=\"특징\">문서·메일·캘린더와 이어져 흐름이 끊기지 않습니다<\/td><\/tr><tr><td class=\"lab\" data-label=\"도구\">퍼플렉시티 Perplexity<\/td><td data-label=\"주된 쓰임\">출처 검색<\/td><td data-label=\"특징\">실시간 검색 결과와 근거 링크를 함께 제시합니다<\/td><\/tr><tr><td class=\"lab\" data-label=\"도구\">제미나이 노트북 Gemini Notebook<\/td><td data-label=\"주된 쓰임\">자료 분석<\/td><td data-label=\"특징\">회사 기준과 승인 절차를 확인한 자료를 등록하고, 자료에서 확인되지 않는 내용은 추정하지 않도록 요청합니다<\/td><\/tr><\/tbody><\/table><\/div><h3 class=\"sec\">세 가지 역할로 압축하면<\/h3><div class=\"tw\"><table class=\"grid stack\"><thead><tr><th>조사와 팩트체크<\/th><th>문서 작성과 구조화<\/th><th>내부 자료 분석<\/th><\/tr><\/thead><tbody><tr><td data-label=\"조사와 팩트체크\">실시간 검색과 출처 자동 제시로 근거를 확보하는 1차 검증 도구입니다<\/td><td data-label=\"문서 작성과 구조화\">긴 맥락을 유지하며 보고서와 공문의 논리 구조를 구성하는 도구입니다<\/td><td data-label=\"내부 자료 분석\">승인된 자료를 기준으로 질문하고, 답변의 근거를 대조하는 자료 기반 분석 도구입니다<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"read\"><div class=\"rt\">무료와 유료의 차이<\/div><p>오늘 과정은 무료 버전을 기준으로 진행합니다. 유료 버전은 대체로 더 긴 문서 처리, 더 많은 사용량, 추가 기능에서 차이가 있습니다. 조직 도입을 검토한다면 기능 차이보다 데이터 처리 정책과 관리자 통제 기능을 먼저 확인합니다.<\/p><\/aside><h3 class=\"sec\">도구를 옮겨 다니는 것이 비효율처럼 느껴진다면<\/h3><p>여러 도구를 오가는 일이 번거롭게 느껴질 수 있습니다. 그러나 실제로 시간을 잡아먹는 것은 도구를 바꾸는 몇 초보다 맞지 않는 도구로 얻은 결과를 다시 손보는 몇십 분입니다. 출처가 필요한 조사를 문서 작성 도구에 맡기면 근거 없는 문장을 검증하는 데 훨씬 많은 시간을 쓰게 됩니다.<\/p><p>처음에는 두 가지만 정합니다. 조사할 때 쓸 도구 하나와 문서를 만들 때 쓸 도구 하나입니다. 이 둘만 구분해도 결과의 신뢰도가 눈에 띄게 올라갑니다. 세 번째, 네 번째 도구는 필요를 느낀 다음에 늘려도 늦지 않습니다.<\/p>", "source": "", "bridge": "", "fields": [], "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 272\" role=\"img\" aria-label=\"ChatGPT, Claude, Gemini는 문서 작성과 구조화로, Perplexity는 조사와 팩트체크로, Gemini Notebook은 내부 자료 분석으로 이어지는 다섯 도구와 세 역할의 연결도입니다\"><defs><marker id=\"u17-a\" viewBox=\"0 0 10 10\" refX=\"7\" refY=\"5\" markerWidth=\"9\" markerHeight=\"9\" markerUnits=\"userSpaceOnUse\" orient=\"auto\"><path d=\"M0 0L10 5L0 10Z\" class=\"f-dim\"/><\/marker><\/defs><text x=\"85\" y=\"28.3\" class=\"t-small\" text-anchor=\"middle\">다섯 개의 도구<\/text><text x=\"312\" y=\"28.3\" class=\"t-small\" text-anchor=\"middle\">세 가지 역할<\/text><path d=\"M160 56C198 56 198 90 232.3 90\" class=\"ln s-dim\" marker-end=\"url(#u17-a)\"/><path d=\"M160 100C198 100 198 100 232.3 100\" class=\"ln s-dim\" marker-end=\"url(#u17-a)\"/><path d=\"M160 144C198 144 198 110 232.3 110\" class=\"ln s-dim\" marker-end=\"url(#u17-a)\"/><path d=\"M160 188C198 188 198 176 232.3 176\" class=\"ln s-dim\" marker-end=\"url(#u17-a)\"/><path d=\"M160 232C198 232 198 240 232.3 240\" class=\"ln s-dim\" marker-end=\"url(#u17-a)\"/><rect x=\"12\" y=\"41\" width=\"146\" height=\"30\" rx=\"10\" class=\"f-tint\"/><text x=\"85\" y=\"60.9\" class=\"t-label\" text-anchor=\"middle\">ChatGPT<\/text><rect x=\"12\" y=\"85\" width=\"146\" height=\"30\" rx=\"10\" class=\"f-tint\"/><text x=\"85\" y=\"104.9\" class=\"t-label\" text-anchor=\"middle\">Claude<\/text><rect x=\"12\" y=\"129\" width=\"146\" height=\"30\" rx=\"10\" class=\"f-tint\"/><text x=\"85\" y=\"148.9\" class=\"t-label\" text-anchor=\"middle\">Gemini<\/text><rect x=\"12\" y=\"173\" width=\"146\" height=\"30\" rx=\"10\" class=\"f-tint\"/><text x=\"85\" y=\"192.9\" class=\"t-label\" text-anchor=\"middle\">Perplexity<\/text><rect x=\"12\" y=\"217\" width=\"146\" height=\"30\" rx=\"10\" class=\"f-tint\"/><text x=\"85\" y=\"236.9\" class=\"t-label\" text-anchor=\"middle\">Gemini Notebook<\/text><rect x=\"236\" y=\"80\" width=\"152\" height=\"40\" rx=\"10\" class=\"f-part\"/><text x=\"312\" y=\"104.9\" class=\"t-label t-on\" text-anchor=\"middle\">문서 작성과 구조화<\/text><rect x=\"236\" y=\"156\" width=\"152\" height=\"40\" rx=\"10\" class=\"f-part\"/><text x=\"312\" y=\"180.9\" class=\"t-label t-on\" text-anchor=\"middle\">조사와 팩트체크<\/text><rect x=\"236\" y=\"220\" width=\"152\" height=\"40\" rx=\"10\" class=\"f-part\"/><text x=\"312\" y=\"244.9\" class=\"t-label t-on\" text-anchor=\"middle\">내부 자료 분석<\/text><\/svg>", "figcap": "다섯 개의 도구를 <b>세 가지 역할<\/b>로 압축하면 · 일의 성격에 따라 도구를 바꾸는 것이 숙련의 첫 단계"}, {"no": 15, "part": 2, "key": "WHY", "practice": false, "title": "도구 선택의 빠른 판단 기준", "plain": "도구 선택의 빠른 판단 기준", "html": "<p class=\"lead\">고민이 길어지면 도구를 쓰지 않게 됩니다. 판단 기준을 미리 정해 배치합니다.<\/p><div class=\"tw\"><table class=\"grid stack\"><thead><tr><th>이런 상황이라면<\/th><th>이 도구로<\/th><\/tr><\/thead><tbody><tr><td data-label=\"이런 상황이라면\">최신 정보와 출처가 필요합니다<\/td><td data-label=\"이 도구로\">출처를 제시하는 검색형 도구를 활용합니다<\/td><\/tr><tr><td data-label=\"이런 상황이라면\">보고서와 공문의 구조를 잡아야 합니다<\/td><td data-label=\"이 도구로\">장문 처리에 강한 문서형 도구를 활용합니다<\/td><\/tr><tr><td data-label=\"이런 상황이라면\">내부 자료만으로 답을 얻어야 합니다<\/td><td data-label=\"이 도구로\">업로드 자료 기반 분석 도구를 활용합니다<\/td><\/tr><tr><td data-label=\"이런 상황이라면\">메일과 문서 작업이 이어져 있습니다<\/td><td data-label=\"이 도구로\">생태계 연동형 도구를 활용합니다<\/td><\/tr><tr><td data-label=\"이런 상황이라면\">무엇을 쓸지 모르겠습니다<\/td><td data-label=\"이 도구로\">범용 도구로 시작한 뒤 필요에 따라 옮깁니다<\/td><\/tr><\/tbody><\/table><\/div><h3 class=\"sec\">업무 유형별 배치 예시<\/h3><div class=\"tw\"><table class=\"grid stack\"><thead><tr><th>업무<\/th><th>1단계<\/th><th>2단계<\/th><\/tr><\/thead><tbody><tr><td class=\"lab\" data-label=\"업무\">시장·정책 조사<\/td><td data-label=\"1단계\">검색형 도구로 근거 확보<\/td><td data-label=\"2단계\">문서형 도구로 보고서 구조화<\/td><\/tr><tr><td class=\"lab\" data-label=\"업무\">규정·계약 검토<\/td><td data-label=\"1단계\">문서형 도구로 전문 요약<\/td><td data-label=\"2단계\">쟁점별 확인 질문으로 심화<\/td><\/tr><tr><td class=\"lab\" data-label=\"업무\">내부 보고서 분석<\/td><td data-label=\"1단계\">자료 기반 도구에 업로드<\/td><td data-label=\"2단계\">인용 근거를 역추적해 확인<\/td><\/tr><tr><td class=\"lab\" data-label=\"업무\">메일 회신 정리<\/td><td data-label=\"1단계\">생태계 연동 도구로 초안<\/td><td data-label=\"2단계\">톤과 길이를 지시로 조정<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box\"><div class=\"bt\">판단이 서지 않을 때의 기본값<\/div><p>사실이 중요한 일은 출처가 나오는 도구로, 표현이 중요한 일은 문서에 강한 도구로, 보안이 중요한 일은 회사 기준과 승인 절차를 확인한 뒤 자료 기반 도구를 활용합니다. 이 세 문장이 대부분의 상황을 정리해 줍니다.<\/p><\/div><h3 class=\"sec\">도구 선택보다 중요한 것<\/h3><p>도구를 고르는 기준을 정리했지만, 결과를 좌우하는 요인은 도구보다 입력의 품질입니다. 잘 맞는 도구에 막연한 질문을 넣으면 맞지 않는 도구에 잘 쓴 질문을 넣은 것보다 나쁜 결과가 나옵니다. 도구 선택은 출발선을 조금 앞당기는 일이고, 질문의 설계는 도착 지점을 바꾸는 일입니다.<\/p><aside class=\"read\"><div class=\"rt\">조직에서 도구를 통일해야 할 때<\/div><p>팀 단위로 도구를 정할 때는 기능 비교표보다 세 가지를 먼저 확인합니다. 입력한 데이터가 어떻게 처리되는지, 관리자가 사용 현황을 확인할 수 있는지, 그리고 우리가 이미 쓰는 문서 시스템과 이어지는지입니다. 이 세 가지가 정해지면 나머지 기능 차이는 대체로 부차적입니다.<\/p><\/aside>", "source": "", "bridge": "", "fields": [], "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 332\" role=\"img\" aria-label=\"최신 정보와 출처가 필요한지, 내부 자료만으로 답해야 하는지, 보고서와 공문의 구조를 잡는 일인지를 차례로 물어 맞으면 오른쪽 도구로 가고, 판단이 서지 않으면 범용 도구로 시작하는 결정 흐름입니다\"><defs><marker id=\"u18-a\" viewBox=\"0 0 10 10\" refX=\"7\" refY=\"5\" markerWidth=\"9\" markerHeight=\"9\" markerUnits=\"userSpaceOnUse\" orient=\"auto\"><path d=\"M0 0L10 5L0 10Z\" class=\"f-part\"/><\/marker><marker id=\"u18-b\" viewBox=\"0 0 10 10\" refX=\"7\" refY=\"5\" markerWidth=\"9\" markerHeight=\"9\" markerUnits=\"userSpaceOnUse\" orient=\"auto\"><path d=\"M0 0L10 5L0 10Z\" class=\"f-dim\"/><\/marker><\/defs><text x=\"123\" y=\"26.3\" class=\"t-small\" text-anchor=\"middle\">이런 상황이라면<\/text><text x=\"328\" y=\"26.3\" class=\"t-small\" text-anchor=\"middle\">이 도구로<\/text><line x1=\"123\" y1=\"102\" x2=\"123\" y2=\"116.3\" class=\"ln s-dim\" marker-end=\"url(#u18-b)\"/><path d=\"M133 106.5l7 7M140 106.5l-7 7\" class=\"ln s-dim\"/><polygon points=\"123,36 232,68 123,100 14,68\" class=\"f-pt s-part\" stroke-width=\"2\"/><text x=\"123\" y=\"72.9\" class=\"t-label\" text-anchor=\"middle\">최신 정보와 출처가 필요<\/text><line x1=\"235\" y1=\"68\" x2=\"264.3\" y2=\"68\" class=\"ln-b s-part\" marker-end=\"url(#u18-a)\"/><path d=\"M244 55l3.5 3.5l7 -7\" class=\"ln s-part\"/><rect x=\"268\" y=\"46\" width=\"120\" height=\"44\" rx=\"10\" class=\"f-tint\"/><text class=\"t-label\" text-anchor=\"middle\"><tspan x=\"328\" y=\"64.4\">출처를 제시하는<\/tspan><tspan x=\"328\" y=\"81.4\">검색형 도구<\/tspan><\/text><line x1=\"123\" y1=\"186\" x2=\"123\" y2=\"200.3\" class=\"ln s-dim\" marker-end=\"url(#u18-b)\"/><path d=\"M133 190.5l7 7M140 190.5l-7 7\" class=\"ln s-dim\"/><polygon points=\"123,120 232,152 123,184 14,152\" class=\"f-pt s-part\" stroke-width=\"2\"/><text x=\"123\" y=\"156.9\" class=\"t-label\" text-anchor=\"middle\">내부 자료만으로<\/text><line x1=\"235\" y1=\"152\" x2=\"264.3\" y2=\"152\" class=\"ln-b s-part\" marker-end=\"url(#u18-a)\"/><path d=\"M244 139l3.5 3.5l7 -7\" class=\"ln s-part\"/><rect x=\"268\" y=\"130\" width=\"120\" height=\"44\" rx=\"10\" class=\"f-tint\"/><text class=\"t-label\" text-anchor=\"middle\"><tspan x=\"328\" y=\"148.4\">업로드 자료 기반<\/tspan><tspan x=\"328\" y=\"165.4\">분석 도구<\/tspan><\/text><polygon points=\"123,204 232,236 123,268 14,236\" class=\"f-pt s-part\" stroke-width=\"2\"/><text x=\"123\" y=\"240.9\" class=\"t-label\" text-anchor=\"middle\">보고서와 공문의 구조<\/text><line x1=\"235\" y1=\"236\" x2=\"264.3\" y2=\"236\" class=\"ln-b s-part\" marker-end=\"url(#u18-a)\"/><path d=\"M244 223l3.5 3.5l7 -7\" class=\"ln s-part\"/><rect x=\"268\" y=\"214\" width=\"120\" height=\"44\" rx=\"10\" class=\"f-tint\"/><text class=\"t-label\" text-anchor=\"middle\"><tspan x=\"328\" y=\"232.4\">장문 처리에 강한<\/tspan><tspan x=\"328\" y=\"249.4\">문서형 도구<\/tspan><\/text><path d=\"M123 270V300H264.3\" class=\"ln s-dim\" marker-end=\"url(#u18-b)\"/><path d=\"M133 279l7 7M140 279l-7 7\" class=\"ln s-dim\"/><text x=\"203.5\" y=\"290.3\" class=\"t-small\" text-anchor=\"middle\">판단이 서지 않을 때<\/text><rect x=\"268\" y=\"280\" width=\"120\" height=\"40\" rx=\"10\" class=\"f-tint\"/><text x=\"328\" y=\"304.9\" class=\"t-label\" text-anchor=\"middle\">범용 도구로 시작<\/text><\/svg>", "figcap": "고민이 길어지면 도구를 쓰지 않게 됩니다 · <b>판단 기준<\/b>을 미리 정해 둡니다"}, {"no": 16, "part": 2, "key": "WHY", "practice": true, "title": "생각해보기 : 내 업무를 도구 위에 배치하기", "plain": "생각해보기 : 내 업무를 도구 위에 배치하기", "html": "<p class=\"lead\">목적은 도구 사용보다 내 업무의 도구 배치도를 작성하는 데 있습니다.<\/p><p>이번 주에 처리해야 할 업무 네 가지를 적고, 각각 어떤 성격의 도구가 맞는지 배치합니다. 도구 이름을 몰라도 조사형, 문서형, 분석형 가운데 하나로 적으면 충분합니다.<\/p><div class=\"tw\"><table class=\"grid stack form\"><thead><tr><th>이번 주 업무<\/th><th>도구 성격<\/th><th>그 도구를 고른 이유<\/th><\/tr><\/thead><tbody><tr><td class=\"in\" data-label=\"이번 주 업무\"><textarea rows=\"2\" data-k=\"f030\" data-cap=\"1번 · 이번 주 업무\" aria-label=\"1번 · 이번 주 업무\"><\/textarea><\/td><td class=\"in\" data-label=\"도구 성격\"><textarea rows=\"2\" data-k=\"f031\" data-cap=\"1번 · 도구 성격\" aria-label=\"1번 · 도구 성격\"><\/textarea><\/td><td class=\"in\" data-label=\"그 도구를 고른 이유\"><textarea rows=\"2\" data-k=\"f032\" data-cap=\"1번 · 그 도구를 고른 이유\" aria-label=\"1번 · 그 도구를 고른 이유\"><\/textarea><\/td><\/tr><tr><td class=\"in\" data-label=\"이번 주 업무\"><textarea rows=\"2\" data-k=\"f033\" data-cap=\"2번 · 이번 주 업무\" aria-label=\"2번 · 이번 주 업무\"><\/textarea><\/td><td class=\"in\" data-label=\"도구 성격\"><textarea rows=\"2\" data-k=\"f034\" data-cap=\"2번 · 도구 성격\" aria-label=\"2번 · 도구 성격\"><\/textarea><\/td><td class=\"in\" data-label=\"그 도구를 고른 이유\"><textarea rows=\"2\" data-k=\"f035\" data-cap=\"2번 · 그 도구를 고른 이유\" aria-label=\"2번 · 그 도구를 고른 이유\"><\/textarea><\/td><\/tr><tr><td class=\"in\" data-label=\"이번 주 업무\"><textarea rows=\"2\" data-k=\"f036\" data-cap=\"3번 · 이번 주 업무\" aria-label=\"3번 · 이번 주 업무\"><\/textarea><\/td><td class=\"in\" data-label=\"도구 성격\"><textarea rows=\"2\" data-k=\"f037\" data-cap=\"3번 · 도구 성격\" aria-label=\"3번 · 도구 성격\"><\/textarea><\/td><td class=\"in\" data-label=\"그 도구를 고른 이유\"><textarea rows=\"2\" data-k=\"f038\" data-cap=\"3번 · 그 도구를 고른 이유\" aria-label=\"3번 · 그 도구를 고른 이유\"><\/textarea><\/td><\/tr><tr><td class=\"in\" data-label=\"이번 주 업무\"><textarea rows=\"2\" data-k=\"f039\" data-cap=\"4번 · 이번 주 업무\" aria-label=\"4번 · 이번 주 업무\"><\/textarea><\/td><td class=\"in\" data-label=\"도구 성격\"><textarea rows=\"2\" data-k=\"f040\" data-cap=\"4번 · 도구 성격\" aria-label=\"4번 · 도구 성격\"><\/textarea><\/td><td class=\"in\" data-label=\"그 도구를 고른 이유\"><textarea rows=\"2\" data-k=\"f041\" data-cap=\"4번 · 그 도구를 고른 이유\" aria-label=\"4번 · 그 도구를 고른 이유\"><\/textarea><\/td><\/tr><\/tbody><\/table><\/div><div class=\"wrow\"><label class=\"wcap\">네 가지 중 오늘 직접 시도해 볼 업무 하나를 고르고, 그 이유를 기재합니다<\/label><textarea class=\"w\" rows=\"5\" data-k=\"f042\" data-cap=\"네 가지 중 오늘 직접 시도해 볼 업무 하나를 고르고, 그 이유를 기재합니다\" aria-label=\"네 가지 중 오늘 직접 시도해 볼 업무 하나를 고르고, 그 이유를 기재합니다\"><\/textarea><\/div><aside class=\"read\"><div class=\"rt\">배치도를 팀과 공유하면<\/div><p>도구 배치는 개인의 취향처럼 보이지만 팀 단위로 맞추면 효과가 커집니다. 같은 종류의 업무를 팀원마다 다른 도구로 처리하면 결과물의 형식이 제각각이 되고, 비교와 누적이 어려워집니다. 팀의 기본 도구를 정해 두면 결과물의 모양이 일정해집니다.<\/p><\/aside><h3 class=\"sec\">배치가 끝난 다음에 할 일<\/h3><p>도구 배치도를 그렸다면 다음은 순서를 정하는 일입니다. 네 가지 업무를 동시에 바꾸려 하면 대개 하나도 정착하지 못합니다. 가장 자주 반복되고 실패해도 손해가 적은 업무 하나를 골라 먼저 시작하합니다. 첫 성공의 경험이 나머지 세 가지를 끌고 갑니다.<\/p><p>먼저 시작할 업무를 고를 때는 남에게 보여 주기 전에 스스로 확인할 수 있는 업무가 좋습니다. 바로 외부로 나가는 문서는 검증 부담이 커서 초기 실험에 적합하지 않습니다.<\/p>", "source": "", "bridge": "", "fields": [{"k": "f030", "cap": "1번 · 이번 주 업무"}, {"k": "f031", "cap": "1번 · 도구 성격"}, {"k": "f032", "cap": "1번 · 그 도구를 고른 이유"}, {"k": "f033", "cap": "2번 · 이번 주 업무"}, {"k": "f034", "cap": "2번 · 도구 성격"}, {"k": "f035", "cap": "2번 · 그 도구를 고른 이유"}, {"k": "f036", "cap": "3번 · 이번 주 업무"}, {"k": "f037", "cap": "3번 · 도구 성격"}, {"k": "f038", "cap": "3번 · 그 도구를 고른 이유"}, {"k": "f039", "cap": "4번 · 이번 주 업무"}, {"k": "f040", "cap": "4번 · 도구 성격"}, {"k": "f041", "cap": "4번 · 그 도구를 고른 이유"}, {"k": "f042", "cap": "네 가지 중 오늘 직접 시도해 볼 업무 하나를 고르고, 그 이유를 기재합니다"}], "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 292\" role=\"img\" aria-label=\"이번 주 업무를 적을 빈 카드 넷을 조사형, 문서형, 분석형 세 줄 레인의 빈 자리에 옮겨 놓는 배치 보드입니다\"><defs><marker id=\"u19-a\" viewBox=\"0 0 10 10\" refX=\"7\" refY=\"5\" markerWidth=\"10\" markerHeight=\"10\" markerUnits=\"userSpaceOnUse\" orient=\"auto\"><path d=\"M0 0L10 5L0 10Z\" class=\"f-part\"/><\/marker><\/defs><text x=\"12\" y=\"28\" class=\"t-label\">이번 주 업무<\/text><rect x=\"13\" y=\"38\" width=\"86\" height=\"46\" rx=\"10\" class=\"f-white s-part dash\" stroke-width=\"2\"/><rect x=\"109\" y=\"38\" width=\"86\" height=\"46\" rx=\"10\" class=\"f-white s-part dash\" stroke-width=\"2\"/><rect x=\"205\" y=\"38\" width=\"86\" height=\"46\" rx=\"10\" class=\"f-white s-part dash\" stroke-width=\"2\"/><rect x=\"301\" y=\"38\" width=\"86\" height=\"46\" rx=\"10\" class=\"f-white s-part dash\" stroke-width=\"2\"/><line x1=\"200\" y1=\"90\" x2=\"200\" y2=\"124\" class=\"ln-b s-part\" marker-end=\"url(#u19-a)\"/><text x=\"212\" y=\"112.3\" class=\"t-small\">도구 위에 배치<\/text><text x=\"12\" y=\"124\" class=\"t-small\">도구 성격<\/text><rect x=\"12\" y=\"132\" width=\"376\" height=\"44\" rx=\"10\" class=\"f-tint\"/><text x=\"28\" y=\"158.9\" class=\"t-label t-part\">조사형<\/text><rect x=\"100\" y=\"140\" width=\"280\" height=\"28\" rx=\"8\" class=\"f-white s-dim dash\" stroke-width=\"2\"/><rect x=\"12\" y=\"184\" width=\"376\" height=\"44\" rx=\"10\" class=\"f-tint\"/><text x=\"28\" y=\"210.9\" class=\"t-label t-part\">문서형<\/text><rect x=\"100\" y=\"192\" width=\"280\" height=\"28\" rx=\"8\" class=\"f-white s-dim dash\" stroke-width=\"2\"/><rect x=\"12\" y=\"236\" width=\"376\" height=\"44\" rx=\"10\" class=\"f-tint\"/><text x=\"28\" y=\"262.9\" class=\"t-label t-part\">분석형<\/text><rect x=\"100\" y=\"244\" width=\"280\" height=\"28\" rx=\"8\" class=\"f-white s-dim dash\" stroke-width=\"2\"/><\/svg>", "figcap": "이번 주 업무 네 가지를 <b>조사형, 문서형, 분석형<\/b> 가운데 하나로 배치해 보십시오"}, {"no": 17, "part": 3, "key": "WHAT", "practice": false, "title": "왜 보안이 가장 먼저인가", "plain": "왜 보안이 가장 먼저인가", "html": "<p class=\"lead\">한 번 밖으로 나간 정보는 되돌릴 수 없습니다.<\/p><p>생성형 AI 교육에서 보안을 앞에 두는 이유는 겁을 주기 위해서가 아닙니다. 활용의 폭을 넓히기 위해서입니다. 어디까지 되는지 모르는 상태에서는 아무도 시도하지 않거나, 반대로 아무렇게나 시도합니다. 경계가 분명해야 그 안에서 자유롭게 쓸 수 있습니다.<\/p><div class=\"tw\"><table class=\"grid stack\"><thead><tr><th>구분<\/th><th>잘못된 대응<\/th><th>권장하는 대응<\/th><\/tr><\/thead><tbody><tr><td class=\"lab\" data-label=\"구분\">금지 일변도<\/td><td data-label=\"잘못된 대응\">전면 금지로 대응합니다<\/td><td data-label=\"권장하는 대응\">허용 범위를 명시하고 그 안에서 권장합니다<\/td><\/tr><tr><td class=\"lab\" data-label=\"구분\">방임<\/td><td data-label=\"잘못된 대응\">각자 알아서 쓰게 배치합니다<\/td><td data-label=\"권장하는 대응\">입력 금지 항목을 공통 기준으로 배포합니다<\/td><\/tr><tr><td class=\"lab\" data-label=\"구분\">사후 대응<\/td><td data-label=\"잘못된 대응\">사고가 나면 조사합니다<\/td><td data-label=\"권장하는 대응\">입력 전 점검 절차를 습관으로 생성합니다<\/td><\/tr><\/tbody><\/table><\/div><h3 class=\"sec\">실무자가 마주하는 실제 위험<\/h3><p>외부 서비스에 입력된 내용은 사용자의 통제를 벗어납니다. 서비스의 데이터 처리 정책에 따라 저장되거나 학습에 활용될 수 있고, 개인 계정으로 입력한 내용은 조직이 추적할 방법도 없습니다. 문제의 대부분은 악의적 유출보다 바쁜 시점에 무심코 붙여 넣은 원문에서 발생합니다.<\/p><div class=\"box\"><div class=\"bt\">오늘 반드시 기억할 할 한 문장<\/div><p>지우지 말고 바꿔서 넣습니다. 민감한 정보를 뺀 채로는 좋은 결과를 얻기 어렵습니다. 구조는 그대로 두고 값을 바꾸어 넣는 기술이 필요합니다.<\/p><\/div><h3 class=\"sec\">보안 사고의 실제 모습<\/h3><p>보안 교육에서 흔히 상상하는 장면은 누군가 의도적으로 자료를 빼내는 상황입니다. 그러나 생성형 AI와 관련해 실제로 문제가 되는 장면은 훨씬 평범합니다. 마감이 급한 저녁에 보고서 원문을 통째로 붙여 넣고 요약을 요청하는 장면, 메일 회신이 막혀 원본 메일을 그대로 옮겨 넣는 장면입니다.<\/p><p>두 장면 모두 나쁜 의도가 없습니다. 오히려 일을 잘하려는 마음에서 나온 행동입니다. 그래서 금지 규정만으로는 막히지 않습니다. 급한 순간에도 자동으로 작동하는 짧은 절차, 곧 습관이 필요합니다. 이어서의 세 가지 점검이 그 습관의 최소 단위입니다.<\/p><aside class=\"read\"><div class=\"rt\">붙여 넣기 전에 삼 초<\/div><p>단축키를 누르기 전에 세 번만 세어 확인합니다. 그 사이에 고유명사와 숫자가 눈에 들어옵니다. 짧은 지연 하나가 대부분의 사고를 막습니다.<\/p><\/aside>", "source": "", "bridge": "", "fields": [], "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 216\" role=\"img\" aria-label=\"사용자의 통제에서 외부 서비스로 굵은 화살이 한쪽으로만 나가고 되돌아오는 점선 화살은 중간에서 끊겨 있으며 아래 띠에 금지 일변도, 방임, 사후 대응이 놓인 그림입니다.\"><defs><marker id=\"u20-a\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"9\" markerHeight=\"9\" markerUnits=\"userSpaceOnUse\" orient=\"auto\"><path d=\"M1,1 L9,5 L1,9 Z\" class=\"f-dim\"/><\/marker><\/defs><rect x=\"12\" y=\"24\" width=\"120\" height=\"112\" rx=\"12\" class=\"f-tint\"/><text x=\"72\" y=\"85\" text-anchor=\"middle\" class=\"t-label\">사용자의 통제<\/text><rect x=\"268\" y=\"25\" width=\"119\" height=\"110\" rx=\"12\" class=\"f-white s-dim\" stroke-width=\"2\"/><text x=\"327.5\" y=\"85\" text-anchor=\"middle\" class=\"t-label\">외부 서비스<\/text><text x=\"200\" y=\"32\" text-anchor=\"middle\" class=\"t-label\">밖으로 나간 정보<\/text><polygon points=\"140,50 234,50 234,42 260,58 234,74 234,66 140,66\" class=\"f-part\"/><line x1=\"262\" y1=\"106\" x2=\"216\" y2=\"106\" class=\"ln s-dim dash\"/><line x1=\"198\" y1=\"96\" x2=\"192\" y2=\"116\" class=\"ln s-ink\"/><line x1=\"208\" y1=\"96\" x2=\"202\" y2=\"116\" class=\"ln s-ink\"/><line x1=\"184\" y1=\"106\" x2=\"142\" y2=\"106\" class=\"ln s-dim dash\" marker-end=\"url(#u20-a)\"/><text x=\"200\" y=\"134\" text-anchor=\"middle\" class=\"t-label\">되돌릴 수 없습니다<\/text><rect x=\"12\" y=\"154\" width=\"376\" height=\"50\" rx=\"12\" class=\"f-tint\"/><text x=\"26\" y=\"183\" class=\"t-small\">잘못된 대응<\/text><rect x=\"100\" y=\"165\" width=\"88\" height=\"28\" rx=\"8\" class=\"f-white s-hair\" stroke-width=\"2\"/><text x=\"144\" y=\"184\" text-anchor=\"middle\" class=\"t-label\">금지 일변도<\/text><rect x=\"196\" y=\"165\" width=\"88\" height=\"28\" rx=\"8\" class=\"f-white s-hair\" stroke-width=\"2\"/><text x=\"240\" y=\"184\" text-anchor=\"middle\" class=\"t-label\">방임<\/text><rect x=\"292\" y=\"165\" width=\"88\" height=\"28\" rx=\"8\" class=\"f-white s-hair\" stroke-width=\"2\"/><text x=\"336\" y=\"184\" text-anchor=\"middle\" class=\"t-label\">사후 대응<\/text><\/svg>", "figcap": "외부 서비스에 입력된 내용은 <b>사용자의 통제<\/b>를 벗어납니다"}, {"no": 18, "part": 3, "key": "WHAT", "practice": false, "title": "입력 전 보안 3체크 원칙", "plain": "입력 전 보안 3체크 원칙", "html": "<p class=\"lead\">입력 버튼을 누르기 전에 세 가지만 확인하면 대부분의 사고를 막을 수 있습니다.<\/p><div class=\"tw\"><table class=\"grid stack\"><thead><tr><th>체크<\/th><th>확인 질문<\/th><th>조치<\/th><\/tr><\/thead><tbody><tr><td class=\"dk\" data-label=\"체크\">체크 1<\/td><td data-label=\"확인 질문\">조직명이나 부서명이 직접 포함되어 있습니까<\/td><td data-label=\"조치\">회사 기준과 승인 절차가 허용한 범위에서 가명 처리합니다<\/td><\/tr><tr><td class=\"dk\" data-label=\"체크\">체크 2<\/td><td data-label=\"확인 질문\">실제 내부 수치나 예산이 포함되어 있습니까<\/td><td data-label=\"조치\">회사 기준과 승인 절차가 허용한 범위에서 수치 스케일링합니다<\/td><\/tr><tr><td class=\"dk\" data-label=\"체크\">체크 3<\/td><td data-label=\"확인 질문\">외부에 공개되지 않은 정보가 포함되어 있습니까<\/td><td data-label=\"조치\">회사 기준과 승인 절차를 확인한 비식별 자료만 사용합니다<\/td><\/tr><\/tbody><\/table><\/div><h3 class=\"sec\">세 가지를 하나의 절차로<\/h3><p>입력하려는 내용은 회사 기준과 승인 절차가 허용한 범위인지 먼저 확인합니다. 허용된 범위 안에서 고유명사와 수치를 가명·범위·변수로 바꾸고, 승인되지 않은 자료는 입력하지 않습니다.<\/p><div class=\"box\"><div class=\"bt\">점검이 어려운 경우의 판단 기준<\/div><p>회사 기준과 승인 절차가 확인한 정보만 입력합니다. 승인 여부가 분명하지 않으면 입력을 보류하고 확인합니다.<\/p><\/div><aside class=\"read\"><div class=\"rt\">점검 결과를 남겨 두면<\/div><p>자주 쓰는 문서 유형별로 바꾸어 넣을 항목을 미리 정리해 두면 매번 고민할 필요가 없습니다. 예를 들어 주간 실적 보고는 부서명과 매출액 두 가지만 바꾸면 되는 식으로 규칙을 만들어 두는 방식입니다. 규칙이 있으면 속도가 붙고, 속도가 붙어야 실제로 쓰게 됩니다.<\/p><\/aside><h3 class=\"sec\">점검을 건너뛰게 구성하는 상황<\/h3><p>세 가지 점검은 어렵지 않습니다. 문제는 점검을 잊는 상황이 정해져 있다는 점입니다. 회의 직전, 마감 직전, 그리고 결과가 잘 나와 신이 났을 때입니다. 이 세 순간을 미리 알아 두는 것만으로도 실수가 크게 줄어듭니다.<\/p><div class=\"tw\"><table class=\"grid stack\"><thead><tr><th>위험한 순간<\/th><th>대비하는 방법<\/th><\/tr><\/thead><tbody><tr><td data-label=\"위험한 순간\">회의 직전 급히 요약을 만들 때<\/td><td data-label=\"대비하는 방법\">회의 자료는 전날 미리 변환해 배치합니다<\/td><\/tr><tr><td data-label=\"위험한 순간\">원문을 통째로 넣고 싶을 때<\/td><td data-label=\"대비하는 방법\">필요한 단락만 잘라 넣는 습관을 들입니다<\/td><\/tr><tr><td data-label=\"위험한 순간\">첨부 파일을 그대로 올릴 때<\/td><td data-label=\"대비하는 방법\">파일명과 머리글의 조직명을 먼저 확인합니다<\/td><\/tr><\/tbody><\/table><\/div>", "source": "", "bridge": "", "fields": [], "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 184\" role=\"img\" aria-label=\"체크 1, 체크 2, 체크 3 세 관문을 차례로 지나야 입력 단추에 닿고, 문마다 조직명이나 부서명, 내부 수치나 예산, 공개되지 않은 정보를 묻는 그림입니다.\"><defs><marker id=\"u21-a\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"9\" markerHeight=\"9\" markerUnits=\"userSpaceOnUse\" orient=\"auto\"><path d=\"M1,1 L9,5 L1,9 Z\" class=\"f-dim\"/><\/marker><\/defs><path d=\"M32,115 V43 Q32,35 40,35 H80 Q88,35 88,43 V115 Z\" class=\"f-tint\"/><path d=\"M32,115 V43 Q32,35 40,35 H80 Q88,35 88,43 V115\" class=\"ln-b s-dim\"/><path d=\"M118,115 V43 Q118,35 126,35 H166 Q174,35 174,43 V115 Z\" class=\"f-tint\"/><path d=\"M118,115 V43 Q118,35 126,35 H166 Q174,35 174,43 V115\" class=\"ln-b s-dim\"/><path d=\"M204,115 V43 Q204,35 212,35 H252 Q260,35 260,43 V115 Z\" class=\"f-tint\"/><path d=\"M204,115 V43 Q204,35 212,35 H252 Q260,35 260,43 V115\" class=\"ln-b s-dim\"/><line x1=\"14\" y1=\"115\" x2=\"386\" y2=\"115\" class=\"ln s-hair\"/><line x1=\"14\" y1=\"83\" x2=\"288\" y2=\"83\" class=\"ln s-dim\" marker-end=\"url(#u21-a)\"/><rect x=\"34\" y=\"23\" width=\"52\" height=\"24\" rx=\"8\" class=\"f-part\"/><text x=\"60\" y=\"40\" text-anchor=\"middle\" class=\"t-label t-on\">체크 1<\/text><rect x=\"120\" y=\"23\" width=\"52\" height=\"24\" rx=\"8\" class=\"f-part\"/><text x=\"146\" y=\"40\" text-anchor=\"middle\" class=\"t-label t-on\">체크 2<\/text><rect x=\"206\" y=\"23\" width=\"52\" height=\"24\" rx=\"8\" class=\"f-part\"/><text x=\"232\" y=\"40\" text-anchor=\"middle\" class=\"t-label t-on\">체크 3<\/text><rect x=\"296\" y=\"67\" width=\"88\" height=\"32\" rx=\"12\" class=\"f-ink\"/><text x=\"340\" y=\"88\" text-anchor=\"middle\" class=\"t-label t-on\">입력<\/text><text x=\"60\" y=\"139\" text-anchor=\"middle\" class=\"t-label\"><tspan x=\"60\">조직명이나<\/tspan><tspan x=\"60\" dy=\"18\">부서명<\/tspan><\/text><text x=\"146\" y=\"139\" text-anchor=\"middle\" class=\"t-label\"><tspan x=\"146\">내부 수치나<\/tspan><tspan x=\"146\" dy=\"18\">예산<\/tspan><\/text><text x=\"232\" y=\"139\" text-anchor=\"middle\" class=\"t-label\"><tspan x=\"232\">공개되지<\/tspan><tspan x=\"232\" dy=\"18\">않은 정보<\/tspan><\/text><\/svg>", "figcap": "세 가지를 <b>하나의 절차<\/b>로 · 표시된 항목을 각각 바꾸어 넣은 뒤 입력합니다"}, {"no": 19, "part": 3, "key": "WHAT", "practice": false, "title": "이것만은 넣지 않습니다", "plain": "이것만은 넣지 않습니다", "html": "<p class=\"lead\">바꾸어 넣는 것으로도 해결되지 않는 영역이 있습니다.<\/p><p>입력 전 점검의 세 가지 기준은 대부분의 업무 문서에 적용됩니다. 그러나 아래 항목은 형태를 바꾸더라도 외부 서비스에 입력하지 않는 것을 원칙으로 합니다. 유출 시 회복이 불가능하거나 법적 책임이 따르는 정보이기 때문입니다.<\/p><div class=\"tw\"><table class=\"grid stack\"><thead><tr><th>구분<\/th><th>해당하는 정보<\/th><\/tr><\/thead><tbody><tr><td class=\"lab\" data-label=\"구분\">개인정보<\/td><td data-label=\"해당하는 정보\">성명, 연락처, 주민등록번호, 계좌 정보, 인사 평가, 상담 기록<\/td><\/tr><tr><td class=\"lab\" data-label=\"구분\">가격 정보<\/td><td data-label=\"해당하는 정보\">단가표, 원가 구조, 견적 조건, 할인 정책<\/td><\/tr><tr><td class=\"lab\" data-label=\"구분\">계약 문서<\/td><td data-label=\"해당하는 정보\">계약서 원본, 비밀유지약정 원문, 협상 중인 조건<\/td><\/tr><tr><td class=\"lab\" data-label=\"구분\">미공개 자료<\/td><td data-label=\"해당하는 정보\">설계 문서, 기술 사양, 검증 데이터, 미공개 연구 결과<\/td><\/tr><tr><td class=\"lab\" data-label=\"구분\">시스템 자산<\/td><td data-label=\"해당하는 정보\">소스코드, 서버 정보, 접속 계정, 내부 시스템 구조<\/td><\/tr><tr><td class=\"lab\" data-label=\"구분\">미발표 실적<\/td><td data-label=\"해당하는 정보\">공시 전 매출, 투자 계획, 인수합병 검토 내용<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box\"><div class=\"bt\">판단의 원칙<\/div><p>외부에 공개된 적이 없고, 유출되었을 때 되돌릴 수 없으며, 나 혼자 책임질 수 없는 정보는 입력하지 않습니다. 세 조건 중 두 가지에 해당하면 이미 입력 금지 영역입니다.<\/p><\/div><aside class=\"read\"><div class=\"rt\">그렇다면 이 업무는 못 하는가<\/div><p>대부분의 경우 할 수 있습니다. 계약서 원문을 넣을 수 없다면 조항의 유형과 쟁점만 일반화해 물으면 됩니다. 단가표를 넣을 수 없다면 지수화한 값으로 구조만 확인하면 됩니다. 원문 없이 구조를 묻는 연습이 곧 보안 역량입니다.<\/p><\/aside><h3 class=\"sec\">금지 목록을 실제로 작동하게 만들려면<\/h3><p>목록을 배포하는 것만으로는 지켜지지 않습니다. 목록이 길수록 더 그렇습니다. 가장 효과적인 방법은 자신이 자주 다루는 문서 다섯 가지에 대해서만 판정을 미리 내려 두는 것입니다. 판정이 되어 있는 문서는 고민 없이 처리되고, 목록에 없는 문서만 그때그때 판단하면 됩니다.<\/p><p>또 하나 유용한 방법은 대체 경로를 함께 정해 두는 것입니다. 이 문서는 입력하지 않는다고만 정하면 결국 일이 막히고, 막히면 규칙이 무너집니다. 입력하지 않는 대신 무엇으로 대체할지를 함께 적어 두어야 규칙이 오래 갑니다.<\/p>", "source": "", "bridge": "", "fields": [], "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 312\" role=\"img\" aria-label=\"방패 윤곽 안 여섯 칸에 개인정보, 가격 정보, 계약 문서, 미공개 자료, 시스템 자산, 미발표 실적이 금지 표지와 함께 놓이고 방패 아래쪽에 입력 금지 영역이라고 적힌 그림입니다.\"><path d=\"M200,16 L364,36 V168 Q364,252 200,296 Q36,252 36,168 V36 Z\" class=\"f-pt s-part\" stroke-width=\"3\" stroke-linejoin=\"round\"/><rect x=\"52\" y=\"50\" width=\"144\" height=\"42\" rx=\"10\" class=\"f-white\"/><circle cx=\"74\" cy=\"71\" r=\"8\" class=\"ln s-ink\"/><line x1=\"68.3\" y1=\"65.3\" x2=\"79.7\" y2=\"76.7\" class=\"ln s-ink\"/><text x=\"92\" y=\"76\" class=\"t-label\">개인정보<\/text><rect x=\"204\" y=\"50\" width=\"144\" height=\"42\" rx=\"10\" class=\"f-white\"/><circle cx=\"226\" cy=\"71\" r=\"8\" class=\"ln s-ink\"/><line x1=\"220.3\" y1=\"65.3\" x2=\"231.7\" y2=\"76.7\" class=\"ln s-ink\"/><text x=\"244\" y=\"76\" class=\"t-label\">가격 정보<\/text><rect x=\"52\" y=\"100\" width=\"144\" height=\"42\" rx=\"10\" class=\"f-white\"/><circle cx=\"74\" cy=\"121\" r=\"8\" class=\"ln s-ink\"/><line x1=\"68.3\" y1=\"115.3\" x2=\"79.7\" y2=\"126.7\" class=\"ln s-ink\"/><text x=\"92\" y=\"126\" class=\"t-label\">계약 문서<\/text><rect x=\"204\" y=\"100\" width=\"144\" height=\"42\" rx=\"10\" class=\"f-white\"/><circle cx=\"226\" cy=\"121\" r=\"8\" class=\"ln s-ink\"/><line x1=\"220.3\" y1=\"115.3\" x2=\"231.7\" y2=\"126.7\" class=\"ln s-ink\"/><text x=\"244\" y=\"126\" class=\"t-label\">미공개 자료<\/text><rect x=\"52\" y=\"150\" width=\"144\" height=\"42\" rx=\"10\" class=\"f-white\"/><circle cx=\"74\" cy=\"171\" r=\"8\" class=\"ln s-ink\"/><line x1=\"68.3\" y1=\"165.3\" x2=\"79.7\" y2=\"176.7\" class=\"ln s-ink\"/><text x=\"92\" y=\"176\" class=\"t-label\">시스템 자산<\/text><rect x=\"204\" y=\"150\" width=\"144\" height=\"42\" rx=\"10\" class=\"f-white\"/><circle cx=\"226\" cy=\"171\" r=\"8\" class=\"ln s-ink\"/><line x1=\"220.3\" y1=\"165.3\" x2=\"231.7\" y2=\"176.7\" class=\"ln s-ink\"/><text x=\"244\" y=\"176\" class=\"t-label\">미발표 실적<\/text><text x=\"200\" y=\"240\" text-anchor=\"middle\" class=\"t-title t-part\">입력 금지 영역<\/text><\/svg>", "figcap": "<b>형태를 바꾸더라도<\/b> 외부 서비스에 입력하지 않는 것을 원칙으로 합니다"}, {"no": 20, "part": 3, "key": "WHAT", "practice": false, "title": "지우지 말고 바꿔 넣는 세 가지 기법", "plain": "지우지 말고 바꿔 넣는 세 가지 기법", "html": "<p class=\"lead\">정보를 빼면 답도 나빠집니다. 구조는 남기고 값만 바꿉니다.<\/p><div class=\"tw\"><table class=\"grid stack\"><thead><tr><th>기법<\/th><th>방법<\/th><th>예시<\/th><\/tr><\/thead><tbody><tr><td class=\"lab\" data-label=\"기법\">가명 처리<\/td><td data-label=\"방법\">고유명사를 유형과 코드로 바꿉니다<\/td><td data-label=\"예시\">○○문화재단 → A 재단<br>홍길동기업 → 동종 업계 A사<\/td><\/tr><tr><td class=\"lab\" data-label=\"기법\">수치 스케일링<\/td><td data-label=\"방법\">비율은 유지하고 자릿수를 축소합니다<\/td><td data-label=\"예시\">예산 50억 원 → 예산 50만 원<br>인원 1,600명 → 인원 160명<\/td><\/tr><tr><td class=\"lab\" data-label=\"기법\">변수 치환<\/td><td data-label=\"방법\">수치를 기호로 바꿔 구조만 남깁니다<\/td><td data-label=\"예시\">매출 = X<br>영업이익률 = Y퍼센트<\/td><\/tr><\/tbody><\/table><\/div><h3 class=\"sec\">실전 변환 예시<\/h3><div class=\"tw\"><table class=\"grid stack\"><thead><tr><th>그대로 넣은 문장<\/th><th>바꾸어 넣은 문장<\/th><\/tr><\/thead><tbody><tr><td data-label=\"그대로 넣은 문장\">2026년 예산 480억 원<\/td><td data-label=\"바꾸어 넣은 문장\">연간 예산 X억 원<\/td><\/tr><tr><td data-label=\"그대로 넣은 문장\">○○○ 팀장, 010-0000-0000<\/td><td data-label=\"바꾸어 넣은 문장\">담당자 1<\/td><\/tr><tr><td data-label=\"그대로 넣은 문장\">A사 8월 단가 1,250원<\/td><td data-label=\"바꾸어 넣은 문장\">고객사 A, 단가 지수 100<\/td><\/tr><tr><td data-label=\"그대로 넣은 문장\">△△팀 8월 처리 실적 92.4퍼센트<\/td><td data-label=\"바꾸어 넣은 문장\">특정 조직 처리 실적 지수 92<\/td><\/tr><\/tbody><\/table><\/div><p>변환 후에도 질문의 구조는 그대로 유지된다는 점이 중요합니다. AI에 필요한 것은 실제 값보다 값들 사이의 관계이기 때문입니다. 관계가 보존되면 분석의 품질은 떨어지지 않습니다.<\/p><aside class=\"read\"><div class=\"rt\">변환표를 손에 들고 있으면<\/div><p>변환한 내용을 되돌릴 대조표는 본인의 내부 문서로만 관리합니다. AI에게는 바꾼 값만 보내고, 원래 값과 바꾼 값의 대응 관계는 외부로 나가지 않게 합니다. 이 대조표가 있어야 결과를 다시 우리 문서에 옮길 수 있습니다.<\/p><\/aside><h3 class=\"sec\">변환이 결과의 품질을 해치지 않는 이유<\/h3><p>변환을 처음 해 보는 분들은 대체로 걱정을 합니다. 실제 값을 주지 않으면 제대로 된 분석이 나오지 않을 것 같기 때문입니다. 그러나 대부분의 업무 요청에서 도구가 활용하는 정보는 값 자체보다 값들의 관계입니다. 예산이 480억인지 480만인지는 구조 분석에 영향을 주지 않습니다. 항목 간 비중과 증감의 방향이 유지되면 결과는 같습니다.<\/p><aside class=\"read\"><div class=\"rt\">변환이 어려운 예외<\/div><p>절대 값 자체가 판단의 근거가 되는 경우, 예를 들어 법정 기준치와의 비교나 특정 임계값의 초과 여부를 묻는 경우에는 스케일링이 결과를 왜곡할 수 있습니다. 이런 요청은 기준치와 실측치의 비율만 남겨 물으합니다.<\/p><\/aside>", "source": "", "bridge": "", "fields": [], "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 232\" role=\"img\" aria-label=\"그대로 넣은 문장이 가명 처리, 수치 스케일링, 변수 치환 세 장치를 거쳐 바꾸어 넣은 문장이 되며 문서의 구조 막대는 그대로이고 값 자리의 색만 바뀌는 그림입니다.\"><defs><marker id=\"u23-a\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" markerUnits=\"userSpaceOnUse\" orient=\"auto\"><path d=\"M1,1 L9,5 L1,9 Z\" class=\"f-dim\"/><\/marker><\/defs><rect x=\"15\" y=\"37\" width=\"86\" height=\"108\" rx=\"10\" class=\"f-white s-dim\" stroke-width=\"2\"/><rect x=\"27\" y=\"57\" width=\"34\" height=\"16\" rx=\"8\" class=\"f-ghost\"/><rect x=\"65\" y=\"57\" width=\"24\" height=\"16\" rx=\"8\" class=\"f-dim\"/><rect x=\"27\" y=\"83\" width=\"22\" height=\"16\" rx=\"8\" class=\"f-ghost\"/><rect x=\"53\" y=\"83\" width=\"36\" height=\"16\" rx=\"8\" class=\"f-dim\"/><rect x=\"27\" y=\"109\" width=\"40\" height=\"16\" rx=\"8\" class=\"f-ghost\"/><rect x=\"71\" y=\"109\" width=\"18\" height=\"16\" rx=\"8\" class=\"f-dim\"/><rect x=\"299\" y=\"37\" width=\"86\" height=\"108\" rx=\"10\" class=\"f-white s-dim\" stroke-width=\"2\"/><rect x=\"311\" y=\"57\" width=\"34\" height=\"16\" rx=\"8\" class=\"f-ghost\"/><rect x=\"349\" y=\"57\" width=\"24\" height=\"16\" rx=\"8\" class=\"f-part\"/><rect x=\"311\" y=\"83\" width=\"22\" height=\"16\" rx=\"8\" class=\"f-ghost\"/><rect x=\"337\" y=\"83\" width=\"36\" height=\"16\" rx=\"8\" class=\"f-part\"/><rect x=\"311\" y=\"109\" width=\"40\" height=\"16\" rx=\"8\" class=\"f-ghost\"/><rect x=\"355\" y=\"109\" width=\"18\" height=\"16\" rx=\"8\" class=\"f-part\"/><rect x=\"138\" y=\"30\" width=\"124\" height=\"34\" rx=\"10\" class=\"f-tint\"/><text x=\"200\" y=\"52\" text-anchor=\"middle\" class=\"t-label\">가명 처리<\/text><rect x=\"138\" y=\"74\" width=\"124\" height=\"34\" rx=\"10\" class=\"f-tint\"/><text x=\"200\" y=\"96\" text-anchor=\"middle\" class=\"t-label\">수치 스케일링<\/text><rect x=\"138\" y=\"118\" width=\"124\" height=\"34\" rx=\"10\" class=\"f-tint\"/><text x=\"200\" y=\"140\" text-anchor=\"middle\" class=\"t-label\">변수 치환<\/text><path d=\"M103,91 H118 M118,47 V135\" class=\"ln s-dim\"/><line x1=\"118\" y1=\"47\" x2=\"132\" y2=\"47\" class=\"ln s-dim\" marker-end=\"url(#u23-a)\"/><line x1=\"118\" y1=\"91\" x2=\"132\" y2=\"91\" class=\"ln s-dim\" marker-end=\"url(#u23-a)\"/><line x1=\"118\" y1=\"135\" x2=\"132\" y2=\"135\" class=\"ln s-dim\" marker-end=\"url(#u23-a)\"/><path d=\"M264,47 H280 M264,91 H280 M264,135 H280 M280,47 V135\" class=\"ln s-dim\"/><line x1=\"280\" y1=\"91\" x2=\"292\" y2=\"91\" class=\"ln s-dim\" marker-end=\"url(#u23-a)\"/><text x=\"58\" y=\"167\" text-anchor=\"middle\" class=\"t-label\"><tspan x=\"58\">그대로<\/tspan><tspan x=\"58\" dy=\"17\">넣은 문장<\/tspan><\/text><text x=\"342\" y=\"167\" text-anchor=\"middle\" class=\"t-label\"><tspan x=\"342\">바꾸어<\/tspan><tspan x=\"342\" dy=\"17\">넣은 문장<\/tspan><\/text><text x=\"200\" y=\"212\" text-anchor=\"middle\" class=\"t-title\">구조는 남기고 값만 바꿉니다<\/text><\/svg>", "figcap": "변환 후에도 <b>질문의 구조<\/b>는 그대로 · 관계가 보존되면 분석의 품질은 떨어지지 않습니다"}, {"no": 21, "part": 3, "key": "WHAT", "practice": true, "title": "생각해보기 : 내 문서 마스킹 변환 연습", "plain": "생각해보기 : 내 문서 마스킹 변환 연습", "html": "<p class=\"lead\">변환은 한 번 해 보면 몸에 남습니다.<\/p><p>최근 작성한 업무 문장 세 개를 떠올려 왼쪽에 적고, 세 가지 기법을 적용해 오른쪽에 바꾸어 기재합니다. 실제 사내 문서 대신 기억에 의존한 문장으로 충분합니다.<\/p><div class=\"tw\"><table class=\"grid stack form\"><thead><tr><th>원래 문장<\/th><th>바꾸어 넣을 문장<\/th><th>적용 기법<\/th><\/tr><\/thead><tbody><tr><td class=\"in\" data-label=\"원래 문장\"><textarea rows=\"2\" data-k=\"f043\" data-cap=\"1번 · 원래 문장\" aria-label=\"1번 · 원래 문장\"><\/textarea><\/td><td class=\"in\" data-label=\"바꾸어 넣을 문장\"><textarea rows=\"2\" data-k=\"f044\" data-cap=\"1번 · 바꾸어 넣을 문장\" aria-label=\"1번 · 바꾸어 넣을 문장\"><\/textarea><\/td><td class=\"in\" data-label=\"적용 기법\"><textarea rows=\"2\" data-k=\"f045\" data-cap=\"1번 · 적용 기법\" aria-label=\"1번 · 적용 기법\"><\/textarea><\/td><\/tr><tr><td class=\"in\" data-label=\"원래 문장\"><textarea rows=\"2\" data-k=\"f046\" data-cap=\"2번 · 원래 문장\" aria-label=\"2번 · 원래 문장\"><\/textarea><\/td><td class=\"in\" data-label=\"바꾸어 넣을 문장\"><textarea rows=\"2\" data-k=\"f047\" data-cap=\"2번 · 바꾸어 넣을 문장\" aria-label=\"2번 · 바꾸어 넣을 문장\"><\/textarea><\/td><td class=\"in\" data-label=\"적용 기법\"><textarea rows=\"2\" data-k=\"f048\" data-cap=\"2번 · 적용 기법\" aria-label=\"2번 · 적용 기법\"><\/textarea><\/td><\/tr><tr><td class=\"in\" data-label=\"원래 문장\"><textarea rows=\"2\" data-k=\"f049\" data-cap=\"3번 · 원래 문장\" aria-label=\"3번 · 원래 문장\"><\/textarea><\/td><td class=\"in\" data-label=\"바꾸어 넣을 문장\"><textarea rows=\"2\" data-k=\"f050\" data-cap=\"3번 · 바꾸어 넣을 문장\" aria-label=\"3번 · 바꾸어 넣을 문장\"><\/textarea><\/td><td class=\"in\" data-label=\"적용 기법\"><textarea rows=\"2\" data-k=\"f051\" data-cap=\"3번 · 적용 기법\" aria-label=\"3번 · 적용 기법\"><\/textarea><\/td><\/tr><\/tbody><\/table><\/div><div class=\"wrow\"><label class=\"wcap\">변환하면서 판단이 어려웠던 항목과, 그렇게 판단한 근거를 기재합니다<\/label><textarea class=\"w\" rows=\"4\" data-k=\"f052\" data-cap=\"변환하면서 판단이 어려웠던 항목과, 그렇게 판단한 근거를 기재합니다\" aria-label=\"변환하면서 판단이 어려웠던 항목과, 그렇게 판단한 근거를 기재합니다\"><\/textarea><\/div><aside class=\"read\"><div class=\"rt\">변환의 수준을 스스로 점검하는 질문<\/div><p>바꾼 문장만 보고 원래 대상이 누구인지 짐작할 수 있다면 아직 변환이 부족한 상태입니다. 업계에서 유일한 조직명, 특정 시점의 고유한 수치, 사건의 조합처럼 역추적이 가능한 단서가 남아 있는지 다시 확인합니다.<\/p><\/aside><h3 class=\"sec\">변환의 속도를 높이는 방법<\/h3><p>매번 처음부터 변환하면 오래 걸립니다. 자주 쓰는 대체어를 미리 정합니다. 우리 부서는 A 부서로, 주요 고객사는 고객사 A, B, C로, 담당자는 담당자 1, 2, 3으로 고정해 두면 변환이 거의 자동으로 이루어집니다.<\/p><div class=\"tw\"><table class=\"grid stack\"><thead><tr><th>원래 표현 유형<\/th><th>고정 대체어<\/th><\/tr><\/thead><tbody><tr><td data-label=\"원래 표현 유형\">조직명과 부서명<\/td><td data-label=\"고정 대체어\">A 조직, A 부서<\/td><\/tr><tr><td data-label=\"원래 표현 유형\">고객사와 협력사<\/td><td data-label=\"고정 대체어\">고객사 A, 협력사 B<\/td><\/tr><tr><td data-label=\"원래 표현 유형\">담당자 성명<\/td><td data-label=\"고정 대체어\">담당자 1, 담당자 2<\/td><\/tr><tr><td data-label=\"원래 표현 유형\">금액과 예산<\/td><td data-label=\"고정 대체어\">X억 원, 지수 100 기준<\/td><\/tr><\/tbody><\/table><\/div>", "source": "", "bridge": "", "fields": [{"k": "f043", "cap": "1번 · 원래 문장"}, {"k": "f044", "cap": "1번 · 바꾸어 넣을 문장"}, {"k": "f045", "cap": "1번 · 적용 기법"}, {"k": "f046", "cap": "2번 · 원래 문장"}, {"k": "f047", "cap": "2번 · 바꾸어 넣을 문장"}, {"k": "f048", "cap": "2번 · 적용 기법"}, {"k": "f049", "cap": "3번 · 원래 문장"}, {"k": "f050", "cap": "3번 · 바꾸어 넣을 문장"}, {"k": "f051", "cap": "3번 · 적용 기법"}, {"k": "f052", "cap": "변환하면서 판단이 어려웠던 항목과, 그렇게 판단한 근거를 기재합니다"}], "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 236\" role=\"img\" aria-label=\"왼쪽 원래 표현 유형 칩 넷과 오른쪽 고정 대체어 칩 넷이 조직명과 부서명은 A 조직, A 부서처럼 한 줄씩 짝으로 이어진 그림입니다.\"><text x=\"93\" y=\"30\" text-anchor=\"middle\" class=\"t-small\">원래 표현 유형<\/text><text x=\"307\" y=\"30\" text-anchor=\"middle\" class=\"t-small\">고정 대체어<\/text><rect x=\"16\" y=\"42\" width=\"154\" height=\"36\" rx=\"10\" class=\"f-tint\"/><text x=\"93\" y=\"65\" text-anchor=\"middle\" class=\"t-label\">조직명과 부서명<\/text><line x1=\"178\" y1=\"60\" x2=\"222\" y2=\"60\" class=\"ln s-dim\"/><circle cx=\"178\" cy=\"60\" r=\"4\" class=\"f-dim\"/><circle cx=\"222\" cy=\"60\" r=\"4\" class=\"f-dim\"/><rect x=\"230\" y=\"42\" width=\"154\" height=\"36\" rx=\"10\" class=\"f-part\"/><text x=\"307\" y=\"65\" text-anchor=\"middle\" class=\"t-label t-on\">A 조직, A 부서<\/text><rect x=\"16\" y=\"90\" width=\"154\" height=\"36\" rx=\"10\" class=\"f-tint\"/><text x=\"93\" y=\"113\" text-anchor=\"middle\" class=\"t-label\">고객사와 협력사<\/text><line x1=\"178\" y1=\"108\" x2=\"222\" y2=\"108\" class=\"ln s-dim\"/><circle cx=\"178\" cy=\"108\" r=\"4\" class=\"f-dim\"/><circle cx=\"222\" cy=\"108\" r=\"4\" class=\"f-dim\"/><rect x=\"230\" y=\"90\" width=\"154\" height=\"36\" rx=\"10\" class=\"f-part\"/><text x=\"307\" y=\"113\" text-anchor=\"middle\" class=\"t-label t-on\">고객사 A, 협력사 B<\/text><rect x=\"16\" y=\"138\" width=\"154\" height=\"36\" rx=\"10\" class=\"f-tint\"/><text x=\"93\" y=\"161\" text-anchor=\"middle\" class=\"t-label\">담당자 성명<\/text><line x1=\"178\" y1=\"156\" x2=\"222\" y2=\"156\" class=\"ln s-dim\"/><circle cx=\"178\" cy=\"156\" r=\"4\" class=\"f-dim\"/><circle cx=\"222\" cy=\"156\" r=\"4\" class=\"f-dim\"/><rect x=\"230\" y=\"138\" width=\"154\" height=\"36\" rx=\"10\" class=\"f-part\"/><text x=\"307\" y=\"161\" text-anchor=\"middle\" class=\"t-label t-on\">담당자 1, 담당자 2<\/text><rect x=\"16\" y=\"186\" width=\"154\" height=\"36\" rx=\"10\" class=\"f-tint\"/><text x=\"93\" y=\"209\" text-anchor=\"middle\" class=\"t-label\">금액과 예산<\/text><line x1=\"178\" y1=\"204\" x2=\"222\" y2=\"204\" class=\"ln s-dim\"/><circle cx=\"178\" cy=\"204\" r=\"4\" class=\"f-dim\"/><circle cx=\"222\" cy=\"204\" r=\"4\" class=\"f-dim\"/><rect x=\"230\" y=\"186\" width=\"154\" height=\"36\" rx=\"10\" class=\"f-part\"/><text x=\"307\" y=\"209\" text-anchor=\"middle\" class=\"t-label t-on\">X억 원, 지수 100 기준<\/text><\/svg>", "figcap": "자주 쓰는 대체어를 <b>고정해 두면<\/b> 변환이 거의 자동으로 이루어집니다"}, {"no": 22, "part": 3, "key": "WHAT", "practice": false, "title": "단숨에 기억하는 AI 신호등", "plain": "단숨에 기억하는 AI 신호등", "html": "<p class=\"lead\">규정집은 기억되지 않습니다. 신호등은 기억됩니다.<\/p><div class=\"tw\"><table class=\"grid stack\"><thead><tr><th>단계<\/th><th>해당 정보<\/th><th>행동 지침<\/th><\/tr><\/thead><tbody><tr><td class=\"lab\" data-label=\"단계\">활용 가능<\/td><td data-label=\"해당 정보\">공개 기사, 대외 보고서, 일반 이론, 아이디어 브레인스토밍<\/td><td data-label=\"행동 지침\">그대로 입력해 자유롭게 활용합니다<\/td><\/tr><tr><td class=\"lab\" data-label=\"단계\">주의 필요<\/td><td data-label=\"해당 정보\">회의록, 내부 이슈 정리, 실적 요약, 업무 메일 초안<\/td><td data-label=\"행동 지침\">이름과 숫자를 익명화한 뒤 입력합니다<\/td><\/tr><tr><td class=\"lab\" data-label=\"단계\">입력 금지<\/td><td data-label=\"해당 정보\">개인정보, 단가표, 계약서 원본, 미공개 설계 자료, 소스코드<\/td><td data-label=\"행동 지침\">형태를 바꾸더라도 입력하지 않습니다<\/td><\/tr><tr><td class=\"lab\" data-label=\"단계\">전문가 검토<\/td><td data-label=\"해당 정보\">법률·세무·노무·의료<\/td><td data-label=\"행동 지침\">초안까지만 작성하고 최종 날인을 받습니다<\/td><\/tr><\/tbody><\/table><\/div><h3 class=\"sec\">우리 문서로 옮겨 본 신호등<\/h3><div class=\"tw\"><table class=\"grid stack\"><thead><tr><th>문서 유형<\/th><th>신호<\/th><th>처리 방법<\/th><\/tr><\/thead><tbody><tr><td data-label=\"문서 유형\">업무 개선 아이디어<\/td><td class=\"ctr\" data-label=\"신호\">활용 가능<\/td><td data-label=\"처리 방법\">출처만 확인하고 활용합니다<\/td><\/tr><tr><td data-label=\"문서 유형\">주간 실적 요약 자료<\/td><td class=\"ctr\" data-label=\"신호\">주의 필요<\/td><td data-label=\"처리 방법\">숫자를 익명화해 입력합니다<\/td><\/tr><tr><td data-label=\"문서 유형\">거래처 가격 조건표<\/td><td class=\"ctr\" data-label=\"신호\">입력 금지<\/td><td data-label=\"처리 방법\">반출하지 않습니다<\/td><\/tr><tr><td data-label=\"문서 유형\">내부 시스템 소스코드<\/td><td class=\"ctr\" data-label=\"신호\">입력 금지<\/td><td data-label=\"처리 방법\">반출하지 않습니다<\/td><\/tr><tr><td data-label=\"문서 유형\">외부 제출용 대응 문서<\/td><td class=\"ctr\" data-label=\"신호\">주의 필요<\/td><td data-label=\"처리 방법\">이름과 기관명을 바꿔 입력합니다<\/td><\/tr><\/tbody><\/table><\/div><h3 class=\"sec\">신호등을 팀 자산으로 구성하는 법<\/h3><p>신호등의 가치는 개인의 판단을 줄여 준다는 데 있습니다. 판단이 필요할 때마다 고민하면 결국 아무도 도구를 쓰지 않게 되거나, 반대로 아무렇게나 쓰게 됩니다. 팀에서 자주 다루는 문서를 한 번만 분류해 두면 그 뒤로는 판단할 일이 크게 줄어듭니다.<\/p><aside class=\"read\"><div class=\"rt\">신호가 바뀌는 경우<\/div><p>같은 문서라도 상황에 따라 신호가 달라질 수 있습니다. 이미 공개된 보고서는 활용 가능이지만, 공개 전의 같은 문서는 입력 금지입니다. 신호는 문서명보다 공개 여부와 시점에 따라 결정된다는 점을 기억합니다.<\/p><\/aside>", "source": "", "bridge": "", "fields": [], "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 264\" role=\"img\" aria-label=\"세로 신호등의 위에서부터 입력 금지는 먹색, 주의 필요는 오렌지, 활용 가능은 초록 등으로 켜져 있고 옆의 작은 회색 물음표가 확인 후 판단을 나타내는 그림입니다.\"><rect x=\"28\" y=\"16\" width=\"88\" height=\"232\" rx=\"12\" class=\"f-tint s-dim\" stroke-width=\"2\"/><circle cx=\"72\" cy=\"56\" r=\"28\" class=\"f-ink\"/><circle cx=\"72\" cy=\"132\" r=\"28\" class=\"f-orange\"/><circle cx=\"72\" cy=\"208\" r=\"28\" class=\"f-green\"/><text x=\"136\" y=\"52\" class=\"t-title\">입력 금지<\/text><text x=\"136\" y=\"72\" class=\"t-small\">입력하지 않습니다<\/text><text x=\"136\" y=\"128\" class=\"t-title\">주의 필요<\/text><text x=\"136\" y=\"148\" class=\"t-small\">익명화한 뒤 입력<\/text><text x=\"136\" y=\"204\" class=\"t-title\">활용 가능<\/text><text x=\"136\" y=\"224\" class=\"t-small\">그대로 입력<\/text><circle cx=\"324\" cy=\"112\" r=\"22\" class=\"f-dim\"/><path d=\"M317.5,105 A6.5,6.5 0 1 1 328.2,110 Q324,112.5 324,117\" class=\"ln-b s-ink\"/><circle cx=\"324\" cy=\"123.5\" r=\"2.4\" class=\"f-ink\"/><text x=\"324\" y=\"160\" text-anchor=\"middle\" class=\"t-title\">전문가 검토<\/text><text x=\"324\" y=\"180\" text-anchor=\"middle\" class=\"t-small\">초안까지만<\/text><\/svg>", "figcap": "신호등의 가치는 <b>개인의 판단을 줄여 준다<\/b>는 데 있습니다"}, {"no": 23, "part": 3, "key": "WHAT", "practice": false, "title": "섀도 AI: 통제할수록 자라는 그림자", "plain": "섀도 AI: 통제할수록 자라는 그림자", "html": "<p class=\"lead\">막는다고 사라지지 않습니다. 드러나지 않을 뿐입니다.<\/p><p>조직이 생성형 AI 사용을 전면 금지하면 사용량보다 기록이 먼저 줄어듭니다. 회사 계정 대신 개인 계정으로, 업무 시간 대신 퇴근 후에 사용하게 됩니다. 이렇게 조직의 시야 밖에서 이루어지는 사용을 섀도 AI라고 부릅니다.<\/p><div class=\"tw\"><table class=\"grid stack\"><thead><tr><th>숨기는 조직<\/th><th>드러내는 조직<\/th><\/tr><\/thead><tbody><tr><td data-label=\"숨기는 조직\">금지하니 개인 계정으로 사용합니다<\/td><td data-label=\"드러내는 조직\">어떻게 썼는지 편하게 밝힙니다<\/td><\/tr><tr><td data-label=\"숨기는 조직\">회사가 사용 실태를 추적할 수 없습니다<\/td><td data-label=\"드러내는 조직\">회사가 흐름을 관찰할 수 있습니다<\/td><\/tr><tr><td data-label=\"숨기는 조직\">검증도 품질 관리도 이루어지지 않습니다<\/td><td data-label=\"드러내는 조직\">검증과 품질과 보안이 함께 관리됩니다<\/td><\/tr><tr><td data-label=\"숨기는 조직\">사고가 나야 존재를 알게 됩니다<\/td><td data-label=\"드러내는 조직\">사고 이전에 위험 지점을 발견합니다<\/td><\/tr><\/tbody><\/table><\/div><h3 class=\"sec\">실무자가 할 수 있는 일<\/h3><p>조직의 정책을 바꾸는 일은 개인의 몫이 아닐 수 있습니다. 그러나 자신이 어떤 도구로 무엇을 했는지 밝히는 일은 개인이 지금 할 수 있습니다. 보고서 말미에 초안 작성에 활용한 도구를 표기하는 정도의 작은 습관이 조직의 기준을 생성합니다.<\/p><div class=\"box\"><div class=\"bt\">세 가지 활용 원칙<\/div><p>첫째, 사내 민감정보는 외부 서비스에 입력하지 않습니다. 둘째, AI가 만든 결과는 반드시 검증합니다. 셋째, 공개된 정보를 중심으로 활용하고 사용 사실을 숨기지 않습니다.<\/p><\/div><h3 class=\"sec\">드러내는 문화를 구성하는 작은 장치<\/h3><p>조직 문화를 바꾸자는 말은 대개 실행되지 않습니다. 대신 작은 장치를 두는 편이 효과적입니다. 예를 들어 팀 회의에서 이번 주에 도구로 해 본 일 한 가지를 돌아가며 말하는 순서를 두는 것입니다. 잘된 사례와 함께 실패한 사례도 공유하면 위험 지점이 자연스럽게 공유됩니다.<\/p><p>두 번째 장치는 결과물에 도구 사용을 표기하는 관행입니다. 초안 작성에 어떤 도구를 썼는지 한 줄 적는 것만으로도 검증의 책임 소재가 분명해지고, 숨길 이유가 줄어듭니다.<\/p><aside class=\"read\"><div class=\"rt\">금지가 필요한 영역은 남습니다<\/div><p>드러내는 문화가 모든 것을 허용하자는 뜻은 아닙니다. 입력 금지 항목은 여전히 금지입니다. 다만 금지의 범위를 좁게 정하고 그 밖은 넓게 허용해야 사람들이 규칙을 지킬 수 있습니다. 지키기 어려운 규칙은 지켜지지 않습니다.<\/p><\/aside>", "source": "", "bridge": "", "fields": [], "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 300\" role=\"img\" aria-label=\"수면 위로는 회사 계정이라는 작은 끝만 보이고 수면 아래 조직의 시야 밖에 섀도 AI가 큰 덩어리로 잠겨 있으며 드러내는 문화 화살이 그것을 수면 위로 끌어올리는 빙산 그림입니다.\"><defs><marker id=\"u26-a\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"10\" markerHeight=\"10\" markerUnits=\"userSpaceOnUse\" orient=\"auto\"><path d=\"M1,1 L9,5 L1,9 Z\" class=\"f-part\"/><\/marker><\/defs><path d=\"M12,100 H388 V276 Q388,288 376,288 H24 Q12,288 12,276 Z\" class=\"f-tint\"/><polygon points=\"110,102 226,102 240,124 258,160 254,206 226,250 170,276 112,262 78,224 68,178 84,132\" class=\"f-ghost\"/><line x1=\"13\" y1=\"100\" x2=\"387\" y2=\"100\" class=\"ln s-dim\"/><polygon points=\"126,100 144,74 160,56 172,64 184,52 200,74 214,100\" class=\"f-white s-dim\" stroke-width=\"2\" stroke-linejoin=\"round\"/><text x=\"106\" y=\"86\" text-anchor=\"end\" class=\"t-label\">회사 계정<\/text><text x=\"164\" y=\"150\" text-anchor=\"middle\" class=\"t-title\">섀도 AI<\/text><text x=\"164\" y=\"184\" text-anchor=\"middle\" class=\"t-label\">개인 계정으로 사용<\/text><text x=\"164\" y=\"208\" text-anchor=\"middle\" class=\"t-label\">추적할 수 없습니다<\/text><text x=\"376\" y=\"276\" text-anchor=\"end\" class=\"t-small\">조직의 시야 밖<\/text><path d=\"M262,212 C316,204 322,140 322,64\" class=\"ln-b s-part\" marker-end=\"url(#u26-a)\"/><circle cx=\"262\" cy=\"212\" r=\"4.5\" class=\"f-part\"/><text x=\"322\" y=\"44\" text-anchor=\"middle\" class=\"t-label t-part\">드러내는 문화<\/text><\/svg>", "figcap": "조직의 시야 밖에서 이루어지는 사용을 <b>섀도 AI<\/b>라고 부릅니다"}, {"no": 24, "part": 3, "key": "WHAT", "practice": true, "title": "생각해보기 : 우리 팀 신호등 만들기", "plain": "생각해보기 : 우리 팀 신호등 만들기", "html": "<p class=\"lead\">일반 기준을 우리 팀의 문서 이름으로 바꾸어 적을 때 규칙이 됩니다.<\/p><p>우리 팀에서 자주 다루는 문서 유형을 떠올려 아래 세 칸에 나누어 기재합니다. 문서의 이름을 그대로 쓰는 것이 중요합니다. 일반적인 표현으로 적으면 실제 상황에서 판단이 다시 흔들립니다.<\/p><div class=\"tw\"><table class=\"grid stack form\"><thead><tr><th>활용 가능<\/th><th>주의 필요 (변환 후 입력)<\/th><th>입력 금지<\/th><\/tr><\/thead><tbody><tr><td class=\"in\" data-label=\"활용 가능\"><textarea rows=\"8\" data-k=\"f053\" data-cap=\"활용 가능\" aria-label=\"활용 가능\"><\/textarea><\/td><td class=\"in\" data-label=\"주의 필요 (변환 후 입력)\"><textarea rows=\"2\" data-k=\"f054\" data-cap=\"주의 필요 (변환 후 입력)\" aria-label=\"주의 필요 (변환 후 입력)\"><\/textarea><\/td><td class=\"in\" data-label=\"입력 금지\"><textarea rows=\"2\" data-k=\"f055\" data-cap=\"입력 금지\" aria-label=\"입력 금지\"><\/textarea><\/td><\/tr><\/tbody><\/table><\/div><div class=\"wrow\"><label class=\"wcap\">판단이 갈릴 것 같은 문서 유형과, 누구에게 확인할지를 기재합니다<\/label><textarea class=\"w\" rows=\"4\" data-k=\"f056\" data-cap=\"판단이 갈릴 것 같은 문서 유형과, 누구에게 확인할지를 기재합니다\" aria-label=\"판단이 갈릴 것 같은 문서 유형과, 누구에게 확인할지를 기재합니다\"><\/textarea><\/div><div class=\"wrow\"><label class=\"wcap\">이 신호등을 팀에 공유한다면 어떤 자리에서 어떻게 전달하시겠습니까<\/label><textarea class=\"w\" rows=\"4\" data-k=\"f057\" data-cap=\"이 신호등을 팀에 공유한다면 어떤 자리에서 어떻게 전달하시겠습니까\" aria-label=\"이 신호등을 팀에 공유한다면 어떤 자리에서 어떻게 전달하시겠습니까\"><\/textarea><\/div><aside class=\"read\"><div class=\"rt\">팀 기준을 만들 때의 요령<\/div><p>완벽한 목록을 처음부터 만들 필요는 없습니다. 가장 자주 다루는 문서 다섯 가지만 분류해도 대부분의 상황이 정리됩니다. 나머지는 판단이 필요할 때마다 목록에 추가하는 방식으로 키워 나가면 됩니다.<\/p><\/aside><h3 class=\"sec\">분류가 갈릴 때의 처리 원칙<\/h3><p>팀원 사이에 판단이 갈리는 문서가 반드시 나옵니다. 이때는 더 보수적인 쪽으로 정하는 것이 원칙입니다. 잘못 허용해 발생하는 손실은 되돌릴 수 없지만, 잘못 금지해 발생하는 불편은 나중에 조정할 수 있기 때문입니다.<\/p><p>정한 뒤에는 정한 날짜와 정한 사람을 함께 적어 두합니다. 기준이 왜 그렇게 정해졌는지 기억하는 사람이 있어야 나중에 다시 조정할 수 있습니다.<\/p>", "source": "", "bridge": "", "fields": [{"k": "f053", "cap": "활용 가능"}, {"k": "f054", "cap": "주의 필요 (변환 후 입력)"}, {"k": "f055", "cap": "입력 금지"}, {"k": "f056", "cap": "판단이 갈릴 것 같은 문서 유형과, 누구에게 확인할지를 기재합니다"}, {"k": "f057", "cap": "이 신호등을 팀에 공유한다면 어떤 자리에서 어떻게 전달하시겠습니까"}], "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 272\" role=\"img\" aria-label=\"위의 빈 문서 카드 묶음에서 화살 셋이 내려와 활용 가능, 주의 필요(변환 후 입력), 입력 금지 세 바구니로 나뉘고 바구니는 비어 있는 그림입니다.\"><defs><marker id=\"u27-a\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"9\" markerHeight=\"9\" markerUnits=\"userSpaceOnUse\" orient=\"auto\"><path d=\"M1,1 L9,5 L1,9 Z\" class=\"f-part\"/><\/marker><\/defs><rect x=\"184\" y=\"14\" width=\"56\" height=\"70\" rx=\"8\" class=\"f-tint s-dim\" stroke-width=\"2\"/><rect x=\"178\" y=\"20\" width=\"56\" height=\"70\" rx=\"8\" class=\"f-tint s-dim\" stroke-width=\"2\"/><rect x=\"172\" y=\"26\" width=\"56\" height=\"70\" rx=\"8\" class=\"f-white s-dim\" stroke-width=\"2\"/><path d=\"M184,46 H216 M184,58 H216 M184,70 H204\" class=\"ln s-hair\"/><text x=\"160\" y=\"66\" text-anchor=\"end\" class=\"t-label\">자주 다루는 문서 유형<\/text><path d=\"M192,104 C192,140 72,134 72,166\" class=\"ln s-part\" marker-end=\"url(#u27-a)\"/><path d=\"M200,104 V166\" class=\"ln s-part\" marker-end=\"url(#u27-a)\"/><path d=\"M208,104 C208,140 328,134 328,166\" class=\"ln s-part\" marker-end=\"url(#u27-a)\"/><path d=\"M20,190 H124 L115,248 Q114,256 106,256 H38 Q30,256 29,248 Z\" class=\"f-tint\"/><rect x=\"14\" y=\"176\" width=\"116\" height=\"16\" rx=\"8\" class=\"f-ghost\"/><path d=\"M148,190 H252 L243,248 Q242,256 234,256 H166 Q158,256 157,248 Z\" class=\"f-tint\"/><rect x=\"142\" y=\"176\" width=\"116\" height=\"16\" rx=\"8\" class=\"f-ghost\"/><path d=\"M276,190 H380 L371,248 Q370,256 362,256 H294 Q286,256 285,248 Z\" class=\"f-tint\"/><rect x=\"270\" y=\"176\" width=\"116\" height=\"16\" rx=\"8\" class=\"f-ghost\"/><text x=\"72\" y=\"228\" text-anchor=\"middle\" class=\"t-label\">활용 가능<\/text><text x=\"200\" y=\"220\" text-anchor=\"middle\" class=\"t-label\">주의 필요<\/text><text x=\"200\" y=\"238\" text-anchor=\"middle\" class=\"t-small\">변환 후 입력<\/text><text x=\"328\" y=\"228\" text-anchor=\"middle\" class=\"t-label\">입력 금지<\/text><\/svg>", "figcap": "자주 다루는 문서 유형을 떠올려 아래 <b>세 칸에 나누어<\/b> 적어 보십시오"}, {"no": 25, "part": 4, "key": "HOW", "practice": false, "title": "좋은 질문이 좋은 산출물을 생성합니다", "plain": "좋은 질문이 좋은 산출물을 생성합니다", "html": "<p class=\"lead\">도구의 성능 차이보다 질문의 구조 차이가 결과를 더 크게 좌우합니다.<\/p><p>같은 도구를 쓰는 두 사람이 전혀 다른 결과를 받는 일은 흔합니다. 원인은 대체로 질문에 있습니다. 한 사람은 무엇을 원하는지 말하고, 다른 한 사람은 무엇을 해 달라고만 말합니다. 전자는 판단의 재료를 주었고 후자는 짐작을 요구한 것입니다.<\/p><div class=\"tw\"><table class=\"grid stack\"><thead><tr><th>막연한 프롬프트<\/th><th>구조화된 프롬프트<\/th><\/tr><\/thead><tbody><tr><td data-label=\"막연한 프롬프트\">보고서 좀 써 주세요<\/td><td data-label=\"구조화된 프롬프트\">임원 주간 회의용으로, 8월 주요 이슈 세 건을 표 하나와 원인 가설 세 줄로 정리해 주세요<\/td><\/tr><tr><td data-label=\"막연한 프롬프트\">이메일 답장해 주세요<\/td><td data-label=\"구조화된 프롬프트\">협력사 담당자에게 일정 조정을 요청하는 메일을, 정중하되 다섯 문장 이내로 작성해 주세요<\/td><\/tr><tr><td data-label=\"막연한 프롬프트\">이거 요약해 주세요<\/td><td data-label=\"구조화된 프롬프트\">이 문서를 팀장 보고용으로, 결정 사항과 후속 조치만 항목별로 정리해 주세요<\/td><\/tr><\/tbody><\/table><\/div><h3 class=\"sec\">구조화가 구성하는 차이<\/h3><p>막연한 지시의 결과물은 대체로 두 번 이상 다시 활용합니다. 목적이 불명확하고 분량과 형식이 지정되지 않았기 때문에, 받은 결과가 쓸 만한지 판단할 기준조차 없습니다. 반면 구조화된 지시는 한 번에 쓸 만한 초안을 내놓고, 수정은 다듬는 수준에서 끝납니다.<\/p><div class=\"box\"><div class=\"bt\">한 문단이면 충분합니다<\/div><p>완벽한 문장을 쓸 필요는 없습니다. 역할, 목적, 과업, 형식 네 가지를 담은 한 문단이면 됩니다. 이어서부터 그 네 가지를 하나씩 확인합니다.<\/p><\/div><h3 class=\"sec\">질문이 좋아지면 무엇이 줄어드는가<\/h3><p>좋은 질문의 효과는 결과물의 품질에서만 나타나는 것이 아닙니다. 더 크게 줄어드는 것은 왕복 횟수입니다. 막연한 지시로 시작하면 결과를 받고, 실망하고, 다시 설명하고, 또 받는 과정을 서너 번 반복하게 됩니다. 그 과정에서 소모되는 시간이 처음 지시문을 다듬는 시간보다 훨씬 깁니다.<\/p><div class=\"tw\"><table class=\"grid stack\"><thead><tr><th>지시 방식<\/th><th>왕복 횟수<\/th><th>실제 소요<\/th><\/tr><\/thead><tbody><tr><td class=\"lab\" data-label=\"지시 방식\">막연한 지시<\/td><td data-label=\"왕복 횟수\">3~4회<\/td><td data-label=\"실제 소요\">지시는 짧지만 전체 시간은 길어집니다<\/td><\/tr><tr><td class=\"lab\" data-label=\"지시 방식\">구조화된 지시<\/td><td data-label=\"왕복 횟수\">1~2회<\/td><td data-label=\"실제 소요\">지시는 길지만 전체 시간은 짧아집니다<\/td><\/tr><\/tbody><\/table><\/div><p>입력 문장을 길게 쓰는 일이 번거롭게 느껴진다면, 그 문장을 한 번만 잘 써 두고 다음부터 재사용한다고 생각하합니다. 반복되는 업무일수록 첫 지시문에 시간을 쓰는 편이 이득입니다.<\/p>", "source": "", "bridge": "", "fields": [], "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 250\" role=\"img\" aria-label=\"막연한 지시는 왕복 3~4회, 구조화된 지시는 1~2회로 두 지시 방식의 왕복 횟수를 가로 막대 둘로 비교한 그림\"><text x=\"24\" y=\"34\" class=\"t-title\">왕복 횟수<\/text><text x=\"24\" y=\"72\" class=\"t-label\">막연한 지시<\/text><rect x=\"24\" y=\"84\" width=\"64\" height=\"30\" rx=\"8\" class=\"f-dim\"/><rect x=\"94\" y=\"84\" width=\"64\" height=\"30\" rx=\"8\" class=\"f-dim\"/><rect x=\"164\" y=\"84\" width=\"64\" height=\"30\" rx=\"8\" class=\"f-dim\"/><rect x=\"235\" y=\"85\" width=\"62\" height=\"28\" rx=\"8\" class=\"ln s-dim dash\"/><text x=\"316\" y=\"106.2\" class=\"t-big\">3~4회<\/text><text x=\"24\" y=\"134\" class=\"t-small\">전체 시간은 길어집니다<\/text><text x=\"24\" y=\"172\" class=\"t-label\">구조화된 지시<\/text><rect x=\"24\" y=\"184\" width=\"64\" height=\"30\" rx=\"8\" class=\"f-part\"/><rect x=\"95\" y=\"185\" width=\"62\" height=\"28\" rx=\"8\" class=\"ln s-part dash\"/><text x=\"176\" y=\"206.2\" class=\"t-big t-part\">1~2회<\/text><text x=\"24\" y=\"234\" class=\"t-small\">전체 시간은 짧아집니다<\/text><\/svg>", "figcap": "더 크게 줄어드는 것은 <b>왕복 횟수<\/b>입니다"}, {"no": 26, "part": 4, "key": "HOW", "practice": false, "title": "말투가 AI의 역할 인식을 바꿉니다", "plain": "말투가 AI의 역할 인식을 바꿉니다", "html": "<p class=\"lead\">좋은 프롬프트는 유능한 동료에게 일을 청하는 문장과 닮았습니다.<\/p><p>명령형으로 짧게 던지면 도구는 짧게 답합니다. 맥락을 담아 청하면 맥락을 담아 답합니다. 예의보다 청하는 문장에 담긴 목적과 조건이 결과를 좌우하기 때문입니다.<\/p><div class=\"tw\"><table class=\"grid stack\"><thead><tr><th>이해하지 못하는 말투<\/th><th>잘 작동하는 말투<\/th><\/tr><\/thead><tbody><tr><td data-label=\"이해하지 못하는 말투\">대충 알려 주세요<\/td><td data-label=\"잘 작동하는 말투\">핵심만 간단히 정리해 주세요<\/td><\/tr><tr><td data-label=\"이해하지 못하는 말투\">다시 해 보세요<\/td><td data-label=\"잘 작동하는 말투\">이런 결과를 기대합니다. 제가 어떤 정보를 더 드리면 좋을까요<\/td><\/tr><tr><td data-label=\"이해하지 못하는 말투\">마음에 들지 않습니다<\/td><td data-label=\"잘 작동하는 말투\">제시한 문장을 개조식으로, 명사형 종결어미로 수정해 주세요<\/td><\/tr><tr><td data-label=\"이해하지 못하는 말투\">이게 최선입니까<\/td><td data-label=\"잘 작동하는 말투\">이 초안을 전문가의 관점에서 다시 검토해 주세요<\/td><\/tr><tr><td data-label=\"이해하지 못하는 말투\">수정해 주세요<\/td><td data-label=\"잘 작동하는 말투\">잘된 부분과 보완이 필요한 부분을 구분해 알려 주세요<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box\"><div class=\"bt\">가장 쓸모 있는 한 문장<\/div><p>제가 미처 발견하지 못한 치명적인 문제는 무엇일까요. 이 질문은 도구를 검토자의 자리에 세우기 때문에, 칭찬 대신 지적을 끌어냅니다.<\/p><\/div><aside class=\"read\"><div class=\"rt\">함께 논의하는 형식으로 바꾸면<\/div><p>해 주세요 대신 어떻게 해 보면 좋을까요, 함께 논의하기를 희망합니다와 같은 형식으로 바꾸면 도구는 하나의 완성물 대신 여러 선택지와 근거를 제시하는 쪽으로 움직입니다. 결정을 남에게 맡기지 않고 재료를 받아 스스로 판단하려는 사람에게 유용한 방식입니다.<\/p><\/aside><h3 class=\"sec\">말투를 바꾸면 왜 결과가 달라지는가<\/h3><p>모델은 입력된 문장의 형식에 맞추어 응답의 형식을 결정합니다. 짧은 명령에는 짧은 결과를, 맥락이 담긴 요청에는 맥락이 담긴 결과를 내놓습니다. 예의보다 입력 정보량의 문제입니다. 정중한 문장에는 대체로 목적과 조건이 함께 실리기 때문에, 결과적으로 더 나은 재료를 준 셈이 됩니다.<\/p><p>또 하나의 효과는 자신에게 미치는 영향입니다. 청하는 문장을 쓰려면 무엇을 왜 원하는지를 스스로 정리해야 합니다. 그 정리 과정에서 요청의 초점이 분명해지는 경우가 많습니다. 결국 좋은 프롬프트를 쓰는 훈련은 자신의 생각을 정리하는 훈련이기도 합니다.<\/p><aside class=\"read\"><div class=\"rt\">불만을 개선 요청으로 바꾸는 문형<\/div><p>결과가 마음에 들지 않을 때는 불만을 말하는 대신 기준을 제시합니다. 기대한 결과는 이런 형태입니다, 현재 결과에서 이 부분이 기준과 다릅니다, 이 부분을 이렇게 수정해 주십시오. 세 문장이면 대부분의 재작업 요청이 정리됩니다.<\/p><\/aside>", "source": "", "bridge": "", "fields": [], "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 264\" role=\"img\" aria-label=\"이해하지 못하는 말투 세 가지가 화살표를 따라 잘 작동하는 말투로 바뀌는 말풍선 쌍 세 개\"><defs><marker id=\"u29-a\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"9\" markerHeight=\"9\" markerUnits=\"userSpaceOnUse\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 Z\" class=\"f-dim\"/><\/marker><\/defs><text x=\"93\" y=\"32\" class=\"t-title\" text-anchor=\"middle\">이해하지 못하는 말투<\/text><text x=\"306\" y=\"32\" class=\"t-title t-part\" text-anchor=\"middle\">잘 작동하는 말투<\/text><path d=\"M26,50 H160 A12,12 0 0 1 172,62 V88 A12,12 0 0 1 160,100 H46 L26,110 L32,100 H26 A12,12 0 0 1 14,88 V62 A12,12 0 0 1 26,50 Z\" class=\"f-tint\"/><path d=\"M238,50 H374 A12,12 0 0 1 386,62 V88 A12,12 0 0 1 374,100 H368 L374,110 L354,100 H238 A12,12 0 0 1 226,88 V62 A12,12 0 0 1 238,50 Z\" class=\"f-pt s-part\" stroke-width=\"2\"/><line x1=\"182\" y1=\"75\" x2=\"214\" y2=\"75\" class=\"ln s-dim\" marker-end=\"url(#u29-a)\"/><text x=\"93\" y=\"79.9\" class=\"t-label\" text-anchor=\"middle\">대충 알려 주세요<\/text><text class=\"t-label\" text-anchor=\"middle\"><tspan x=\"306\" y=\"70.9\">핵심만 간단히<\/tspan><tspan x=\"306\" y=\"88.9\">정리해 주세요<\/tspan><\/text><path d=\"M26,120 H160 A12,12 0 0 1 172,132 V158 A12,12 0 0 1 160,170 H46 L26,180 L32,170 H26 A12,12 0 0 1 14,158 V132 A12,12 0 0 1 26,120 Z\" class=\"f-tint\"/><path d=\"M238,120 H374 A12,12 0 0 1 386,132 V158 A12,12 0 0 1 374,170 H368 L374,180 L354,170 H238 A12,12 0 0 1 226,158 V132 A12,12 0 0 1 238,120 Z\" class=\"f-pt s-part\" stroke-width=\"2\"/><line x1=\"182\" y1=\"145\" x2=\"214\" y2=\"145\" class=\"ln s-dim\" marker-end=\"url(#u29-a)\"/><text x=\"93\" y=\"149.9\" class=\"t-label\" text-anchor=\"middle\">다시 해 보세요<\/text><text class=\"t-label\" text-anchor=\"middle\"><tspan x=\"306\" y=\"140.9\">이런 결과를<\/tspan><tspan x=\"306\" y=\"158.9\">기대합니다<\/tspan><\/text><path d=\"M26,190 H160 A12,12 0 0 1 172,202 V228 A12,12 0 0 1 160,240 H46 L26,250 L32,240 H26 A12,12 0 0 1 14,228 V202 A12,12 0 0 1 26,190 Z\" class=\"f-tint\"/><path d=\"M238,190 H374 A12,12 0 0 1 386,202 V228 A12,12 0 0 1 374,240 H368 L374,250 L354,240 H238 A12,12 0 0 1 226,228 V202 A12,12 0 0 1 238,190 Z\" class=\"f-pt s-part\" stroke-width=\"2\"/><line x1=\"182\" y1=\"215\" x2=\"214\" y2=\"215\" class=\"ln s-dim\" marker-end=\"url(#u29-a)\"/><text x=\"93\" y=\"219.9\" class=\"t-label\" text-anchor=\"middle\">마음에 들지 않습니다<\/text><text class=\"t-label\" text-anchor=\"middle\"><tspan x=\"306\" y=\"210.9\">명사형 종결어미로<\/tspan><tspan x=\"306\" y=\"228.9\">고쳐 주세요<\/tspan><\/text><\/svg>", "figcap": "<b>맥락을 담아 청하면<\/b> 맥락을 담아 답합니다"}, {"no": 27, "part": 4, "key": "HOW", "practice": false, "title": "4W 프롬프트 공식", "plain": "4W 프롬프트 공식", "html": "<p class=\"lead\">Who · Why · What · Way 네 칸을 채우면 프롬프트가 완성됩니다.<\/p><div class=\"tw\"><table class=\"grid stack\"><thead><tr><th>요소<\/th><th>질문<\/th><th>프롬프트에 쓰는 문장<\/th><\/tr><\/thead><tbody><tr><td class=\"lab\" data-label=\"요소\">Who<br>역할 부여<\/td><td data-label=\"질문\">누구의 눈으로 볼 것인가<\/td><td data-label=\"프롬프트에 쓰는 문장\">당신은 ○○ 분야 20년 차 전문가입니다. 저는 해당 업무의 3년 차 실무자입니다<\/td><\/tr><tr><td class=\"lab\" data-label=\"요소\">Why<br>맥락과 목적<\/td><td data-label=\"질문\">왜 이것이 필요한가<\/td><td data-label=\"프롬프트에 쓰는 문장\">부서장이 3분 안에 의사결정할 수 있도록 돕는 것이 목적입니다<\/td><\/tr><tr><td class=\"lab\" data-label=\"요소\">What<br>수행 과업<\/td><td data-label=\"질문\">무엇을 만들 것인가<\/td><td data-label=\"프롬프트에 쓰는 문장\">○○ 기획서의 본문을 작성해 주세요<\/td><\/tr><tr><td class=\"lab\" data-label=\"요소\">Way<br>형식과 제약<\/td><td data-label=\"질문\">어떤 형식과 조건으로<\/td><td data-label=\"프롬프트에 쓰는 문장\">개조식, 명사형 종결어미, A4 한 장 분량, 추정 수치는 쓰지 않습니다<\/td><\/tr><\/tbody><\/table><\/div><h3 class=\"sec\">네 요소가 각각 해결하는 문제<\/h3><div class=\"tw\"><table class=\"grid stack\"><thead><tr><th>요소<\/th><th>이것이 없으면<\/th><\/tr><\/thead><tbody><tr><td class=\"lab\" data-label=\"요소\">Who<\/td><td data-label=\"이것이 없으면\">관점이 없어 일반론에 머뭅니다<\/td><\/tr><tr><td class=\"lab\" data-label=\"요소\">Why<\/td><td data-label=\"이것이 없으면\">무엇을 강조할지 몰라 균등하게 나열합니다<\/td><\/tr><tr><td class=\"lab\" data-label=\"요소\">What<\/td><td data-label=\"이것이 없으면\">산출물의 형태가 매번 달라집니다<\/td><\/tr><tr><td class=\"lab\" data-label=\"요소\">Way<\/td><td data-label=\"이것이 없으면\">분량과 문체가 맞지 않아 다시 활용합니다<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box\"><div class=\"bt\">Way가 가장 자주 빠집니다<\/div><p>결과물이 어색하다는 불만의 대부분은 Way를 지정하지 않은 데서 옵니다. 개조식인지 서술형인지, 몇 자 분량인지, 어떤 표현을 피해야 하는지를 적어 주면 재작성 횟수가 눈에 띄게 줄어듭니다.<\/p><\/div><h3 class=\"sec\">네 요소의 우선순위<\/h3><p>네 가지를 모두 채우는 것이 이상적이지만, 시간이 없다면 우선순위가 있습니다. Way와 Why를 먼저 채우합니다. 형식과 목적만 분명하면 나머지는 도구가 어느 정도 추정합니다. 반대로 역할과 과업만 있고 형식과 목적이 없으면, 그럴듯하지만 쓸 수 없는 결과가 나옵니다.<\/p><aside class=\"read\"><div class=\"rt\">네 칸을 문장 하나로 붙이는 예<\/div><p>당신은 해당 분야 20년 차 실무 전문가입니다. 저는 임원 주간 회의에서 3분 안에 보고해야 합니다. 8월 주요 이슈 세 건을 정리해 주세요. 표 하나와 원인 가설 세 줄로, 추정 수치는 쓰지 않습니다.<\/p><\/aside>", "source": "", "bridge": "", "fields": [], "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 242\" role=\"img\" aria-label=\"Who 역할 부여, Why 맥락과 목적, What 수행 과업, Way 형식과 제약 네 조각이 맞물려 한 판을 이루고 가운데에 4W가 놓인 퍼즐 그림\"><path d=\"M40,26 A10,10 0 0 1 50,16 L200,16 L200,60.5 A12,12 0 1 1 200,76.5 L200,121 L128,121 A12,12 0 1 0 112,121 L40,121 Z\" class=\"f-pt s-part\" stroke-width=\"2\" stroke-linejoin=\"round\"/><path d=\"M200,16 L350,16 A10,10 0 0 1 360,26 L360,121 L288,121 A12,12 0 1 1 272,121 L200,121 L200,76.5 A12,12 0 1 0 200,60.5 Z\" class=\"f-pt s-part\" stroke-width=\"2\" stroke-linejoin=\"round\"/><path d=\"M200,121 L272,121 A12,12 0 1 0 288,121 L360,121 L360,216 A10,10 0 0 1 350,226 L200,226 L200,181.5 A12,12 0 1 1 200,165.5 Z\" class=\"f-pt s-part\" stroke-width=\"2\" stroke-linejoin=\"round\"/><path d=\"M40,121 L112,121 A12,12 0 1 1 128,121 L200,121 L200,165.5 A12,12 0 1 0 200,181.5 L200,226 L50,226 A10,10 0 0 1 40,216 Z\" class=\"f-pt s-part\" stroke-width=\"2\" stroke-linejoin=\"round\"/><circle cx=\"200\" cy=\"121\" r=\"22\" class=\"f-part\"/><text x=\"200\" y=\"126.4\" class=\"t-title t-on\" text-anchor=\"middle\">4W<\/text><text x=\"120\" y=\"66\" class=\"t-big t-part\" text-anchor=\"middle\">Who<\/text><text x=\"120\" y=\"88\" class=\"t-label\" text-anchor=\"middle\">역할 부여<\/text><text x=\"280\" y=\"66\" class=\"t-big t-part\" text-anchor=\"middle\">Why<\/text><text x=\"280\" y=\"88\" class=\"t-label\" text-anchor=\"middle\">맥락과 목적<\/text><text x=\"120\" y=\"171\" class=\"t-big t-part\" text-anchor=\"middle\">What<\/text><text x=\"120\" y=\"193\" class=\"t-label\" text-anchor=\"middle\">수행 과업<\/text><text x=\"280\" y=\"171\" class=\"t-big t-part\" text-anchor=\"middle\">Way<\/text><text x=\"280\" y=\"193\" class=\"t-label\" text-anchor=\"middle\">형식과 제약<\/text><\/svg>", "figcap": "Who · Why · What · Way <b>네 칸<\/b>을 채우면 프롬프트가 완성됩니다"}, {"no": 28, "part": 4, "key": "HOW", "practice": false, "title": "4W 적용 전후, 무엇이 달라지는가", "plain": "4W 적용 전후, 무엇이 달라지는가", "html": "<p class=\"lead\">같은 업무, 같은 도구입니다. 다른 것은 입력 문장뿐입니다.<\/p><div class=\"tw\"><table class=\"grid stack\"><thead><tr><th>구분<\/th><th>적용 전<\/th><th>적용 후<\/th><\/tr><\/thead><tbody><tr><td class=\"lab\" data-label=\"구분\">입력<\/td><td data-label=\"적용 전\">교육 기획안 좀 써 주세요<\/td><td data-label=\"적용 후\">[Who] 조직 내 교육 기획 담당자로서<br>[Why] 구성원의 생성형 AI 도입을 지원하기 위해<br>[What] 교육 기획안 본문을 작성해 주세요<br>[Way] 개조식, 명사형 종결어미, A4 한 장<\/td><\/tr><tr><td class=\"lab\" data-label=\"구분\">결과<\/td><td data-label=\"적용 전\">일반적인 목차와 총론 수준의 서술<\/td><td data-label=\"적용 후\">대상과 목적이 반영된 모듈 구성과 시간 배분<\/td><\/tr><tr><td class=\"lab\" data-label=\"구분\">후속 작업<\/td><td data-label=\"적용 전\">처음부터 다시 작성<\/td><td data-label=\"적용 후\">표현 다듬기와 수치 확인<\/td><\/tr><\/tbody><\/table><\/div><h3 class=\"sec\">두 번째 사례: 협조 요청 이메일<\/h3><div class=\"tw\"><table class=\"grid stack\"><thead><tr><th>적용 전<\/th><th>적용 후<\/th><\/tr><\/thead><tbody><tr><td data-label=\"적용 전\">협조 요청 메일 써 주세요<\/td><td data-label=\"적용 후\">[Who] ○○ 산업군의 실무 담당자로서<br>[Why] 수신자가 3분 안에 판단할 수 있도록<br>[What] 협조 요청 이메일 본문을 작성해 주세요<br>[Way] 개조식, 다섯 문장 이내, 요청 사항을 첫 문단에 배치<\/td><\/tr><\/tbody><\/table><\/div><p>전후 비교에서 확인할 점은 문장의 길이가 아닙니다. 적용 후의 입력에는 결과물을 평가할 기준이 들어 있다는 점입니다. 기준이 명시되어 있으면 받은 결과가 기준에 맞는지 즉시 판단할 수 있고, 어긋난 항목만 골라 수정을 요청할 수 있습니다.<\/p><aside class=\"read\"><div class=\"rt\">네 요소를 외우기 어렵다면<\/div><p>누가, 왜, 무엇을, 어떻게 네 단어만 기억합니다. 프롬프트를 쓰기 전에 이 네 단어를 속으로 훑는 것만으로도 입력의 수준이 달라집니다.<\/p><\/aside><h3 class=\"sec\">전후 비교를 직접 해 보는 방법<\/h3><p>이 표를 읽는 것과 직접 해 보는 것은 다릅니다. 지금 처리 중인 업무 하나를 골라 막연한 문장으로 한 번, 4W를 갖춘 문장으로 한 번 입력합니다. 두 결과를 나란히 놓고 보면 차이가 설명 없이 이해됩니다. 이 비교를 한 번 경험한 사람은 다시 막연한 문장으로 돌아가지 않습니다.<\/p><p>비교할 때 주목할 지점은 문장의 매끄러움보다 구조에 주목합니다. 적용 후의 결과는 대개 순서가 다르고 강조점이 다릅니다. 그 차이가 곧 목적과 대상을 명시한 효과입니다.<\/p>", "source": "", "bridge": "", "fields": [], "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 300\" role=\"img\" aria-label=\"교육 기획안 요청을 4W 적용 전의 짧은 입력 문서와 적용 후의 구조 갖춘 입력 문서로 나란히 두고 결과와 후속 작업을 비교한 그림\"><text x=\"88\" y=\"28\" class=\"t-title\" text-anchor=\"middle\">적용 전<\/text><text x=\"312\" y=\"28\" class=\"t-title t-part\" text-anchor=\"middle\">적용 후<\/text><rect x=\"14\" y=\"42\" width=\"148\" height=\"72\" rx=\"10\" class=\"f-white s-dim\" stroke-width=\"2\"/><text class=\"t-label\"><tspan x=\"28\" y=\"73.9\">교육 기획안 좀<\/tspan><tspan x=\"28\" y=\"91.9\">써 주세요<\/tspan><\/text><rect x=\"238\" y=\"42\" width=\"148\" height=\"132\" rx=\"10\" class=\"f-white s-part\" stroke-width=\"2\"/><rect x=\"250\" y=\"52\" width=\"46\" height=\"22\" rx=\"8\" class=\"f-part\"/><text x=\"273\" y=\"67.86\" class=\"t-label t-on\" text-anchor=\"middle\">Who<\/text><text x=\"304\" y=\"67.86\" class=\"t-label\">기획 담당자<\/text><rect x=\"250\" y=\"82\" width=\"46\" height=\"22\" rx=\"8\" class=\"f-part\"/><text x=\"273\" y=\"97.86\" class=\"t-label t-on\" text-anchor=\"middle\">Why<\/text><text x=\"304\" y=\"97.86\" class=\"t-label\">도입을 지원<\/text><rect x=\"250\" y=\"112\" width=\"46\" height=\"22\" rx=\"8\" class=\"f-part\"/><text x=\"273\" y=\"127.86\" class=\"t-label t-on\" text-anchor=\"middle\">What<\/text><text x=\"304\" y=\"127.86\" class=\"t-label\">기획안 본문<\/text><rect x=\"250\" y=\"142\" width=\"46\" height=\"22\" rx=\"8\" class=\"f-part\"/><text x=\"273\" y=\"157.86\" class=\"t-label t-on\" text-anchor=\"middle\">Way<\/text><text x=\"304\" y=\"157.86\" class=\"t-label\">A4 한 장<\/text><text x=\"200\" y=\"112.86\" class=\"t-label\" text-anchor=\"middle\">입력<\/text><rect x=\"14\" y=\"188\" width=\"148\" height=\"44\" rx=\"10\" class=\"f-tint\"/><text x=\"88\" y=\"214.86\" class=\"t-label\" text-anchor=\"middle\">총론 수준의 서술<\/text><rect x=\"238\" y=\"188\" width=\"148\" height=\"44\" rx=\"10\" class=\"f-pt\"/><text class=\"t-label\" text-anchor=\"middle\"><tspan x=\"312\" y=\"205.86\">모듈 구성과<\/tspan><tspan x=\"312\" y=\"223.86\">시간 배분<\/tspan><\/text><text x=\"200\" y=\"214.86\" class=\"t-label\" text-anchor=\"middle\">결과<\/text><rect x=\"14\" y=\"242\" width=\"148\" height=\"44\" rx=\"10\" class=\"f-tint\"/><text x=\"88\" y=\"268.86\" class=\"t-label\" text-anchor=\"middle\">처음부터 다시 작성<\/text><rect x=\"238\" y=\"242\" width=\"148\" height=\"44\" rx=\"10\" class=\"f-pt\"/><text class=\"t-label\" text-anchor=\"middle\"><tspan x=\"312\" y=\"259.86\">표현 다듬기와<\/tspan><tspan x=\"312\" y=\"277.86\">수치 확인<\/tspan><\/text><text x=\"200\" y=\"268.86\" class=\"t-label\" text-anchor=\"middle\">후속 작업<\/text><\/svg>", "figcap": "같은 업무, 같은 도구입니다. 다른 것은 <b>입력 문장<\/b>뿐입니다"}, {"no": 29, "part": 4, "key": "HOW", "practice": true, "title": "생각해보기 : 나의 4W 프롬프트 설계", "plain": "생각해보기 : 나의 4W 프롬프트 설계", "html": "<p class=\"lead\">실제 업무 하나를 선정해 네 칸을 채웁니다.<\/p><div class=\"tw\"><table class=\"grid stack form\"><tbody><tr><td class=\"lab\">대상 업무<\/td><td class=\"in\"><textarea rows=\"2\" data-k=\"f058\" data-cap=\"대상 업무\" aria-label=\"대상 업무\"><\/textarea><\/td><\/tr><\/tbody><\/table><\/div><div class=\"tw\"><table class=\"grid stack form\"><tbody><tr><td class=\"lab\">Who<br>역할<\/td><td class=\"in\"><textarea rows=\"3\" data-k=\"f059\" data-cap=\"Who 역할\" aria-label=\"Who 역할\"><\/textarea><\/td><\/tr><tr><td class=\"lab\">Why<br>목적<\/td><td class=\"in\"><textarea rows=\"3\" data-k=\"f060\" data-cap=\"Why 목적\" aria-label=\"Why 목적\"><\/textarea><\/td><\/tr><tr><td class=\"lab\">What<br>과업<\/td><td class=\"in\"><textarea rows=\"3\" data-k=\"f061\" data-cap=\"What 과업\" aria-label=\"What 과업\"><\/textarea><\/td><\/tr><tr><td class=\"lab\">Way<br>형식<\/td><td class=\"in\"><textarea rows=\"3\" data-k=\"f062\" data-cap=\"Way 형식\" aria-label=\"Way 형식\"><\/textarea><\/td><\/tr><\/tbody><\/table><\/div><div class=\"wrow\"><label class=\"wcap\">위 네 칸을 이어 붙여 하나의 문단으로 다시 활용합니다<\/label><textarea class=\"w\" rows=\"6\" data-k=\"f063\" data-cap=\"위 네 칸을 이어 붙여 하나의 문단으로 다시 활용합니다\" aria-label=\"위 네 칸을 이어 붙여 하나의 문단으로 다시 활용합니다\"><\/textarea><\/div><aside class=\"read\"><div class=\"rt\">작성 후 스스로 점검하는 질문<\/div><ul><li>이 문단을 처음 보는 동료가 읽어도 무엇을 만들어야 할지 알 수 있습니까<\/li><li>결과물이 좋은지 나쁜지 판단할 기준이 문단 안에 들어 있습니까<\/li><li>보안 3체크를 통과했습니까<\/li><\/ul><\/aside><h3 class=\"sec\">작성한 프롬프트를 자산으로 남기기<\/h3><p>잘 작동한 프롬프트는 다시 활용합니다. 문서 하나를 만들어 잘 된 문장을 모아 두합니다. 업무 유형별로 서너 개만 모여도 대부분의 상황이 해결됩니다.<\/p><div class=\"wrow\"><label class=\"wcap\">이 프롬프트를 다음에 다시 쓴다면 어떤 부분을 고정하고 어떤 부분만 바꾸겠습니까<\/label><textarea class=\"w\" rows=\"4\" data-k=\"f091\" data-cap=\"이 프롬프트를 다음에 다시 쓴다면 어떤 부분을 고정하고 어떤 부분만 바꾸겠습니까\" aria-label=\"이 프롬프트를 다음에 다시 쓴다면 어떤 부분을 고정하고 어떤 부분만 바꾸겠습니까\"><\/textarea><\/div>", "source": "", "bridge": "", "fields": [{"k": "f058", "cap": "대상 업무"}, {"k": "f059", "cap": "Who 역할"}, {"k": "f060", "cap": "Why 목적"}, {"k": "f061", "cap": "What 과업"}, {"k": "f062", "cap": "Way 형식"}, {"k": "f063", "cap": "위 네 칸을 이어 붙여 하나의 문단으로 다시 활용합니다"}, {"k": "f091", "cap": "이 프롬프트를 다음에 다시 쓴다면 어떤 부분을 고정하고 어떤 부분만 바꾸겠습니까"}], "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 290\" role=\"img\" aria-label=\"대상 업무 칸과 Who 역할, Why 목적, What 과업, Way 형식 네 칸이 비어 있고 첫 칸에 입력 막대가 깜빡이는 양식 카드\"><rect x=\"16\" y=\"14\" width=\"368\" height=\"262\" rx=\"12\" class=\"f-tint\"/><text x=\"34\" y=\"52.86\" class=\"t-label\">대상 업무<\/text><rect x=\"122\" y=\"30\" width=\"244\" height=\"36\" rx=\"8\" class=\"f-white s-part\" stroke-width=\"2\"/><rect x=\"136\" y=\"39\" width=\"2.5\" height=\"18\" class=\"f-part\"><animate attributeName=\"opacity\" values=\"1;0\" dur=\"1.1s\" calcMode=\"discrete\" repeatCount=\"indefinite\"/><\/rect><text x=\"34\" y=\"114.86\" class=\"t-label\">Who 역할<\/text><rect x=\"122\" y=\"92\" width=\"244\" height=\"36\" rx=\"8\" class=\"f-white s-dim dash\" stroke-width=\"2\"/><text x=\"34\" y=\"158.86\" class=\"t-label\">Why 목적<\/text><rect x=\"122\" y=\"136\" width=\"244\" height=\"36\" rx=\"8\" class=\"f-white s-dim dash\" stroke-width=\"2\"/><text x=\"34\" y=\"202.86\" class=\"t-label\">What 과업<\/text><rect x=\"122\" y=\"180\" width=\"244\" height=\"36\" rx=\"8\" class=\"f-white s-dim dash\" stroke-width=\"2\"/><text x=\"34\" y=\"246.86\" class=\"t-label\">Way 형식<\/text><rect x=\"122\" y=\"224\" width=\"244\" height=\"36\" rx=\"8\" class=\"f-white s-dim dash\" stroke-width=\"2\"/><\/svg>", "figcap": "실제 업무 하나를 골라 <b>네 칸<\/b>을 채워 봅니다"}, {"no": 30, "part": 4, "key": "HOW", "practice": false, "title": "Gen AI 도구의 문법, 마크다운", "plain": "Gen AI 도구의 문법, 마크다운", "html": "<p class=\"lead\">형식을 말로 설명하는 대신 기호로 지정하면 결과가 정확해집니다.<\/p><p>마크다운은 간단한 기호로 문서의 구조를 표시하는 표기 방식입니다. 생성형 AI 도구는 대부분 이 표기를 이해하므로, 원하는 문서의 뼈대를 기호로 그려 주면 그 구조에 맞추어 내용을 채워 넣습니다.<\/p><div class=\"tw\"><table class=\"grid stack\"><thead><tr><th>기호<\/th><th>의미<\/th><th>사용 예<\/th><\/tr><\/thead><tbody><tr><td class=\"lab\" data-label=\"기호\">#<\/td><td data-label=\"의미\">1단계 제목<\/td><td data-label=\"사용 예\"># 이슈 대응 업무 매뉴얼<\/td><\/tr><tr><td class=\"lab\" data-label=\"기호\">##<\/td><td data-label=\"의미\">2단계 제목<\/td><td data-label=\"사용 예\">## 작성 순서<\/td><\/tr><tr><td class=\"lab\" data-label=\"기호\">###<\/td><td data-label=\"의미\">3단계 제목<\/td><td data-label=\"사용 예\">### 세부 점검 항목<\/td><\/tr><tr><td class=\"lab\" data-label=\"기호\">-<\/td><td data-label=\"의미\">순서 없는 목록<\/td><td data-label=\"사용 예\">- 확인 항목을 나열합니다<\/td><\/tr><tr><td class=\"lab\" data-label=\"기호\">1. 2.<\/td><td data-label=\"의미\">순서 있는 목록<\/td><td data-label=\"사용 예\">1. 첫 단계 &nbsp; 2. 두 번째 단계<\/td><\/tr><tr><td class=\"lab\" data-label=\"기호\">---<\/td><td data-label=\"의미\">구분선<\/td><td data-label=\"사용 예\">단락과 단락을 구분합니다<\/td><\/tr><\/tbody><\/table><\/div><h3 class=\"sec\">실제 적용 예시<\/h3><div class=\"box\"><p class='mdcode'># 정기 점검 업무 매뉴얼 작성을 요청합니다<br>## 작성 순서<br>1. 작업 전 안전 조치 단계<br>2. 점검 항목과 판정 기준<br>3. 이상 발견 시 조치 절차<br>4. 기록과 보고 방법<br>## 작성 조건<br>- 개조식, 명사형 종결어미<br>- 각 단계는 다섯 줄 이내<br>- 추정 수치는 기재하지 않습니다<\/p><\/div><p>이 방식의 장점은 결과물의 구조를 미리 확정할 수 있다는 점입니다. 구조가 고정되면 여러 사람이 만든 문서의 모양이 같아지고, 비교와 누적이 쉬워집니다.<\/p><h3 class=\"sec\">마크다운을 쓰지 않아도 되는 경우<\/h3><p>모든 요청에 기호를 붙일 필요는 없습니다. 짧은 질문이나 단순한 변환에는 오히려 번거롭습니다. 마크다운이 힘을 발휘하는 지점은 여러 항목으로 구성된 문서를 만들 때, 그리고 같은 형식의 문서를 반복해 만들 때입니다.<\/p><aside class=\"read\"><div class=\"rt\">결과물에 기호가 그대로 나올 때<\/div><p>도구의 답변에 별표나 우물 정 기호가 그대로 보이는 경우가 있습니다. 붙여 넣을 곳이 기호를 해석하지 않는 편집기이기 때문입니다. 이럴 때는 기호 없이 평문으로 작성해 달라고 요청하면 됩니다.<\/p><\/aside>", "source": "", "bridge": "", "fields": [], "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 268\" role=\"img\" aria-label=\"왼쪽 마크다운 기호 글이 오른쪽 화면에서 크기가 다른 제목, 목록, 구분선으로 보이는 모습을 나란히 둔 그림\"><defs><marker id=\"u33-a\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"10\" markerHeight=\"10\" markerUnits=\"userSpaceOnUse\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 Z\" class=\"f-dim\"/><\/marker><\/defs><rect x=\"12\" y=\"14\" width=\"176\" height=\"240\" rx=\"10\" class=\"f-tint\"/><rect x=\"216\" y=\"14\" width=\"170\" height=\"240\" rx=\"10\" class=\"f-white s-dim\" stroke-width=\"2\"/><line x1=\"193\" y1=\"134\" x2=\"205\" y2=\"134\" class=\"ln-b s-dim\" marker-end=\"url(#u33-a)\"/><text x=\"26\" y=\"40.86\" class=\"t-label t-part\">#<\/text><text x=\"64\" y=\"40.86\" class=\"t-label\">업무 매뉴얼<\/text><text x=\"26\" y=\"73.86\" class=\"t-label t-part\">##<\/text><text x=\"64\" y=\"73.86\" class=\"t-label\">작성 순서<\/text><text x=\"26\" y=\"106.86\" class=\"t-label t-part\">###<\/text><text x=\"64\" y=\"106.86\" class=\"t-label\">세부 점검 항목<\/text><text x=\"26\" y=\"139.86\" class=\"t-label t-part\">-<\/text><text x=\"64\" y=\"139.86\" class=\"t-label\">확인 항목<\/text><text x=\"26\" y=\"172.86\" class=\"t-label t-part\">1.<\/text><text x=\"64\" y=\"172.86\" class=\"t-label\">첫 단계<\/text><text x=\"26\" y=\"205.86\" class=\"t-label t-part\">2.<\/text><text x=\"64\" y=\"205.86\" class=\"t-label\">두 번째 단계<\/text><text x=\"26\" y=\"238.86\" class=\"t-label t-part\">---<\/text><text x=\"232\" y=\"43.2\" class=\"t-big\">업무 매뉴얼<\/text><text x=\"232\" y=\"74.4\" class=\"t-title\">작성 순서<\/text><text x=\"232\" y=\"106.86\" class=\"t-label\">세부 점검 항목<\/text><circle cx=\"237\" cy=\"135\" r=\"3\" class=\"f-ink\"/><text x=\"246\" y=\"139.86\" class=\"t-label\">확인 항목<\/text><text x=\"232\" y=\"172.86\" class=\"t-label\">1.<\/text><text x=\"250\" y=\"172.86\" class=\"t-label\">첫 단계<\/text><text x=\"232\" y=\"205.86\" class=\"t-label\">2.<\/text><text x=\"250\" y=\"205.86\" class=\"t-label\">두 번째 단계<\/text><line x1=\"232\" y1=\"234\" x2=\"370\" y2=\"234\" class=\"ln s-dim\"/><\/svg>", "figcap": "마크다운은 간단한 기호로 <b>문서의 구조<\/b>를 표시하는 표기 방식"}, {"no": 31, "part": 4, "key": "HOW", "practice": false, "title": "제로샷 · 퓨샷 · 역할 부여", "plain": "제로샷 · 퓨샷 · 역할 부여", "html": "<p class=\"lead\">모든 질문에 긴 설명이 필요한 것은 아닙니다. 상황에 맞는 기법을 선정합니다.<\/p><div class=\"tw\"><table class=\"grid stack\"><thead><tr><th>기법<\/th><th>방식<\/th><th>언제 쓰는가<\/th><\/tr><\/thead><tbody><tr><td class=\"lab\" data-label=\"기법\">제로샷<\/td><td data-label=\"방식\">예시 없이 바로 지시합니다<br><span style='font-size:0.9em'>이 문장을 더 부드럽게 바꿔 주세요<\/span><\/td><td data-label=\"언제 쓰는가\">간단한 변환, 요약, 아이디어 확장처럼 결과의 형태가 뻔한 경우<\/td><\/tr><tr><td class=\"lab\" data-label=\"기법\">퓨샷<\/td><td data-label=\"방식\">원하는 형식의 예시를 먼저 보여 줍니다<br><span style='font-size:0.9em'>이런 식으로 바꿔 주세요, 예시 두세 개 제시<\/span><\/td><td data-label=\"언제 쓰는가\">사내 양식이나 특정 문체를 그대로 재현해야 하는 경우<\/td><\/tr><tr><td class=\"lab\" data-label=\"기법\">역할 부여<\/td><td data-label=\"방식\">특정 직업이나 관점을 지정합니다<br><span style='font-size:0.9em'>당신은 계약 검토 담당자입니다<\/span><\/td><td data-label=\"언제 쓰는가\">같은 자료를 다른 관점으로 검토하고 싶은 경우<\/td><\/tr><\/tbody><\/table><\/div><h3 class=\"sec\">역할이 관점을 생성합니다<\/h3><div class=\"tw\"><table class=\"grid stack\"><thead><tr><th>부여한 역할<\/th><th>생겨나는 관점<\/th><\/tr><\/thead><tbody><tr><td data-label=\"부여한 역할\">현업 관리자<\/td><td data-label=\"생겨나는 관점\">문제의 원인 가설을 세우는 관점<\/td><\/tr><tr><td data-label=\"부여한 역할\">협상 실무자<\/td><td data-label=\"생겨나는 관점\">근거와 대안을 찾는 관점<\/td><\/tr><tr><td data-label=\"부여한 역할\">신입 교육 담당자<\/td><td data-label=\"생겨나는 관점\">쉬운 말로 풀어 쓰는 관점<\/td><\/tr><tr><td data-label=\"부여한 역할\">외부 심사위원<\/td><td data-label=\"생겨나는 관점\">약점과 반론을 먼저 찾는 관점<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"read\"><div class=\"rt\">퓨샷이 특히 유용한 순간<\/div><p>우리 조직의 문서 양식을 설명으로 전달하기는 어렵습니다. 이럴 때는 기존 문서 두세 건에서 민감 정보를 바꾸어 예시로 붙이고, 같은 형식으로 새 내용을 작성해 달라고 요청하는 편이 훨씬 빠릅니다.<\/p><\/aside><h3 class=\"sec\">세 기법을 겹쳐 쓰기<\/h3><p>세 가지 기법은 배타적이지 않습니다. 실무에서 가장 좋은 결과는 대개 겹쳐 쓸 때 나옵니다. 역할을 부여하고, 예시를 한두 개 붙이고, 형식을 지정하는 방식입니다. 겹쳐 쓴다고 해서 문장이 크게 길어지지도 않습니다.<\/p><aside class=\"read\"><div class=\"rt\">겹쳐 쓴 예시<\/div><p>당신은 공공 부문 문서 검토자입니다. 아래 예시와 같은 형식으로 작성해 주세요. 예시를 붙인 뒤, 같은 형식으로 이번 안건의 검토 의견을 개조식 다섯 줄로 정리해 주세요.<\/p><\/aside>", "source": "", "bridge": "", "fields": [], "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 276\" role=\"img\" aria-label=\"같은 자료가 역할 부여라는 프리즘을 지나 현업 관리자, 협상 실무자, 신입 교육 담당자, 외부 심사위원의 네 갈래로 나뉘는 그림\"><defs><marker id=\"u34-a\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"9\" markerHeight=\"9\" markerUnits=\"userSpaceOnUse\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 Z\" class=\"f-dim\"/><\/marker><\/defs><line x1=\"16\" y1=\"119\" x2=\"123.5\" y2=\"119\" class=\"ln-b s-di
