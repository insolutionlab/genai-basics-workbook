m\"/><text x=\"20\" y=\"106\" class=\"t-label\">같은 자료<\/text><line x1=\"169\" y1=\"104\" x2=\"226\" y2=\"38\" class=\"ln s-dim\" marker-end=\"url(#u34-a)\"/><line x1=\"174\" y1=\"114\" x2=\"226\" y2=\"92\" class=\"ln s-dim\" marker-end=\"url(#u34-a)\"/><line x1=\"179\" y1=\"124\" x2=\"226\" y2=\"146\" class=\"ln s-dim\" marker-end=\"url(#u34-a)\"/><line x1=\"184\" y1=\"134\" x2=\"226\" y2=\"200\" class=\"ln s-dim\" marker-end=\"url(#u34-a)\"/><path d=\"M154.02,74.05 L198.98,163.95 Q203,172 194,172 L106,172 Q97,172 101.02,163.95 L145.98,74.05 Q150,66 154.02,74.05 Z\" class=\"f-part\"/><text x=\"150\" y=\"156\" class=\"t-label t-on\" text-anchor=\"middle\">역할 부여<\/text><rect x=\"232\" y=\"18\" width=\"154\" height=\"40\" rx=\"10\" class=\"f-tint\"/><text x=\"309\" y=\"42.86\" class=\"t-label\" text-anchor=\"middle\">현업 관리자<\/text><rect x=\"232\" y=\"72\" width=\"154\" height=\"40\" rx=\"10\" class=\"f-tint\"/><text x=\"309\" y=\"96.86\" class=\"t-label\" text-anchor=\"middle\">협상 실무자<\/text><rect x=\"232\" y=\"126\" width=\"154\" height=\"40\" rx=\"10\" class=\"f-tint\"/><text x=\"309\" y=\"150.86\" class=\"t-label\" text-anchor=\"middle\">신입 교육 담당자<\/text><rect x=\"232\" y=\"180\" width=\"154\" height=\"40\" rx=\"10\" class=\"f-tint\"/><text x=\"309\" y=\"204.86\" class=\"t-label\" text-anchor=\"middle\">외부 심사위원<\/text><text x=\"200\" y=\"258\" class=\"t-title t-part\" text-anchor=\"middle\">역할이 관점을 만듭니다<\/text><\/svg>", "figcap": "같은 자료를 다른 관점으로 검토하고 싶은 경우, <b>역할 부여<\/b>"}, {"no": 32, "part": 4, "key": "HOW", "practice": false, "title": "한 번에 끝내지 않습니다: 멀티턴 고도화", "plain": "한 번에 끝내지 않습니다: 멀티턴 고도화", "html": "<p class=\"lead\">첫 답변에 만족하지 않는 것이 숙련자의 습관입니다.<\/p><p>복잡한 과업을 한 번의 지시로 해결하려 하면 결과가 얕아집니다. 사람에게 일을 맡길 때와 같습니다. 단계를 나누고, 중간 결과를 확인하고, 방향을 조정합니다.<\/p><div class=\"tw\"><table class=\"grid stack\"><thead><tr><th>단계<\/th><th>요청 문장<\/th><th>얻는 것<\/th><\/tr><\/thead><tbody><tr><td class=\"lab\" data-label=\"단계\">1단계<\/td><td data-label=\"요청 문장\">4W 공식을 적용해 초안을 작성해 주세요<\/td><td data-label=\"얻는 것\">구조를 갖춘 첫 초안<\/td><\/tr><tr><td class=\"lab\" data-label=\"단계\">2단계<\/td><td data-label=\"요청 문장\">결론을 먼저 제시하는 두괄식으로 수정해 주세요<\/td><td data-label=\"얻는 것\">읽는 사람 기준의 순서<\/td><\/tr><tr><td class=\"lab\" data-label=\"단계\">3단계<\/td><td data-label=\"요청 문장\">불필요한 수식어를 덜어 내고 분량을 줄여 주세요<\/td><td data-label=\"얻는 것\">밀도 있는 문장<\/td><\/tr><tr><td class=\"lab\" data-label=\"단계\">4단계<\/td><td data-label=\"요청 문장\">제목을 목적+개선수준+해결방법 형식으로 3가지 제안해 주세요<\/td><td data-label=\"얻는 것\">제목 최적화<\/td><\/tr><\/tbody><\/table><\/div><h3 class=\"sec\">세 가지 심화 기법<\/h3><div class=\"tw\"><table class=\"grid stack\"><thead><tr><th>기법<\/th><th>요청 방식<\/th><\/tr><\/thead><tbody><tr><td class=\"lab\" data-label=\"기법\">단계 나누기<\/td><td data-label=\"요청 방식\">먼저 이 글을 요약해 주세요. 그 요약을 바탕으로 다음 단계에서 의견을 제시해 주세요<\/td><\/tr><tr><td class=\"lab\" data-label=\"기법\">자문자답<\/td><td data-label=\"요청 방식\">독자가 궁금해할 질문 세 가지를 만들고, 그에 대한 답도 함께 제시해 주세요<\/td><\/tr><tr><td class=\"lab\" data-label=\"기법\">비판적 검토<\/td><td data-label=\"요청 방식\">이 주장의 약점과 반론을 전문가의 관점에서 정리해 주세요<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"read\"><div class=\"rt\">프롬프트 실험을 권합니다<\/div><p>단어를 바꾸고, 조건을 더하고, 문장 구조를 바꾸어 보면서 반응을 관찰합니다. 면담 아이디어를 세 개 제안해 달라는 요청과, 팀장의 입장에서 실현 가능성이 높은 아이디어 세 개를 요약해 달라는 요청은 전혀 다른 결과를 냅니다.<\/p><\/aside><h3 class=\"sec\">멀티턴이 흐트러지는 순간<\/h3><p>대화를 길게 이어 가다 보면 앞의 지시가 흐려지는 경우가 있습니다. 이럴 때는 처음의 조건을 다시 한 번 명시해 주는 것이 가장 빠릅니다. 앞서 말씀드린 개조식과 다섯 줄 조건을 유지해 주세요라고 짧게 덧붙이면 됩니다.<\/p><p>또 하나의 방법은 중간 산출물을 한 번 정리하고 넘어가는 것입니다. 여기까지의 결론을 세 줄로 정리해 주세요라고 요청한 뒤 그 정리본을 기준으로 다음 단계를 시작하면 대화가 길어져도 방향이 흔들리지 않습니다.<\/p>", "source": "", "bridge": "", "fields": [], "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 300\" role=\"img\" aria-label=\"1단계 구조를 갖춘 첫 초안에서 4단계 스스로 보지 못한 결함까지 네 칸 계단과 그 위를 오르는 화살 그림\"><defs><marker id=\"u35-a\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"13\" markerHeight=\"13\" markerUnits=\"userSpaceOnUse\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 Z\" class=\"f-part\"/><\/marker><\/defs><rect x=\"14\" y=\"200\" width=\"90\" height=\"84\" rx=\"10\" class=\"f-tint\"/><text x=\"59\" y=\"226\" class=\"t-title\" text-anchor=\"middle\">1단계<\/text><text class=\"t-label\" text-anchor=\"middle\"><tspan x=\"59\" y=\"250\">구조를 갖춘<\/tspan><tspan x=\"59\" y=\"268\">첫 초안<\/tspan><\/text><rect x=\"108\" y=\"158\" width=\"90\" height=\"126\" rx=\"10\" class=\"f-tint\"/><text x=\"153\" y=\"184\" class=\"t-title\" text-anchor=\"middle\">2단계<\/text><text class=\"t-label\" text-anchor=\"middle\"><tspan x=\"153\" y=\"208\">읽는 사람<\/tspan><tspan x=\"153\" y=\"226\">기준의 순서<\/tspan><\/text><rect x=\"202\" y=\"116\" width=\"90\" height=\"168\" rx=\"10\" class=\"f-tint\"/><text x=\"247\" y=\"142\" class=\"t-title\" text-anchor=\"middle\">3단계<\/text><text class=\"t-label\" text-anchor=\"middle\"><tspan x=\"247\" y=\"166\">밀도 있는<\/tspan><tspan x=\"247\" y=\"184\">문장<\/tspan><\/text><rect x=\"296\" y=\"74\" width=\"90\" height=\"210\" rx=\"10\" class=\"f-tint\"/><text x=\"341\" y=\"100\" class=\"t-title\" text-anchor=\"middle\">4단계<\/text><text class=\"t-label\" text-anchor=\"middle\"><tspan x=\"341\" y=\"124\">스스로 보지<\/tspan><tspan x=\"341\" y=\"142\">못한 결함<\/tspan><\/text><line x1=\"34\" y1=\"165.06\" x2=\"324\" y2=\"35.49\" class=\"ln-b s-part\" marker-end=\"url(#u35-a)\"/><\/svg>", "figcap": "단계를 나누고, 중간 결과를 확인하고, <b>방향을 조정합니다<\/b>"}, {"no": 33, "part": 4, "key": "HOW", "practice": true, "title": "생각해보기 : 멀티턴 3단계 기록", "plain": "생각해보기 : 멀티턴 3단계 기록", "html": "<p class=\"lead\">한 과업을 세 번에 걸쳐 다듬어 보고, 무엇이 좋아졌는지 기록합니다.<\/p><div class=\"tw\"><table class=\"grid stack form\"><thead><tr><th>단계<\/th><th>내가 입력한 문장<\/th><th>결과의 변화<\/th><\/tr><\/thead><tbody><tr><td class=\"lab\" data-label=\"단계\">1단계<br>첫 초안 도출<\/td><td class=\"in\" data-label=\"내가 입력한 문장\"><textarea rows=\"4\" data-k=\"f064\" data-cap=\"1단계 첫 초안 도출 · 내가 입력한 문장\" aria-label=\"1단계 첫 초안 도출 · 내가 입력한 문장\"><\/textarea><\/td><td class=\"in\" data-label=\"결과의 변화\"><textarea rows=\"2\" data-k=\"f065\" data-cap=\"1단계 첫 초안 도출 · 결과의 변화\" aria-label=\"1단계 첫 초안 도출 · 결과의 변화\"><\/textarea><\/td><\/tr><tr><td class=\"lab\" data-label=\"단계\">2단계<br>두괄식 수정<\/td><td class=\"in\" data-label=\"내가 입력한 문장\"><textarea rows=\"4\" data-k=\"f066\" data-cap=\"2단계 두괄식 수정 · 내가 입력한 문장\" aria-label=\"2단계 두괄식 수정 · 내가 입력한 문장\"><\/textarea><\/td><td class=\"in\" data-label=\"결과의 변화\"><textarea rows=\"2\" data-k=\"f067\" data-cap=\"2단계 두괄식 수정 · 결과의 변화\" aria-label=\"2단계 두괄식 수정 · 결과의 변화\"><\/textarea><\/td><\/tr><tr><td class=\"lab\" data-label=\"단계\">3단계<br>표현 정제<\/td><td class=\"in\" data-label=\"내가 입력한 문장\"><textarea rows=\"4\" data-k=\"f068\" data-cap=\"3단계 표현 정제 · 내가 입력한 문장\" aria-label=\"3단계 표현 정제 · 내가 입력한 문장\"><\/textarea><\/td><td class=\"in\" data-label=\"결과의 변화\"><textarea rows=\"2\" data-k=\"f069\" data-cap=\"3단계 표현 정제 · 결과의 변화\" aria-label=\"3단계 표현 정제 · 결과의 변화\"><\/textarea><\/td><\/tr><\/tbody><\/table><\/div><div class=\"wrow\"><label class=\"wcap\">세 단계 중 결과를 가장 크게 바꾼 요청은 무엇이었습니까<\/label><textarea class=\"w\" rows=\"5\" data-k=\"f070\" data-cap=\"세 단계 중 결과를 가장 크게 바꾼 요청은 무엇이었습니까\" aria-label=\"세 단계 중 결과를 가장 크게 바꾼 요청은 무엇이었습니까\"><\/textarea><\/div><aside class=\"read\"><div class=\"rt\">기록을 남기는 이유<\/div><p>효과가 좋았던 요청 문장은 다음에도 그대로 활용합니다. 잘 작동한 문장을 모아 두면 개인의 프롬프트 자산이 됩니다. 이 자산이 쌓이면 매번 처음부터 고민할 필요가 없어집니다.<\/p><\/aside><h3 class=\"sec\">적어 둔 내용을 팀에 옮기기<\/h3><p>세 단계를 거치며 효과가 있었던 요청 문장은 개인의 것으로 두기에는 아깝습니다. 팀에서 같은 업무를 하는 동료와 문장을 교환합니다. 같은 업무라도 사람마다 다른 각도로 요청하기 때문에, 교환하는 순간 서로의 사각지대가 채워집니다.<\/p><div class=\"wrow\"><label class=\"wcap\">동료와 교환한 문장 중 내 방식에 없던 관점은 무엇이었습니까<\/label><textarea class=\"w\" rows=\"4\" data-k=\"f092\" data-cap=\"동료와 교환한 문장 중 내 방식에 없던 관점은 무엇이었습니까\" aria-label=\"동료와 교환한 문장 중 내 방식에 없던 관점은 무엇이었습니까\"><\/textarea><\/div>", "source": "", "bridge": "", "fields": [{"k": "f064", "cap": "1단계 첫 초안 도출 · 내가 입력한 문장"}, {"k": "f065", "cap": "1단계 첫 초안 도출 · 결과의 변화"}, {"k": "f066", "cap": "2단계 두괄식 수정 · 내가 입력한 문장"}, {"k": "f067", "cap": "2단계 두괄식 수정 · 결과의 변화"}, {"k": "f068", "cap": "3단계 표현 정제 · 내가 입력한 문장"}, {"k": "f069", "cap": "3단계 표현 정제 · 결과의 변화"}, {"k": "f070", "cap": "세 단계 중 결과를 가장 크게 바꾼 요청은 무엇이었습니까"}, {"k": "f092", "cap": "동료와 교환한 문장 중 내 방식에 없던 관점은 무엇이었습니까"}], "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 252\" role=\"img\" aria-label=\"1차 초안, 2차 구조, 3차 검토 세 장의 문서가 뒤로 갈수록 엷게 겹쳐 있고 맨 앞 장에 내가 입력한 문장과 결과의 변화를 적는 빈칸이 있는 그림\"><rect x=\"52\" y=\"16\" width=\"232\" height=\"150\" rx=\"10\" class=\"f-white s-hair\" stroke-width=\"2\"/><text x=\"68\" y=\"37.86\" class=\"t-label\">첫 초안 도출<\/text><rect x=\"84\" y=\"50\" width=\"232\" height=\"150\" rx=\"10\" class=\"f-white s-dim\" stroke-width=\"2\"/><text x=\"100\" y=\"71.86\" class=\"t-label\">두괄식 수정<\/text><rect x=\"116\" y=\"84\" width=\"232\" height=\"150\" rx=\"10\" class=\"f-white s-part\" stroke-width=\"2\"/><text x=\"132\" y=\"105.86\" class=\"t-label t-part\">표현 정제<\/text><line x1=\"118\" y1=\"118\" x2=\"346\" y2=\"118\" class=\"ln s-hair\"/><text x=\"132\" y=\"140\" class=\"t-label\">내가 입력한 문장<\/text><rect x=\"132\" y=\"148\" width=\"200\" height=\"24\" rx=\"8\" class=\"f-white s-dim dash\" stroke-width=\"2\"/><text x=\"132\" y=\"192\" class=\"t-label\">결과의 변화<\/text><rect x=\"132\" y=\"200\" width=\"200\" height=\"24\" rx=\"8\" class=\"f-white s-dim dash\" stroke-width=\"2\"/><\/svg>", "figcap": "한 과업을 <b>세 번에 걸쳐<\/b> 다듬어 보고, 무엇이 좋아졌는지 기록합니다"}, {"no": 34, "part": 4, "key": "HOW", "practice": false, "title": "도구별 실전 활용 흐름", "plain": "도구별 실전 활용 흐름", "html": "<p class=\"lead\">조사, 작성, 분석을 하나의 흐름으로 연계합니다.<\/p><div class=\"tw\"><table class=\"grid stack\"><thead><tr><th>단계<\/th><th>도구 성격<\/th><th>하는 일<\/th><th>다음으로 전달할 내용<\/th><\/tr><\/thead><tbody><tr><td class=\"lab\" data-label=\"단계\">1. 조사<\/td><td data-label=\"도구 성격\">검색형<\/td><td data-label=\"하는 일\">실시간 검색으로 근거와 출처를 확보합니다<\/td><td data-label=\"다음으로 전달할 내용\">확인된 사실과 링크<\/td><\/tr><tr><td class=\"lab\" data-label=\"단계\">2. 분석<\/td><td data-label=\"도구 성격\">자료 기반형<\/td><td data-label=\"하는 일\">내부 자료를 업로드해 근거 인용과 함께 분석합니다<\/td><td data-label=\"다음으로 전달할 내용\">요약과 시사점<\/td><\/tr><tr><td class=\"lab\" data-label=\"단계\">3. 작성<\/td><td data-label=\"도구 성격\">문서형<\/td><td data-label=\"하는 일\">확보한 재료로 보고서 구조를 생성합니다<\/td><td data-label=\"다음으로 전달할 내용\">검토용 초안<\/td><\/tr><tr><td class=\"lab\" data-label=\"단계\">4. 검증<\/td><td data-label=\"도구 성격\">사람<\/td><td data-label=\"하는 일\">수치와 출처를 원문과 대조합니다<\/td><td data-label=\"다음으로 전달할 내용\">최종 문서<\/td><\/tr><\/tbody><\/table><\/div><h3 class=\"sec\">자료 기반 도구가 특히 유용한 이유<\/h3><p>회사 기준과 승인 절차를 확인한 자료를 자료 기반 도구에 등록하고, 기록에 없는 내용은 추정하지 말고 확인 필요로 표시하도록 요청합니다. 답변의 인용 번호를 원문과 대조하여 근거를 확인합니다. 계정에 따라 자동 요약·플래시 카드·퀴즈, 보고서·데이터 표, AI 오디오 오버뷰·동영상 개요, 인포그래픽·슬라이드 자료·마인드맵 등의 생성 기능과 한도가 다를 수 있으므로 사용 가능한 기능과 한도를 확인합니다.<\/p><div class=\"tw\"><table class=\"grid stack\"><thead><tr><th>효과적인 업로드 자료<\/th><th>권장 사항<\/th><\/tr><\/thead><tbody><tr><td data-label=\"효과적인 업로드 자료\">연구 보고서와 현황 자료<\/td><td data-label=\"권장 사항\">최근 1~3년 발행 자료를 우선합니다<\/td><\/tr><tr><td data-label=\"효과적인 업로드 자료\">내부 규정집과 업무 지침서<\/td><td data-label=\"권장 사항\">회사 기준과 승인 절차를 확인한 기준 문서만 등록합니다<\/td><\/tr><tr><td data-label=\"효과적인 업로드 자료\">사업계획서와 추진 실적<\/td><td data-label=\"권장 사항\">회사 승인 저장소와 보관 기준을 확인한 뒤, 비식별화한 자료만 등록하고 가능하면 원문 업로드를 삼갑니다<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"read\"><div class=\"rt\">업로드 자료 기반 분석 프롬프트<\/div><p>업로드한 자료만을 기반으로 답변해 주세요. 외부 정보나 추측은 사용하지 않습니다. ① 핵심 내용 다섯 가지 ② 중요 시사점 다섯 가지 ③ 우리 팀이 반드시 알아야 할 내용 ④ 즉시 실행 가능한 과제 ⑤ 향후 검토가 필요한 내용을 정리해 주세요. 작성 기준은 팀 보고 수준, 핵심 문장 중심, 중복 제거, 수치와 근거 우선, 객관적 표현입니다. 마지막에 3줄 요약, 최고 의사결정권자 브리핑, 실무자 액션아이템을 별도로 작성합니다.<\/p><\/aside><h3 class=\"sec\">흐름을 끊지 않고 전달하는 요령<\/h3><p>도구를 옮길 때 결과를 그대로 복사해 붙이면 맥락이 함께 넘어가지 않습니다. 앞 단계에서 확인한 것과 다음 단계에서 만들 것을 한두 줄로 요약해 함께 붙이합니다. 이 두 줄이 있고 없고에 따라 다음 단계의 결과가 크게 달라집니다.<\/p><aside class=\"read\"><div class=\"rt\">전달할 때 함께 붙이는 두 줄<\/div><p>앞 단계에서 확인한 근거는 다음과 같습니다. 이 근거만 사용하고 추가 추정은 하지 않습니다. 이번 단계에서는 이 근거로 보고서 본문의 구조를 만들어 주세요.<\/p><\/aside>", "source": "", "bridge": "", "fields": [], "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 316\" role=\"img\" aria-label=\"1. 조사, 2. 분석, 3. 작성, 4. 검증 네 마디가 한 줄로 이어지고 마디 사이마다 다음으로 넘기는 것을 꼬리표로 단 파이프라인 그림\"><defs><marker id=\"u37-a\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"13\" markerHeight=\"13\" markerUnits=\"userSpaceOnUse\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 Z\" class=\"f-dim\"/><\/marker><\/defs><line x1=\"64\" y1=\"31\" x2=\"64\" y2=\"298\" class=\"ln-b s-dim\" marker-end=\"url(#u37-a)\"/><text x=\"136\" y=\"40\" class=\"t-label\">다음으로 넘기는 것<\/text><rect x=\"136\" y=\"52\" width=\"194\" height=\"30\" rx=\"8\" class=\"f-pt s-part\" stroke-width=\"2\"/><line x1=\"66\" y1=\"67\" x2=\"146\" y2=\"67\" class=\"ln s-dim\"/><circle cx=\"150\" cy=\"67\" r=\"4\" class=\"f-white s-part\" stroke-width=\"2\"/><text x=\"164\" y=\"71.86\" class=\"t-label\">확인된 사실과 링크<\/text><rect x=\"136\" y=\"124\" width=\"194\" height=\"30\" rx=\"8\" class=\"f-pt s-part\" stroke-width=\"2\"/><line x1=\"66\" y1=\"139\" x2=\"146\" y2=\"139\" class=\"ln s-dim\"/><circle cx=\"150\" cy=\"139\" r=\"4\" class=\"f-white s-part\" stroke-width=\"2\"/><text x=\"164\" y=\"143.86\" class=\"t-label\">요약과 시사점<\/text><rect x=\"136\" y=\"196\" width=\"194\" height=\"30\" rx=\"8\" class=\"f-pt s-part\" stroke-width=\"2\"/><line x1=\"66\" y1=\"211\" x2=\"146\" y2=\"211\" class=\"ln s-dim\"/><circle cx=\"150\" cy=\"211\" r=\"4\" class=\"f-white s-part\" stroke-width=\"2\"/><text x=\"164\" y=\"215.86\" class=\"t-label\">검토용 초안<\/text><rect x=\"136\" y=\"268\" width=\"194\" height=\"30\" rx=\"8\" class=\"f-pt s-part\" stroke-width=\"2\"/><line x1=\"66\" y1=\"283\" x2=\"146\" y2=\"283\" class=\"ln s-dim\"/><circle cx=\"150\" cy=\"283\" r=\"4\" class=\"f-white s-part\" stroke-width=\"2\"/><text x=\"164\" y=\"287.86\" class=\"t-label\">최종 문서<\/text><rect x=\"14\" y=\"14\" width=\"100\" height=\"34\" rx=\"10\" class=\"f-navy\"/><text x=\"64\" y=\"35.86\" class=\"t-label t-on\" text-anchor=\"middle\">1. 조사<\/text><rect x=\"14\" y=\"86\" width=\"100\" height=\"34\" rx=\"10\" class=\"f-navy\"/><text x=\"64\" y=\"107.86\" class=\"t-label t-on\" text-anchor=\"middle\">2. 분석<\/text><rect x=\"14\" y=\"158\" width=\"100\" height=\"34\" rx=\"10\" class=\"f-navy\"/><text x=\"64\" y=\"179.86\" class=\"t-label t-on\" text-anchor=\"middle\">3. 작성<\/text><rect x=\"14\" y=\"230\" width=\"100\" height=\"34\" rx=\"10\" class=\"f-navy\"/><text x=\"64\" y=\"251.86\" class=\"t-label t-on\" text-anchor=\"middle\">4. 검증<\/text><\/svg>", "figcap": "조사, 분석, 작성, 검증을 <b>하나의 흐름<\/b>으로 잇습니다"}, {"no": 35, "part": 4, "key": "HOW", "practice": true, "title": "생각해보기 : 업로드 자료 기반 분석", "plain": "생각해보기 : 업로드 자료 기반 분석", "html": "<p class=\"lead\">자료 한 건을 업로드하고, 네 가지 질문으로 분석합니다.<\/p><div class=\"tw\"><table class=\"grid stack\"><thead><tr><th>절차<\/th><th>내용<\/th><\/tr><\/thead><tbody><tr><td class=\"lab\" data-label=\"절차\">1<\/td><td data-label=\"내용\">자료 기반 분석 도구에 접속해 새 노트북을 생성합니다<\/td><\/tr><tr><td class=\"lab\" data-label=\"절차\">2<\/td><td data-label=\"내용\">분석할 자료 한 건을 업로드합니다<\/td><\/tr><tr><td class=\"lab\" data-label=\"절차\">3<\/td><td data-label=\"내용\">분석 프롬프트를 입력합니다<\/td><\/tr><tr><td class=\"lab\" data-label=\"절차\">4<\/td><td data-label=\"내용\">답변의 인용 번호를 눌러 원문과 대조합니다<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box\"><div class=\"bt\">어떤 자료를 올릴 것인가<\/div><p>신호등의 활용 가능 등급에 해당하는 자료를 선정합니다. 공개된 연구보고서나 대외 발표 자료, 업계 동향 기사처럼 이미 외부에 공개된 문서가 가장 안전합니다. 내부 문서를 쓰고 싶다면 조직명과 수치를 먼저 변환한 뒤 올립니다.<\/p><\/div><div class=\"wrow\"><label class=\"wcap\">① 핵심 내용 다섯 가지 중 가장 중요하다고 판단한 두 가지<\/label><textarea class=\"w\" rows=\"6\" data-k=\"f071\" data-cap=\"① 핵심 내용 다섯 가지 중 가장 중요하다고 판단한 두 가지\" aria-label=\"① 핵심 내용 다섯 가지 중 가장 중요하다고 판단한 두 가지\"><\/textarea><\/div><div class=\"wrow\"><label class=\"wcap\">② 내가 속한 조직이 반드시 알아야 할 내용<\/label><textarea class=\"w\" rows=\"6\" data-k=\"f072\" data-cap=\"② 내가 속한 조직이 반드시 알아야 할 내용\" aria-label=\"② 내가 속한 조직이 반드시 알아야 할 내용\"><\/textarea><\/div><div class=\"wrow\"><label class=\"wcap\">③ 즉시 실행 가능한 조치 한 가지<\/label><textarea class=\"w\" rows=\"6\" data-k=\"f073\" data-cap=\"③ 즉시 실행 가능한 조치 한 가지\" aria-label=\"③ 즉시 실행 가능한 조치 한 가지\"><\/textarea><\/div><aside class=\"read\"><div class=\"rt\">자료에 없는 내용을 물으면<\/div><p>자료 기반 도구를 사용할 때는 기록에 없는 내용을 추정하지 말고 확인 필요로 표시해 달라고 요청합니다. 답변의 인용을 원문과 대조하여 확인합니다. 그 결과는 어떤 자료를 더 확보해야 하는지 알려 주는 기준이 됩니다.<\/p><\/aside>", "source": "", "bridge": "", "fields": [{"k": "f071", "cap": "① 핵심 내용 다섯 가지 중 가장 중요하다고 판단한 두 가지"}, {"k": "f072", "cap": "② 내가 속한 조직이 반드시 알아야 할 내용"}, {"k": "f073", "cap": "③ 즉시 실행 가능한 조치 한 가지"}], "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 300\" role=\"img\" aria-label=\"가운데 업로드 자료 문서를 두고 둘레 궤도에 절차 1부터 4까지를 적은 칩 네 개가 놓인 그림\"><ellipse cx=\"200\" cy=\"150\" rx=\"160\" ry=\"126\" class=\"ln s-dim dash\"/><path d=\"M174,104 H218 L234,120 V180 A8,8 0 0 1 226,188 H174 A8,8 0 0 1 166,180 V112 A8,8 0 0 1 174,104 Z\" class=\"f-part\"/><path d=\"M218,104 V120 H234 Z\" class=\"f-pt2\"/><text class=\"t-label t-on\" text-anchor=\"middle\"><tspan x=\"200\" y=\"141.86\">업로드<\/tspan><tspan x=\"200\" y=\"159.86\">자료<\/tspan><\/text><rect x=\"14\" y=\"38\" width=\"150\" height=\"48\" rx=\"10\" class=\"f-tint\"/><circle cx=\"36\" cy=\"62\" r=\"12\" class=\"f-navy\"/><text x=\"36\" y=\"66.86\" class=\"t-label t-on\" text-anchor=\"middle\">1<\/text><text class=\"t-label\"><tspan x=\"56\" y=\"57.86\">새 노트북을<\/tspan><tspan x=\"56\" y=\"75.86\">만듭니다<\/tspan><\/text><rect x=\"236\" y=\"38\" width=\"150\" height=\"48\" rx=\"10\" class=\"f-tint\"/><circle cx=\"258\" cy=\"62\" r=\"12\" class=\"f-navy\"/><text x=\"258\" y=\"66.86\" class=\"t-label t-on\" text-anchor=\"middle\">2<\/text><text class=\"t-label\"><tspan x=\"278\" y=\"57.86\">자료 한 건을<\/tspan><tspan x=\"278\" y=\"75.86\">업로드합니다<\/tspan><\/text><rect x=\"236\" y=\"214\" width=\"150\" height=\"48\" rx=\"10\" class=\"f-tint\"/><circle cx=\"258\" cy=\"238\" r=\"12\" class=\"f-navy\"/><text x=\"258\" y=\"242.86\" class=\"t-label t-on\" text-anchor=\"middle\">3<\/text><text class=\"t-label\"><tspan x=\"278\" y=\"233.86\">분석 프롬프트를<\/tspan><tspan x=\"278\" y=\"251.86\">입력합니다<\/tspan><\/text><rect x=\"14\" y=\"214\" width=\"150\" height=\"48\" rx=\"10\" class=\"f-tint\"/><circle cx=\"36\" cy=\"238\" r=\"12\" class=\"f-navy\"/><text x=\"36\" y=\"242.86\" class=\"t-label t-on\" text-anchor=\"middle\">4<\/text><text class=\"t-label\"><tspan x=\"56\" y=\"233.86\">원문과<\/tspan><tspan x=\"56\" y=\"251.86\">대조합니다<\/tspan><\/text><\/svg>", "figcap": "분석할 자료 한 건을 업로드하고, 답변의 <b>인용 번호<\/b>를 눌러 원문과 대조합니다"}, {"no": 36, "part": 5, "key": "GROW", "practice": false, "title": "질문을 다듬는 일에서 환경을 구성하는 일로", "plain": "질문을 다듬는 일에서 환경을 구성하는 일로", "html": "<p class=\"lead\">매번 설명하고 있다면, 설명을 저장할 때가 된 것입니다.<\/p><p>프롬프트를 잘 쓰게 되면 다음 단계의 불편이 찾아옵니다. 매번 같은 배경 설명을 붙여 넣고 있다는 사실을 깨닫는 순간입니다. 우리 조직이 어떤 일을 하는지, 이 문서를 누가 읽는지, 어떤 표현을 쓰면 안 되는지를 반복해 입력하고 있다면 이제 질문보다 환경을 손볼 시점입니다.<\/p><div class=\"tw\"><table class=\"grid stack\"><thead><tr><th>단계<\/th><th>리더가 하는 일<\/th><th>비유<\/th><\/tr><\/thead><tbody><tr><td class=\"lab\" data-label=\"단계\">코딩<\/td><td data-label=\"리더가 하는 일\">명령을 한 줄씩 직접 작성합니다<\/td><td data-label=\"비유\">재료 손질부터 직접 합니다<\/td><\/tr><tr><td class=\"lab\" data-label=\"단계\">프롬프트<\/td><td data-label=\"리더가 하는 일\">최적의 질문을 설계합니다<\/td><td data-label=\"비유\">레시피를 말로 주문합니다<\/td><\/tr><tr><td class=\"lab\" data-label=\"단계\">컨텍스트<\/td><td data-label=\"리더가 하는 일\">조직을 이해하는 환경을 생성합니다<\/td><td data-label=\"비유\">주방이 단골의 취향을 기억합니다<\/td><\/tr><tr><td class=\"lab\" data-label=\"단계\">하네스<\/td><td data-label=\"리더가 하는 일\">목표와 평가 기준을 정합니다<\/td><td data-label=\"비유\">메뉴의 방향만 정합니다<\/td><\/tr><\/tbody><\/table><\/div><h3 class=\"sec\">성과의 크기가 달라지는 지점<\/h3><p>질문만 바꾸면 결과가 조금 좋아집니다. 맥락까지 저장하면 반복 작업이 줄어듭니다. 구조까지 바꾸면 일의 총량 자체가 달라집니다. 오늘 과정의 마지막 목표는 세 번째 지점을 향해 첫걸음을 떼는 것입니다.<\/p><div class=\"box\"><div class=\"bt\">스스로에게 던지는 확인 질문<\/div><p>이 자료를, 이 설명을, 이 형식 지침을 매번 붙이고 있지 않습니까. 그렇다면 그것이 저장해야 할 컨텍스트입니다.<\/p><\/div><h3 class=\"sec\">무엇을 컨텍스트로 저장할 것인가<\/h3><div class=\"tw\"><table class=\"grid stack\"><thead><tr><th>저장할 대상<\/th><th>예시<\/th><\/tr><\/thead><tbody><tr><td class=\"lab\" data-label=\"저장할 대상\">우리 회사<\/td><td data-label=\"예시\">우리 회사의 업무와 주요 용어<\/td><\/tr><tr><td class=\"lab\" data-label=\"저장할 대상\">이 문서 독자<\/td><td data-label=\"예시\">이 문서를 읽는 사람과 그가 중요하게 보는 항목<\/td><\/tr><tr><td class=\"lab\" data-label=\"저장할 대상\">과거 방식<\/td><td data-label=\"예시\">이 업무를 처리해 온 방식과 기존 문서의 구조<\/td><\/tr><tr><td class=\"lab\" data-label=\"저장할 대상\">판단 기준<\/td><td data-label=\"예시\">무엇을 중요하게 볼지와 판단 기준<\/td><\/tr><tr><td class=\"lab\" data-label=\"저장할 대상\">금지 사항<\/td><td data-label=\"예시\">쓰면 안 되는 표현, 넣지 않는 정보<\/td><\/tr><\/tbody><\/table><\/div><p>다섯 가지 가운데 앞의 두 가지가 특히 중요합니다. 우리 조직과 이 문서의 독자는 도구가 결코 알 수 없는 정보이고, 동시에 결과물의 방향을 가장 크게 좌우하는 정보이기 때문입니다.<\/p>", "source": "", "bridge": "", "fields": [], "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 320\" role=\"img\" aria-label=\"코딩, 프롬프트, 컨텍스트, 하네스가 안에서 밖으로 넓어지는 동심원 넷으로 놓이고 환경을 만드는 컨텍스트 고리가 강조된 그림입니다\"><circle cx=\"200\" cy=\"160\" r=\"147\" class=\"f-tint s-dim\" stroke-width=\"2\"/><circle cx=\"200\" cy=\"160\" r=\"111\" class=\"f-part\"/><circle cx=\"200\" cy=\"160\" r=\"75\" class=\"f-hair\"/><circle cx=\"200\" cy=\"160\" r=\"39\" class=\"f-white s-dim\" stroke-width=\"2\"/><text x=\"200\" y=\"36\" text-anchor=\"middle\" class=\"t-label\">하네스<\/text><text x=\"200\" y=\"72.5\" text-anchor=\"middle\" class=\"t-title t-on\">컨텍스트<\/text><text x=\"200\" y=\"108\" text-anchor=\"middle\" class=\"t-label\">프롬프트<\/text><text x=\"200\" y=\"165\" text-anchor=\"middle\" class=\"t-label\">코딩<\/text><\/svg>", "figcap": "질문을 다듬는 일에서 <b>환경을 만드는 일<\/b>로 · 코딩 · 프롬프트 · 컨텍스트 · 하네스"}, {"no": 37, "part": 5, "key": "GROW", "practice": false, "title": "이름 · 지침 · 지식, 세 칸이면 봇이 됩니다", "plain": "이름 · 지침 · 지식, 세 칸이면 봇이 됩니다", "html": "<p class=\"lead\">설명은 한 번, 실행은 매일. 반복 업무를 봇에게 맡깁니다.<\/p><p>주요 도구는 사용자가 자기만의 맞춤 봇을 만들 수 있는 기능을 제공합니다. 이름과 지침과 참고 자료 세 가지만 채우면 되고, 한 번 만들어 두면 매번 배경을 설명할 필요가 없어집니다.<\/p><div class=\"tw\"><table class=\"grid stack\"><thead><tr><th>칸<\/th><th>무엇을 적는가<\/th><th>예시<\/th><\/tr><\/thead><tbody><tr><td class=\"lab\" data-label=\"칸\">이름<\/td><td data-label=\"무엇을 적는가\">역할이 드러나는 한 줄<\/td><td data-label=\"예시\">주간 보고 초안 봇<\/td><\/tr><tr><td class=\"lab\" data-label=\"칸\">지침<\/td><td data-label=\"무엇을 적는가\">말투와 형식의 규칙, 금지 사항<\/td><td data-label=\"예시\">개조식과 명사형 종결어미로 작성합니다. 추정 수치는 쓰지 않습니다. 결론을 첫 문단에 배치합니다<\/td><\/tr><tr><td class=\"lab\" data-label=\"칸\">지식<\/td><td data-label=\"무엇을 적는가\">참고할 문서 첨부<\/td><td data-label=\"예시\">지난 분기 보고서 양식, 용어 정리표<\/td><\/tr><\/tbody><\/table><\/div><h3 class=\"sec\">어떤 업무를 봇으로 만들 것인가<\/h3><div class=\"tw\"><table class=\"grid stack\"><thead><tr><th>적합한 업무<\/th><th>이유<\/th><\/tr><\/thead><tbody><tr><td data-label=\"적합한 업무\">주간·월간 정기 보고<\/td><td data-label=\"이유\">형식이 고정되어 있고 반복됩니다<\/td><\/tr><tr><td data-label=\"적합한 업무\">회의록 정리<\/td><td data-label=\"이유\">입력의 형태와 출력의 형태가 일정합니다<\/td><\/tr><tr><td data-label=\"적합한 업무\">정형 이메일 회신<\/td><td data-label=\"이유\">톤과 구조가 매번 같습니다<\/td><\/tr><tr><td data-label=\"적합한 업무\">교육 자료 초안<\/td><td data-label=\"이유\">참고할 기준 문서가 명확합니다<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box\"><div class=\"bt\">첫 봇은 작게 생성합니다<\/div><p>완벽한 지침을 처음부터 쓰려 하면 만들지 못합니다. 세 줄짜리 지침으로 시작해 결과가 어긋날 때마다 한 줄씩 더하는 방식이 훨씬 빠릅니다. 지침은 결과에 따라 한 줄씩 보완합니다.<\/p><\/div><h3 class=\"sec\">봇이 기대만큼 작동하지 않을 때<\/h3><p>첫 번째 봇은 대개 만족스럽지 않습니다. 문제의 원인은 지침의 길이보다 모호함에 있습니다. 간결하게 써 주세요는 지침이 아닙니다. 한 항목당 두 줄 이내로 써 주세요가 지침입니다. 판단이 필요한 표현은 지침에서 빼고, 세어 볼 수 있는 조건으로 바꿉니다.<\/p><div class=\"tw\"><table class=\"grid stack\"><thead><tr><th>모호한 지침<\/th><th>작동하는 지침<\/th><\/tr><\/thead><tbody><tr><td data-label=\"모호한 지침\">간결하게 작성해 주세요<\/td><td data-label=\"작동하는 지침\">각 항목은 두 줄 이내로 작성합니다<\/td><\/tr><tr><td data-label=\"모호한 지침\">전문적인 느낌으로<\/td><td data-label=\"작동하는 지침\">명사형 종결어미를 사용하고 수식어를 쓰지 않습니다<\/td><\/tr><tr><td data-label=\"모호한 지침\">중요한 내용 위주로<\/td><td data-label=\"작동하는 지침\">결론을 첫 문단에 배치하고 근거는 그 뒤에 배치합니다<\/td><\/tr><\/tbody><\/table><\/div>", "source": "", "bridge": "", "fields": [], "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 272\" role=\"img\" aria-label=\"이름, 지침, 지식 세 블록이 쌓이고 화살표를 따라 봇 하나가 되며, 블록 옆에는 설명은 한 번, 봇 옆에는 실행은 매일이 적힌 그림입니다\"><defs><marker id=\"u40-a\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"12\" markerHeight=\"12\" markerUnits=\"userSpaceOnUse\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 Z\" class=\"f-dim\"/><\/marker><\/defs><rect x=\"12\" y=\"12\" width=\"244\" height=\"44\" rx=\"10\" class=\"f-tint\"/><text x=\"30\" y=\"40\" class=\"t-title\">이름<\/text><text x=\"80\" y=\"40\" class=\"t-label\">역할이 드러나는 한 줄<\/text><rect x=\"12\" y=\"62\" width=\"244\" height=\"44\" rx=\"10\" class=\"f-tint\"/><text x=\"30\" y=\"90\" class=\"t-title\">지침<\/text><text x=\"80\" y=\"90\" class=\"t-label\">말투와 형식의 규칙<\/text><rect x=\"12\" y=\"112\" width=\"244\" height=\"44\" rx=\"10\" class=\"f-tint\"/><text x=\"30\" y=\"140\" class=\"t-title\">지식<\/text><text x=\"80\" y=\"140\" class=\"t-label\">참고할 문서 첨부<\/text><line x1=\"134\" y1=\"164\" x2=\"134\" y2=\"189\" class=\"ln-b s-dim\" marker-end=\"url(#u40-a)\"/><rect x=\"12\" y=\"200\" width=\"244\" height=\"60\" rx=\"12\" class=\"f-part\"/><text x=\"134\" y=\"237\" text-anchor=\"middle\" class=\"t-big t-on\">봇<\/text><path d=\"M262,14 H270 V154 H262\" class=\"ln s-dim\"/><text x=\"282\" y=\"89.5\" class=\"t-title\">설명은 한 번<\/text><path d=\"M262,202 H270 V258 H262\" class=\"ln s-dim\"/><text x=\"282\" y=\"235.5\" class=\"t-title\">실행은 매일<\/text><\/svg>", "figcap": "이름 · 지침 · 지식, 세 칸이면 <b>봇<\/b>이 됩니다 · 설명은 한 번, 실행은 매일"}, {"no": 38, "part": 5, "key": "GROW", "practice": false, "title": "협업 요청의 점검법, 목·기·산·방", "plain": "협업 요청의 점검법, 목·기·산·방", "html": "<p class=\"lead\">AI에게 잘 청하는 사람이 동료에게도 잘 청합니다.<\/p><p>좋은 프롬프트의 원리는 사람 사이의 협업에도 그대로 적용됩니다. 목적과 기한과 산출물과 방식, 네 가지가 빠지면 요청받은 사람은 짐작으로 일해야 합니다. 짐작으로 만든 결과물은 대체로 다시 만들어집니다.<\/p><div class=\"tw\"><table class=\"grid stack\"><thead><tr><th>요소<\/th><th>확인 질문<\/th><\/tr><\/thead><tbody><tr><td class=\"lab\" data-label=\"요소\">목 · 목적<\/td><td data-label=\"확인 질문\">왜 이 일을 하는가. 이 결과물이 어디에 쓰이는가<\/td><\/tr><tr><td class=\"lab\" data-label=\"요소\">기 · 기한<\/td><td data-label=\"확인 질문\">언제까지 필요한가. 중간 확인은 언제 하는가<\/td><\/tr><tr><td class=\"lab\" data-label=\"요소\">산 · 산출물<\/td><td data-label=\"확인 질문\">어떤 형태로 받고 싶은가. 분량과 형식은 어떠한가<\/td><\/tr><tr><td class=\"lab\" data-label=\"요소\">방 · 방식<\/td><td data-label=\"확인 질문\">어떻게 진행하는가. 어떤 자원과 소통 경로를 쓰는가<\/td><\/tr><\/tbody><\/table><\/div><h3 class=\"sec\">같은 요청, 두 가지 방식<\/h3><div class=\"tw\"><table class=\"grid stack\"><thead><tr><th>점검 없는 요청<\/th><th>목·기·산·방을 갖춘 요청<\/th><\/tr><\/thead><tbody><tr><td data-label=\"점검 없는 요청\">상반기 실적 좀 분석해 주시겠습니까<\/td><td data-label=\"목·기·산·방을 갖춘 요청\">8월 팀 워크숍에서 하반기 목표와 전략을 수립하려 합니다. 그 자리에서 발표할 상반기 실적 분석이 필요합니다. 발표용 슬라이드 다섯 장 분량으로, 다음 주 금요일까지 초안을 부탁드립니다. 지난 분기 자료는 공유 폴더에 있고, 중간에 한 번 방향을 확인하면 좋겠습니다<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"read\"><div class=\"rt\">요청을 받는 쪽에서도 활용합니다<\/div><p>모호한 요청을 받았을 때 네 가지를 되물으면 됩니다. 이 결과물이 어디에 쓰이는지, 언제까지 필요한지, 어떤 형태로 드리면 되는지, 참고할 자료가 있는지. 되묻는 일은 일을 늦추는 대신 재작성할 일을 줄입니다.<\/p><\/aside><h3 class=\"sec\">네 요소 중 가장 자주 빠지는 것<\/h3><p>실무에서 가장 자주 빠지는 항목은 목적입니다. 기한과 산출물은 대체로 말하지만, 왜 필요한지는 말하지 않는 경우가 많습니다. 그런데 목적이 빠지면 요청받은 사람은 판단할 근거가 없어 지시를 그대로만 수행하게 됩니다. 더 나은 방법을 알고 있어도 제안하지 못합니다.<\/p><aside class=\"read\"><div class=\"rt\">목적을 말하면 발생하는 여유<\/div><p>목적을 알면 요청받은 사람이 상황에 맞게 조정할 수 있습니다. 자료가 부족하면 대체 자료를 찾고, 형식이 맞지 않으면 더 나은 형식을 제안합니다. 목적을 말하는 일은 통제를 줄이고 판단을 나누는 일입니다.<\/p><\/aside>", "source": "", "bridge": "", "fields": [], "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 246\" role=\"img\" aria-label=\"협업 요청이라고 적힌 편지 봉투에 목 목적, 기 기한, 산 산출물, 방 방식의 꼬리표 넷이 줄로 매달린 그림입니다\"><rect x=\"121\" y=\"13\" width=\"158\" height=\"86\" rx=\"10\" class=\"f-tint s-dim\" stroke-width=\"2\"/><path d=\"M126,19 L200,57 L274,19\" class=\"ln s-dim\"/><text x=\"200\" y=\"84\" text-anchor=\"middle\" class=\"t-label\">협업 요청<\/text><path d=\"M37,146 H81 L99,164 V224 Q99,234 89,234 H29 Q19,234 19,224 V164 Z\" class=\"f-part\"/><path d=\"M131,146 H175 L193,164 V224 Q193,234 183,234 H123 Q113,234 113,224 V164 Z\" class=\"f-part\"/><path d=\"M225,146 H269 L287,164 V224 Q287,234 277,234 H217 Q207,234 207,224 V164 Z\" class=\"f-part\"/><path d=\"M319,146 H363 L381,164 V224 Q381,234 371,234 H311 Q301,234 301,224 V164 Z\" class=\"f-part\"/><line x1=\"176\" y1=\"100\" x2=\"59\" y2=\"162\" class=\"ln s-dim\"/><line x1=\"192\" y1=\"100\" x2=\"153\" y2=\"162\" class=\"ln s-dim\"/><line x1=\"208\" y1=\"100\" x2=\"247\" y2=\"162\" class=\"ln s-dim\"/><line x1=\"224\" y1=\"100\" x2=\"341\" y2=\"162\" class=\"ln s-dim\"/><circle cx=\"59\" cy=\"162\" r=\"5\" class=\"f-white\"/><circle cx=\"153\" cy=\"162\" r=\"5\" class=\"f-white\"/><circle cx=\"247\" cy=\"162\" r=\"5\" class=\"f-white\"/><circle cx=\"341\" cy=\"162\" r=\"5\" class=\"f-white\"/><text x=\"59\" y=\"200\" text-anchor=\"middle\" class=\"t-big t-on\">목<\/text><text x=\"59\" y=\"222\" text-anchor=\"middle\" class=\"t-label t-on\">목적<\/text><text x=\"153\" y=\"200\" text-anchor=\"middle\" class=\"t-big t-on\">기<\/text><text x=\"153\" y=\"222\" text-anchor=\"middle\" class=\"t-label t-on\">기한<\/text><text x=\"247\" y=\"200\" text-anchor=\"middle\" class=\"t-big t-on\">산<\/text><text x=\"247\" y=\"222\" text-anchor=\"middle\" class=\"t-label t-on\">산출물<\/text><text x=\"341\" y=\"200\" text-anchor=\"middle\" class=\"t-big t-on\">방<\/text><text x=\"341\" y=\"222\" text-anchor=\"middle\" class=\"t-label t-on\">방식<\/text><\/svg>", "figcap": "협업 요청의 점검법, <b>목·기·산·방<\/b> · 목적과 기한과 산출물과 방식"}, {"no": 39, "part": 5, "key": "GROW", "practice": true, "title": "생각해보기 : 목·기·산·방으로 요청문 다시 쓰기", "plain": "생각해보기 : 목·기·산·방으로 요청문 다시 쓰기", "html": "<p class=\"lead\">최근에 주고받은 모호한 요청 하나를 골라 다시 활용합니다.<\/p><div class=\"tw\"><table class=\"grid stack form\"><tbody><tr><td class=\"lab\">원래의 요청 문장<\/td><td class=\"in\"><textarea rows=\"3\" data-k=\"f074\" data-cap=\"원래의 요청 문장\" aria-label=\"원래의 요청 문장\"><\/textarea><\/td><\/tr><\/tbody><\/table><\/div><div class=\"tw\"><table class=\"grid stack form\"><tbody><tr><td class=\"lab\">목 · 목적<\/td><td class=\"in\"><textarea rows=\"2\" data-k=\"f075\" data-cap=\"목 · 목적\" aria-label=\"목 · 목적\"><\/textarea><\/td><\/tr><tr><td class=\"lab\">기 · 기한<\/td><td class=\"in\"><textarea rows=\"2\" data-k=\"f076\" data-cap=\"기 · 기한\" aria-label=\"기 · 기한\"><\/textarea><\/td><\/tr><tr><td class=\"lab\">산 · 산출물<\/td><td class=\"in\"><textarea rows=\"2\" data-k=\"f077\" data-cap=\"산 · 산출물\" aria-label=\"산 · 산출물\"><\/textarea><\/td><\/tr><tr><td class=\"lab\">방 · 방식<\/td><td class=\"in\"><textarea rows=\"2\" data-k=\"f078\" data-cap=\"방 · 방식\" aria-label=\"방 · 방식\"><\/textarea><\/td><\/tr><\/tbody><\/table><\/div><div class=\"wrow\"><label class=\"wcap\">네 요소를 이어 붙여 하나의 요청문으로 다시 활용합니다<\/label><textarea class=\"w\" rows=\"6\" data-k=\"f079\" data-cap=\"네 요소를 이어 붙여 하나의 요청문으로 다시 활용합니다\" aria-label=\"네 요소를 이어 붙여 하나의 요청문으로 다시 활용합니다\"><\/textarea><\/div><aside class=\"read\"><div class=\"rt\">이 단원이 프롬프트와 이어지는 지점<\/div><p>목·기·산·방은 4W와 같은 뼈대를 가지고 있습니다. 목적은 Why, 산출물은 What, 방식과 기한은 Way에 해당합니다. 사람에게 잘 청하는 문장을 쓸 수 있게 되면 도구에게 청하는 문장도 자연히 좋아집니다.<\/p><\/aside><h3 class=\"sec\">다시 쓴 요청문을 점검하는 질문<\/h3><p>작성한 요청문을 소리 내어 읽습니다. 읽는 동안 어색하게 느껴지는 부분이 있다면 대체로 그 부분에 정보가 빠져 있습니다.<\/p><div class=\"wrow\"><label class=\"wcap\">이 요청을 받은 사람이 되물을 만한 질문은 무엇입니까<\/label><textarea class=\"w\" rows=\"4\" data-k=\"f093\" data-cap=\"이 요청을 받은 사람이 되물을 만한 질문은 무엇입니까\" aria-label=\"이 요청을 받은 사람이 되물을 만한 질문은 무엇입니까\"><\/textarea><\/div>", "source": "", "bridge": "", "fields": [{"k": "f074", "cap": "원래의 요청 문장"}, {"k": "f075", "cap": "목 · 목적"}, {"k": "f076", "cap": "기 · 기한"}, {"k": "f077", "cap": "산 · 산출물"}, {"k": "f078", "cap": "방 · 방식"}, {"k": "f079", "cap": "네 요소를 이어 붙여 하나의 요청문으로 다시 활용합니다"}, {"k": "f093", "cap": "이 요청을 받은 사람이 되물을 만한 질문은 무엇입니까"}], "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 260\" role=\"img\" aria-label=\"원래의 요청 문장 한 줄이 부채꼴로 펼쳐져 목 목적, 기 기한, 산 산출물, 방 방식 네 줄의 빈칸으로 이어지는 그림입니다\"><polygon points=\"150,146 206,50 206,242\" class=\"f-pt\"/><line x1=\"150\" y1=\"146\" x2=\"212\" y2=\"65\" class=\"ln s-part\"/><line x1=\"150\" y1=\"146\" x2=\"212\" y2=\"119\" class=\"ln s-part\"/><line x1=\"150\" y1=\"146\" x2=\"212\" y2=\"173\" class=\"ln s-part\"/><line x1=\"150\" y1=\"146\" x2=\"212\" y2=\"227\" class=\"ln s-part\"/><line x1=\"139\" y1=\"146\" x2=\"150\" y2=\"146\" class=\"ln s-part\"/><circle cx=\"150\" cy=\"146\" r=\"5\" class=\"f-part\"/><text x=\"13\" y=\"118\" class=\"t-label\">원래의 요청 문장<\/text><rect x=\"13\" y=\"128\" width=\"124\" height=\"36\" rx=\"8\" class=\"f-white s-dim dash\" stroke-width=\"2\"/><rect x=\"212\" y=\"46\" width=\"84\" height=\"38\" rx=\"10\" class=\"f-part\"/><text x=\"254\" y=\"70\" text-anchor=\"middle\" class=\"t-label t-on\">목 · 목적<\/text><rect x=\"305\" y=\"46\" width=\"82\" height=\"38\" rx=\"10\" class=\"f-white s-dim dash\" stroke-width=\"2\"/><rect x=\"212\" y=\"100\" width=\"84\" height=\"38\" rx=\"10\" class=\"f-part\"/><text x=\"254\" y=\"124\" text-anchor=\"middle\" class=\"t-label t-on\">기 · 기한<\/text><rect x=\"305\" y=\"100\" width=\"82\" height=\"38\" rx=\"10\" class=\"f-white s-dim dash\" stroke-width=\"2\"/><rect x=\"212\" y=\"154\" width=\"84\" height=\"38\" rx=\"10\" class=\"f-part\"/><text x=\"254\" y=\"178\" text-anchor=\"middle\" class=\"t-label t-on\">산 · 산출물<\/text><rect x=\"305\" y=\"154\" width=\"82\" height=\"38\" rx=\"10\" class=\"f-white s-dim dash\" stroke-width=\"2\"/><rect x=\"212\" y=\"208\" width=\"84\" height=\"38\" rx=\"10\" class=\"f-part\"/><text x=\"254\" y=\"232\" text-anchor=\"middle\" class=\"t-label t-on\">방 · 방식<\/text><rect x=\"305\" y=\"208\" width=\"82\" height=\"38\" rx=\"10\" class=\"f-white s-dim dash\" stroke-width=\"2\"/><\/svg>", "figcap": "원래의 요청 문장을 <b>목·기·산·방<\/b> 네 요소로 다시 씁니다"}, {"no": 40, "part": 5, "key": "GROW", "practice": true, "title": "생각해보기 : 4주 실행 로드맵 이관 시트", "plain": "생각해보기 : 4주 실행 로드맵 이관 시트", "html": "<p class=\"lead\">교육의 성과는 다음 주의 실행에서 결정됩니다.<\/p><p>오늘 적은 내용 가운데 실제로 해 볼 것을 네 주로 나누어 배치합니다. 한 주에 하나면 충분합니다. 목표는 측정할 수 있게, 곧 무엇을 몇 번 했는지 셀 수 있게 기재합니다.<\/p><div class=\"tw\"><table class=\"grid stack form\"><thead><tr><th>시기<\/th><th>실행할 것<\/th><th>완료 판단 기준<\/th><\/tr><\/thead><tbody><tr><td class=\"lab\" data-label=\"시기\">1주차<\/td><td class=\"in\" data-label=\"실행할 것\"><textarea rows=\"3\" data-k=\"f080\" data-cap=\"1주차 · 실행할 것\" aria-label=\"1주차 · 실행할 것\"><\/textarea><\/td><td class=\"in\" data-label=\"완료 판단 기준\"><textarea rows=\"2\" data-k=\"f081\" data-cap=\"1주차 · 완료 판단 기준\" aria-label=\"1주차 · 완료 판단 기준\"><\/textarea><\/td><\/tr><tr><td class=\"lab\" data-label=\"시기\">2주차<\/td><td class=\"in\" data-label=\"실행할 것\"><textarea rows=\"3\" data-k=\"f082\" data-cap=\"2주차 · 실행할 것\" aria-label=\"2주차 · 실행할 것\"><\/textarea><\/td><td class=\"in\" data-label=\"완료 판단 기준\"><textarea rows=\"2\" data-k=\"f083\" data-cap=\"2주차 · 완료 판단 기준\" aria-label=\"2주차 · 완료 판단 기준\"><\/textarea><\/td><\/tr><tr><td class=\"lab\" data-label=\"시기\">3주차<\/td><td class=\"in\" data-label=\"실행할 것\"><textarea rows=\"3\" data-k=\"f084\" data-cap=\"3주차 · 실행할 것\" aria-label=\"3주차 · 실행할 것\"><\/textarea><\/td><td class=\"in\" data-label=\"완료 판단 기준\"><textarea rows=\"2\" data-k=\"f085\" data-cap=\"3주차 · 완료 판단 기준\" aria-label=\"3주차 · 완료 판단 기준\"><\/textarea><\/td><\/tr><tr><td class=\"lab\" data-label=\"시기\">4주차<\/td><td class=\"in\" data-label=\"실행할 것\"><textarea rows=\"3\" data-k=\"f086\" data-cap=\"4주차 · 실행할 것\" aria-label=\"4주차 · 실행할 것\"><\/textarea><\/td><td class=\"in\" data-label=\"완료 판단 기준\"><textarea rows=\"2\" data-k=\"f087\" data-cap=\"4주차 · 완료 판단 기준\" aria-label=\"4주차 · 완료 판단 기준\"><\/textarea><\/td><\/tr><\/tbody><\/table><\/div><div class=\"wrow\"><label class=\"wcap\">네 가지 중 가장 실행하기 어려울 것 같은 항목과, 그 이유는 무엇입니까<\/label><textarea class=\"w\" rows=\"4\" data-k=\"f088\" data-cap=\"네 가지 중 가장 실행하기 어려울 것 같은 항목과, 그 이유는 무엇입니까\" aria-label=\"네 가지 중 가장 실행하기 어려울 것 같은 항목과, 그 이유는 무엇입니까\"><\/textarea><\/div><div class=\"wrow\"><label class=\"wcap\">그 어려움을 줄이기 위해 지금 준비할 수 있는 것은 무엇입니까<\/label><textarea class=\"w\" rows=\"4\" data-k=\"f089\" data-cap=\"그 어려움을 줄이기 위해 지금 준비할 수 있는 것은 무엇입니까\" aria-label=\"그 어려움을 줄이기 위해 지금 준비할 수 있는 것은 무엇입니까\"><\/textarea><\/div><aside class=\"read\"><div class=\"rt\">작성 시 유의 사항<\/div><p>계량화할 수 있는 지표를 사용합니다. 프롬프트 활용보다 주간 보고 초안을 4W 형식으로 네 번 작성하는 방식처럼 기재합니다. 셀 수 있어야 실행 여부를 스스로 확인할 수 있고, 확인할 수 있어야 습관이 됩니다.<\/p><\/aside>", "source": "", "bridge": "", "fields": [{"k": "f080", "cap": "1주차 · 실행할 것"}, {"k": "f081", "cap": "1주차 · 완료 판단 기준"}, {"k": "f082", "cap": "2주차 · 실행할 것"}, {"k": "f083", "cap": "2주차 · 완료 판단 기준"}, {"k": "f084", "cap": "3주차 · 실행할 것"}, {"k": "f085", "cap": "3주차 · 완료 판단 기준"}, {"k": "f086", "cap": "4주차 · 실행할 것"}, {"k": "f087", "cap": "4주차 · 완료 판단 기준"}, {"k": "f088", "cap": "네 가지 중 가장 실행하기 어려울 것 같은 항목과, 그 이유는 무엇입니까"}, {"k": "f089", "cap": "그 어려움을 줄이기 위해 지금 준비할 수 있는 것은 무엇입니까"}], "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 238\" role=\"img\" aria-label=\"1주차부터 4주차까지 주마다 표지가 붙은 4주 × 5일 달력 격자와 실행할 것, 완료 판단 기준 칸이 모두 비어 있는 그림입니다\"><text x=\"39\" y=\"30\" text-anchor=\"middle\" class=\"t-label\">시기<\/text><text x=\"179\" y=\"30\" text-anchor=\"middle\" class=\"t-label\">실행할 것<\/text><text x=\"340\" y=\"30\" text-anchor=\"middle\" class=\"t-label\">완료 판단 기준<\/text><line x1=\"14\" y1=\"38\" x2=\"64\" y2=\"38\" class=\"ln s-dim\"/><line x1=\"77\" y1=\"38\" x2=\"281\" y2=\"38\" class=\"ln s-dim\"/><line x1=\"294\" y1=\"38\" x2=\"386\" y2=\"38\" class=\"ln s-dim\"/><rect x=\"12\" y=\"48\" width=\"54\" height=\"38\" rx=\"10\" class=\"f-part\"/><text x=\"39\" y=\"72\" text-anchor=\"middle\" class=\"t-label t-on\">1주차<\/text><rect x=\"76\" y=\"48\" width=\"38\" height=\"38\" rx=\"8\" class=\"f-tint\"/><rect x=\"118\" y=\"48\" width=\"38\" height=\"38\" rx=\"8\" class=\"f-tint\"/><rect x=\"160\" y=\"48\" width=\"38\" height=\"38\" rx=\"8\" class=\"f-tint\"/><rect x=\"202\" y=\"48\" width=\"38\" height=\"38\" rx=\"8\" class=\"f-tint\"/><rect x=\"244\" y=\"48\" width=\"38\" height=\"38\" rx=\"8\" class=\"f-tint\"/><rect x=\"293\" y=\"48\" width=\"94\" height=\"38\" rx=\"10\" class=\"f-white s-dim dash\" stroke-width=\"2\"/><rect x=\"12\" y=\"94\" width=\"54\" height=\"38\" rx=\"10\" class=\"f-part\"/><text x=\"39\" y=\"118\" text-anchor=\"middle\" class=\"t-label t-on\">2주차<\/text><rect x=\"76\" y=\"94\" width=\"38\" height=\"38\" rx=\"8\" class=\"f-tint\"/><rect x=\"118\" y=\"94\" width=\"38\" height=\"38\" rx=\"8\" class=\"f-tint\"/><rect x=\"160\" y=\"94\" width=\"38\" height=\"38\" rx=\"8\" class=\"f-tint\"/><rect x=\"202\" y=\"94\" width=\"38\" height=\"38\" rx=\"8\" class=\"f-tint\"/><rect x=\"244\" y=\"94\" width=\"38\" height=\"38\" rx=\"8\" class=\"f-tint\"/><rect x=\"293\" y=\"94\" width=\"94\" height=\"38\" rx=\"10\" class=\"f-white s-dim dash\" stroke-width=\"2\"/><rect x=\"12\" y=\"140\" width=\"54\" height=\"38\" rx=\"10\" class=\"f-part\"/><text x=\"39\" y=\"164\" text-anchor=\"middle\" class=\"t-label t-on\">3주차<\/text><rect x=\"76\" y=\"140\" width=\"38\" height=\"38\" rx=\"8\" class=\"f-tint\"/><rect x=\"118\" y=\"140\" width=\"38\" height=\"38\" rx=\"8\" class=\"f-tint\"/><rect x=\"160\" y=\"140\" width=\"38\" height=\"38\" rx=\"8\" class=\"f-tint\"/><rect x=\"202\" y=\"140\" width=\"38\" height=\"38\" rx=\"8\" class=\"f-tint\"/><rect x=\"244\" y=\"140\" width=\"38\" height=\"38\" rx=\"8\" class=\"f-tint\"/><rect x=\"293\" y=\"140\" width=\"94\" height=\"38\" rx=\"10\" class=\"f-white s-dim dash\" stroke-width=\"2\"/><rect x=\"12\" y=\"186\" width=\"54\" height=\"38\" rx=\"10\" class=\"f-part\"/><text x=\"39\" y=\"210\" text-anchor=\"middle\" class=\"t-label t-on\">4주차<\/text><rect x=\"76\" y=\"186\" width=\"38\" height=\"38\" rx=\"8\" class=\"f-tint\"/><rect x=\"118\" y=\"186\" width=\"38\" height=\"38\" rx=\"8\" class=\"f-tint\"/><rect x=\"160\" y=\"186\" width=\"38\" height=\"38\" rx=\"8\" class=\"f-tint\"/><rect x=\"202\" y=\"186\" width=\"38\" height=\"38\" rx=\"8\" class=\"f-tint\"/><rect x=\"244\" y=\"186\" width=\"38\" height=\"38\" rx=\"8\" class=\"f-tint\"/><rect x=\"293\" y=\"186\" width=\"94\" height=\"38\" rx=\"10\" class=\"f-white s-dim dash\" stroke-width=\"2\"/><\/svg>", "figcap": "실제로 해 볼 것을 네 주로 나누어 배치 · <b>한 주에 하나<\/b>면 충분합니다"}, {"no": 41, "part": 5, "key": "GROW", "practice": false, "title": "마무리: 오늘 확인한 것", "plain": "마무리: 오늘 확인한 것", "html": "<p class=\"lead\">도구는 계속 바뀝니다. 바뀌지 않는 것은 판단의 자리입니다.<\/p><p>오늘 다섯 단계를 걸었습니다. 우리가 어디에 서 있는지 확인했고, 이 도구가 무엇을 하고 있는지 원리를 보았으며, 무엇을 넣고 무엇을 넣지 않을지 경계를 그었습니다. 그다음 어떻게 청할 것인지 공식을 익혔고, 마지막으로 그것을 자리로 기억할 계획을 적었습니다.<\/p><div class=\"tw\"><table class=\"grid stack\"><thead><tr><th>단계<\/th><th>기억할 한 문장<\/th><\/tr><\/thead><tbody><tr><td class=\"lab\" data-label=\"단계\">WHO<\/td><td data-label=\"가져갈 한 문장\">맡길 일을 고르는 것이 먼저입니다. 도구를 고르는 것은 그다음입니다<\/td><\/tr><tr><td class=\"lab\" data-label=\"단계\">WHY<\/td><td data-label=\"가져갈 한 문장\">생성형 AI는 예측 모델입니다. 구조는 맡기고 사실은 확인합니다<\/td><\/tr><tr><td class=\"lab\" data-label=\"단계\">WHAT<\/td><td data-label=\"가져갈 한 문장\">지우지 말고 바꿔서 넣습니다. 경계가 분명해야 자유롭게 활용합니다<\/td><\/tr><tr><td class=\"lab\" data-label=\"단계\">HOW<\/td><td data-label=\"가져갈 한 문장\">누가, 왜, 무엇을, 어떻게. 네 칸을 채우면 결과가 달라집니다<\/td><\/tr><tr><td class=\"lab\" data-label=\"단계\">GROW<\/td><td data-label=\"가져갈 한 문장\">매번 설명하고 있다면 설명을 저장할 때가 된 것입니다<\/td><\/tr><\/tbody><\/table><\/div><p>다섯 문장 가운데 하나만 다음 주에 실제로 시도합니다. 실행 로드맵에 적어 둔 한 줄이 업무 자리에서 실행되는 순간, 오늘의 과정은 비로소 끝납니다.<\/p><h3 class=\"sec\">오늘 이후에 이어질 것<\/h3><p>입문 과정은 도구의 사용법을 다 배우는 자리가 아니었습니다. 판단의 기준을 세우는 자리였습니다. 도구는 계속 바뀌고, 이름도 화면도 바뀔 것입니다. 그러나 무엇을 맡기고 무엇을 남길지, 무엇을 넣고 무엇을 넣지 않을지, 어떻게 청하고 어떻게 검증할지에 대한 판단은 그대로 쓰입니다.<\/p><p>이 워크북은 강의가 끝난 뒤에 다시 열어 보실 때 더 쓸모가 있습니다. 직접 적어 둔 답안이 곧 자신의 기준이기 때문입니다. 한 달 뒤 직접 세운 실행 로드맵을 다시 펴고, 몇 개나 실행했는지 확인합니다.<\/p><h3 class=\"sec\">참고문헌<\/h3><div class=\"refs\"><p>Ebbinghaus, H. (1885). <i>Über das Gedächtnis: Untersuchungen zur experimentellen Psychologie<\/i>. Duncker &amp; Humblot.<\/p><p>Mollick, E. (2024). <i>Co-Intelligence: Living and Working with AI<\/i>. Portfolio.<\/p><p>Sinek, S. (2009). <i>Start with Why: How Great Leaders Inspire Everyone to Take Action<\/i>. Portfolio.<\/p><p>본 교재에 인용된 도구별 기능 설명은 2026년 8월 기준이며, 각 서비스의 정책과 화면 구성은 변경될 수 있습니다. 출처가 특정되지 않은 사례는 교육용으로 재구성한 가상 시나리오입니다.<\/p><\/div>", "source": "", "bridge": "", "fields": [], "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 270\" role=\"img\" aria-label=\"WHO, WHY, WHAT, HOW, GROW 다섯 칸이 하나의 띠로 이어지고 칸마다 가져갈 한 문장이 옆에 적힌 그림입니다\"><line x1=\"116\" y1=\"60\" x2=\"386\" y2=\"60\" class=\"ln s-hair\"/><line x1=\"116\" y1=\"110\" x2=\"386\" y2=\"110\" class=\"ln s-hair\"/><line x1=\"116\" y1=\"160\" x2=\"386\" y2=\"160\" class=\"ln s-hair\"/><line x1=\"116\" y1=\"210\" x2=\"386\" y2=\"210\" class=\"ln s-hair\"/><rect x=\"12\" y=\"12\" width=\"88\" height=\"46\" rx=\"8\" class=\"f-part\"/><text x=\"56\" y=\"40.5\" text-anchor=\"middle\" class=\"t-title t-on\">WHO<\/text><text x=\"116\" y=\"40\" class=\"t-label\">맡길 일을 고르는 것이 먼저<\/text><rect x=\"12\" y=\"62\" width=\"88\" height=\"46\" rx=\"8\" class=\"f-part\"/><text x=\"56\" y=\"90.5\" text-anchor=\"middle\" class=\"t-title t-on\">WHY<\/text><text x=\"116\" y=\"90\" class=\"t-label\">구조는 맡기고 사실은 확인<\/text><rect x=\"12\" y=\"112\" width=\"88\" height=\"46\" rx=\"8\" class=\"f-part\"/><text x=\"56\" y=\"140.5\" text-anchor=\"middle\" class=\"t-title t-on\">WHAT<\/text><text x=\"116\" y=\"140\" class=\"t-label\">지우지 말고 바꿔서 넣습니다<\/text><rect x=\"12\" y=\"162\" width=\"88\" height=\"46\" rx=\"8\" class=\"f-part\"/><text x=\"56\" y=\"190.5\" text-anchor=\"middle\" class=\"t-title t-on\">HOW<\/text><text x=\"116\" y=\"190\" class=\"t-label\">누가, 왜, 무엇을, 어떻게<\/text><rect x=\"12\" y=\"212\" width=\"88\" height=\"46\" rx=\"8\" class=\"f-part\"/><text x=\"56\" y=\"240.5\" text-anchor=\"middle\" class=\"t-title t-on\">GROW<\/text><text x=\"116\" y=\"240\" class=\"t-label\">설명을 저장할 때가 된 것<\/text><\/svg>", "figcap": "오늘 다섯 단계를 걸었습니다 · 단계마다 <b>가져갈 한 문장<\/b>"}], "_바꾼곳": [{"자리": "시작 화면", "전": "실제로 시도해 보시기 바랍니다.", "후": "실제로 시도합니다.", "왜": "47 지시·청유 어미"}, {"자리": "시작 화면", "전": "잊는 것은 학습자의 부족함이 아니라 기억의 기본값입니다.", "후": "잊는 현상은 기억의 기본값이며 학습   /* 시작 화면 표지 무늬 · 파트 다섯이 한 줄로 이어지는 점과 선입니다 */
  var COVER_DECO = '<svg class="deco" viewBox="0 0 220 120" aria-hidden="true">' +
    '<path d="M14 96 C 52 96, 52 60, 90 60 S 128 26, 166 26 S 196 14, 208 10" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="2" stroke-dasharray="4 6"/>' +
    '<circle cx="14" cy="96" r="7" fill="#7FA0FF"/><circle cx="52" cy="80" r="7" fill="#8FB3DB"/>' +
    '<circle cx="90" cy="60" r="7" fill="#FFB27A"/><circle cx="128" cy="40" r="7" fill="#28E6C3"/>' +
    '<circle cx="166" cy="26" r="8" fill="#C9B3FF"/></svg>';

  function renderStart() {
    setPart(1);
    var resume = S.pos >= 0 && S.pos < U.length;
    var h = noticeHtml() + '<section class="hero">';
    h += '<div class="cover">' + COVER_DECO + '<div class="kick">' + ST.kicker + '</div>' +
         '<h1>' + ST.title + '</h1><p class="sub">' + ST.sub + '</p></div>';
    h += '<p class="intro">' + ST.intro + '</p>';
    h += '<ol class="path">';
    PARTS.forEach(function (P, i) {
      h += '<li><button data-go="' + firstOf(i + 1) + '"><span class="sk">' + P.key + '</span>' +
           '<span class="sn">' + P.name + '<small>' + P.sub + '</small></span></button></li>';
    });
    h += '</ol><div class="cta">';
    if (resume) h += '<button class="btn primary" data-go="' + S.pos + '">' + ST.resume + ' · ' + U[S.pos].no + '쪽</button>' +
                     '<button class="btn" data-go="0">' + ST.restart + '</button>';
    else h += '<button class="btn primary" data-go="0">' + ST.begin + '</button>';
    h += '</div>';
    h += '<div class="how"><h3 class="sec">' + ST.howTitle + '</h3><ol>';
    ST.how.forEach(function (x) { h += '<li>' + x + '</li>'; });
    h += '</ol></div>';
    if (ST.read) h += '<aside class="read"><div class="rt">' + ST.read.title + '</div><p>' + ST.read.body + '</p></aside>';
    h += '<p class="credit">' + ST.credit + '</p>';
    h += '</section>';
    view.innerHTML = h;
    bindGo(view);
  }

  function figureHtml(u) {
    if (!u.fig) return "";
    return '<figure class="fig">' + u.fig + (u.figcap ? '<figcaption>' + u.figcap + '</figcaption>' : '') + '</figure>';
  }
  /* 도해는 리드 문단 바로 뒤에 둡니다. 리드가 없으면 본문 맨 앞입니다 */
  function bodyWithFigure(u) {
    var html = u.html, fig = figureHtml(u);
    if (!fig) return html;
    var m = html.match(/<p class="lead">[\s\S]*?<\/p>/);
    if (m) { var at = m.index + m[0].length; return html.slice(0, at) + fig + html.slice(at); }
    return fig + html;
  }

  function renderUnit(i) {
    var u = U[i];
    if (!u.practice && !S.v[u.no]) { S.v[u.no] = 1; }
    S.pos = i; persist(false);
    setPart(u.part);
    var P = PARTS[u.part - 1];
    var h = noticeHtml();
    if (firstOf(u.part) === i) {
      h += '<div class="opener"><div class="ok">PART ' + u.part + ' · ' + P.key + '</div><div class="on">' + P.name + '</div>' +
           '<div class="os">' + P.sub + '</div><div class="om">';
      for (var k = 1; k <= PARTS.length; k++) h += '<i' + (k === u.part ? ' class="on"' : '') + '></i>';
      h += '</div></div>';
    }
    h += '<div class="uhead"><span class="chip">PART ' + u.part + ' · ' + P.key + '</span>' +
         (u.practice ? '<span class="chip work">생각해보기</span>' : '') +
         '<span class="uno"><b>' + u.no + '</b> / ' + TOTAL + '</span></div>';
    h += '<h2 class="utitle">' + u.title + '</h2>';
    h += '<div class="ubody">' + bodyWithFigure(u) + '</div>';
    if (u.bridge) h += '<p class="next-hint">' + u.bridge + '</p>';
    if (u.source) h += '<div class="src">출처 ' + u.source + '</div>';
    view.innerHTML = h;
    hydrate(view);
  }

  function renderAnswers() {
    setPart(1);
    var pr = U.filter(function (u) { return u.practice; });
    var filled = 0, total = 0;
    pr.forEach(function (u) { u.fields.forEach(function (f) { total++; var v = S.a[f.k]; if (v === true || (typeof v === "string" && v.trim())) filled++; }); });
    var h = '<div class="uhead"><span class="chip">내 답안</span></div>';
    h += '<h2 class="utitle">생각해보기 답안 모아보기</h2>';
    h += '<p class="meter">생각해보기 칸 <b>' + total + '</b>개 가운데 <b>' + filled + '</b>개를 채웠습니다.</p>';
    h += '<p class="notice">답안은 이 브라우저에만 저장되며 어디로도 전송되지 않습니다.</p>';
    h += '<div class="tools"><button class="btn primary" id="btnDl">답안 내려받기 (.md)</button>' +
         '<button class="btn" id="btnPrint">인쇄용 보기</button>' +
         '<button class="btn" id="btnReset">답안 모두 지우기</button></div><p class="note" id="note"></p>';
    pr.forEach(function (u) {
      var i = U.indexOf(u);
      h += '<section class="ans-unit"><h3><button data-go="' + i + '">' + u.no + '쪽 · ' + u.title + '</button></h3>';
      u.fields.forEach(function (f) {
        var v = S.a[f.k], txt, empty = false;
        if (v === true) txt = "확인함";
        else if (typeof v === "string" && v.trim()) txt = v;
        else { txt = "비어 있음"; empty = true; }
        h += '<div class="ans-f"><div class="c">' + esc(f.cap) + '</div><div class="v' + (empty ? ' empty' : '') + '">' + esc(txt) + '</div></div>';
      });
      h += '</section>';
    });
    view.innerHTML = h;
    bindGo(view);
    setupDownload();
    document.getElementById("btnPrint").addEventListener("click", function () { window.print(); });
    var rb = document.getElementById("btnReset"), armed = false, t = null;
    rb.addEventListener("click", function () {
      if (!armed) { armed = true; rb.textContent = "한 번 더 누르면 모두 지웁니다"; t = setTimeout(function () { armed = false; rb.textContent = "답안 모두 지우기"; }, 4000); return; }
      clearTimeout(t); S.a = {}; S.v = {}; persist(false); paintRail(0); renderAnswers();
      document.getElementById("note").textContent = "모든 답안을 지웠습니다.";
    });
  }

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  /* ── 입력 필드 연결 ── */
  function grow(t) { t.style.height = "auto"; t.style.height = (t.scrollHeight + 2) + "px"; }
  function hydrate(root) {
    root.querySelectorAll("textarea[data-k]").forEach(function (t) {
      var v = S.a[t.dataset.k]; if (typeof v === "string") t.value = v;
      requestAnimationFrame(function () { grow(t); });
      t.addEventListener("input", function () {
        grow(t); S.a[t.dataset.k] = t.value; persist(true); paintRail(U[cur] ? U[cur].part : 0); paintToc();
      });
    });
    root.querySelectorAll('input[type="checkbox"][data-k]').forEach(function (c) {
      c.checked = S.a[c.dataset.k] === true;
      c.addEventListener("change", function () {
        if (c.checked) S.a[c.dataset.k] = true; else delete S.a[c.dataset.k];
        persist(true); paintRail(U[cur] ? U[cur].part : 0); paintToc();
      });
    });
  }
  function bindGo(root) {
    root.querySelectorAll("[data-go]").forEach(function (b) {
      b.addEventListener("click", function () { go(parseInt(b.dataset.go, 10)); });
    });
  }

  /* ── 내려받기 ──
     원본은 클로드 화면 안에서만 내려받기가 됐습니다(window.claude). 그 밖의 브라우저에서는 단추가 숨어 있었습니다.
     이제 어디서 열어도 내려받기가 되도록 파일 만들기 길을 더했습니다. 클로드 화면 안이면 원래 길을 씁니다. */
  var dlNS = null, dlChecked = false;
  function buildMd() {
    var d = new Date();
    var md = "# 생성형 AI 입문과정 워크북 답안\n\n작성일 " + d.getFullYear() + "년 " + (d.getMonth() + 1) + "월 " + d.getDate() + "일\n";
    U.filter(function (u) { return u.practice; }).forEach(function (u) {
      md += "\n## " + u.plain + " (" + u.no + "쪽)\n";
      u.fields.forEach(function (f) {
        var v = S.a[f.k];
        var txt = v === true ? "확인함" : (typeof v === "string" && v.trim() ? v.trim() : "비어 있음");
        md += "\n### " + f.cap + "\n\n" + txt + "\n";
      });
    });
    return md;
  }
  function blobSave(note) {
    try {
      var blob = new Blob([buildMd()], { type: "text/markdown;charset=utf-8" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = "생성형AI입문과정_워크북_답안.md";
      document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
      if (note) note.textContent = "답안 파일을 내려받았습니다.";
    } catch (e) {
      if (note) note.textContent = "이 화면에서는 내려받기를 쓸 수 없습니다. 위 답안을 선택해 복사해 주세요.";
    }
  }
  function setupDownload() {
    var btn = document.getElementById("btnDl"); if (!btn) return;
    btn.onclick = function () {
      var note = document.getElementById("note");
      if (!dlNS) { blobSave(note); return; }
      dlNS.save({ filename: "생성형AI입문과정_워크북_답안.md", data: buildMd() }).then(function (r) {
        if (r && r.status === "saved") note.textContent = "답안 파일을 내려받았습니다.";
      }).catch(function (e) {
        var c = e && e.code;
        if (c === "declined") note.textContent = "내려받기를 취소했습니다.";
        else if (c === "rate_limited") note.textContent = "이미 열린 확인 창이 있습니다. 잠시 후 다시 눌러 주세요.";
        else blobSave(note);
      });
    };
    if (dlChecked) return;
    try {
      if (window.claude && typeof window.claude.use === "function") {
        window.claude.use("downloads").then(function (ns) { dlNS = ns; dlChecked = true; }, function () { dlChecked = true; });
      } else dlChecked = true;
    } catch (e) { dlChecked = true; }
  }

  /* ── 목차 패널 ── */
  var drawer = document.getElementById("drawer"), scrim = document.getElementById("scrim"), btnToc = document.getElementById("btnToc");
  function buildToc() {
    var h = "";
    PARTS.forEach(function (P, pi) {
      h += '<div class="grp"><div class="gh">' + P.key + ' <span>' + P.name + '</span></div>';
      U.forEach(function (u, i) {
        if (u.part !== pi + 1) return;
        h += '<button class="toc-item" data-i="' + i + '"><span class="n">' + u.no + '</span><span>' + u.title + '</span><span class="st"></span></button>';
      });
      h += '</div>';
    });
    document.getElementById("tocList").innerHTML = h;
    document.querySelectorAll(".toc-item").forEach(function (b) {
      b.addEventListener("click", function () { closeToc(); go(parseInt(b.dataset.i, 10)); });
    });
  }
  function paintToc() {
    document.querySelectorAll(".toc-item").forEach(function (b) {
      var i = parseInt(b.dataset.i, 10), u = U[i], st = b.querySelector(".st");
      b.classList.toggle("cur", i === cur);
      st.textContent = u.practice ? "생각해보기" : "";
    });
  }
  function openToc() { paintToc(); drawer.classList.add("open"); scrim.classList.add("open"); drawer.setAttribute("aria-hidden", "false"); btnToc.setAttribute("aria-expanded", "true"); var c = drawer.querySelector(".toc-item.cur") || drawer.querySelector(".toc-item"); if (c) { c.scrollIntoView({ block: "center" }); c.focus(); } }
  function closeToc() { drawer.classList.remove("open"); scrim.classList.remove("open"); drawer.setAttribute("aria-hidden", "true"); btnToc.setAttribute("aria-expanded", "false"); }
  btnToc.addEventListener("click", openToc);
  document.getElementById("btnClose").addEventListener("click", function () { closeToc(); btnToc.focus(); });
  scrim.addEventListener("click", closeToc);

  /* ── 이동 ── */
  var prev = document.getElementById("btnPrev"), next = document.getElementById("btnNext"), posTxt = document.getElementById("posTxt");
  function go(i) {
    if (i === -1) location.hash = "start";
    else if (i === -2) location.hash = "answers";
    else location.hash = "p" + U[i].no;
  }
  function route() {
    var hs = location.hash.replace("#", "");
    var i = -1;
    if (hs === "answers") i = -2;
    else if (/^p\d+$/.test(hs)) {
      var n = parseInt(hs.slice(1), 10);
      for (var k = 0; k < U.length; k++) if (U[k].no === n) { i = k; break; }
    }
    cur = i;
    if (i === -1) renderStart();
    else if (i === -2) renderAnswers();
    else renderUnit(i);
    paint();
    view.classList.remove("fade"); void view.offsetWidth; view.classList.add("fade");
    window.scrollTo(0, 0);
  }
  function paint() {
    var part = cur >= 0 ? U[cur].part : 0;
    paintRail(part); paintToc();
    if (cur >= 0) {
      posTxt.innerHTML = '<b>' + U[cur].no + '</b>쪽 / ' + TOTAL;
      prev.disabled = false; next.disabled = cur >= U.length - 1;
      next.lastChild && (next.firstChild.textContent = cur >= U.length - 1 ? "끝" : "다음");
    } else if (cur === -1) {
      posTxt.innerHTML = '<b>시작</b>';
      prev.disabled = true; next.disabled = false; next.firstChild.textContent = "다음";
    } else {
      posTxt.innerHTML = '<b>내 답안</b>';
      prev.disabled = false; next.disabled = true;
    }
  }
  prev.addEventListener("click", function () {
    if (cur > 0) go(cur - 1); else if (cur === 0) go(-1); else if (cur === -2) go(S.pos >= 0 ? S.pos : -1);
  });
  next.addEventListener("click", function () {
    if (cur === -1) go(S.pos >= 0 ? S.pos : 0); else if (cur >= 0 && cur < U.length - 1) go(cur + 1);
  });
  document.getElementById("btnHome").addEventListener("click", function () { go(-1); });
  document.getElementById("btnAns").addEventListener("click", function () { go(-2); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && drawer.classList.contains("open")) { closeToc(); btnToc.focus(); return; }
    var tg = e.target && e.target.tagName;
    if (tg === "TEXTAREA" || tg === "INPUT") return;
    if (e.key === "ArrowRight" && !next.disabled) next.click();
    if (e.key === "ArrowLeft" && !prev.disabled) prev.click();
  });
  window.addEventListener("hashchange", route);

  buildToc();
  route();
})();
</script>
</body>
</html>
